<!doctype html>

<head>

<meta name="description" content="제조업 근로자를 위한 4개 언어(한국어·Filipino·ไทย·Tiếng Việt) 모바일 안전보건 교재">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>안전보건 나침반 모바일</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Noto+Sans:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow reading column (max 640px) like a pocket handbook; hazard-stripe band marks the brand, sign colors (red/yellow/blue/green) carry meaning only */
:root {
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --sunk: #E8EAE5;
  --ink: #15191F;
  --ink-2: #4A515C;
  --line: #D5D9D2;
  --chrome: #15191F;
  --hazard: #F5B800;
  --hazard-ink: #15191F;
  --ban: #D52B2B;
  --must: #1D5FB4;
  --ok: #17805A;
  --ok-soft: #E3F2EB;
  --bad-soft: #FBE7E5;
  --note-soft: #FFF5D1;
  --sign-bg: #FFFFFF;
  --shadow: 0 1px 2px rgba(20,25,31,.06), 0 4px 14px rgba(20,25,31,.06);
  --f-body: "Noto Sans KR", "Noto Sans", "Noto Sans Thai", system-ui, sans-serif;
  --f-num: "Barlow Condensed", "Noto Sans", sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --surface: #1A1F25; --sunk: #232931; --ink: #EEF0EC; --ink-2: #A9B0BA; --line: #2E353E;
    --hazard: #F5B800; --hazard-ink: #15191F; --ban: #FF6B5E; --must: #6FA6F2; --ok: #4CC79A;
    --ok-soft: #173229; --bad-soft: #3A1E1D; --note-soft: #362D10; --sign-bg: #F4F4F0;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1A1F25; --sunk: #232931; --ink: #EEF0EC; --ink-2: #A9B0BA; --line: #2E353E;
  --hazard: #F5B800; --hazard-ink: #15191F; --ban: #FF6B5E; --must: #6FA6F2; --ok: #4CC79A;
  --ok-soft: #173229; --bad-soft: #3A1E1D; --note-soft: #362D10; --sign-bg: #F4F4F0;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
:lang(th) body, body:lang(th) { line-height: 1.8; }
html[lang="vi"] body, html[lang="tl"] body { font-family: "Noto Sans", "Noto Sans KR", system-ui, sans-serif; }
html[lang="th"] body { font-family: "Noto Sans Thai", "Noto Sans", "Noto Sans KR", system-ui, sans-serif; line-height: 1.8; }
.ko-sub { font-family: "Noto Sans KR", system-ui, sans-serif; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--must); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--chrome); color: #fff; }
.bar-in { max-width: 640px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; background: none; border: 0; padding: 0; color: #fff; margin-right: auto; }
.brand i { width: 22px; height: 22px; border-radius: 4px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 5px, #15191F 5px 10px); }
.langs { display: flex; gap: 2px; background: rgba(255,255,255,.1); padding: 3px; border-radius: 999px; }
.langs button { border: 0; background: transparent; color: rgba(255,255,255,.75); padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.langs button[aria-pressed="true"] { background: var(--hazard); color: var(--hazard-ink); }
.stripe { height: 6px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, #15191F 12px 24px); }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 120px; }

/* home */
.hero { padding-block: 8px 20px; display: grid; gap: 10px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--ink-2); }
.hero h1 { font-size: clamp(28px, 7.5vw, 38px); font-weight: 900; white-space: pre-line; letter-spacing: -.01em; }
.hero p { margin: 0; color: var(--ink-2); max-width: 34em; }
.prog { display: grid; gap: 6px; margin-top: 6px; }
.prog-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.prog-top b { font-family: var(--f-num); font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.track span { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .4s; }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--hazard); color: var(--hazard-ink); font-weight: 800; padding: 13px 20px; border-radius: var(--r); font-size: 16px; }

.part { margin-top: 28px; }
.part-head { display: grid; grid-template-columns: auto 1fr; gap: 0 14px; align-items: end; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.part-no { font-family: var(--f-num); font-weight: 800; font-size: 56px; line-height: .8; grid-row: span 2; }
.part-no small { display: block; font-size: 13px; letter-spacing: .12em; font-weight: 600; color: var(--ink-2); line-height: 1.4; }
.part-head h2 { font-size: 19px; font-weight: 800; }
.part-head p { margin: 0; font-size: 13px; color: var(--ink-2); }
.group { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--ink-2); padding: 16px 0 4px; text-transform: uppercase; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows button { width: 100%; text-align: left; display: grid; grid-template-columns: 34px 1fr 24px; gap: 10px; align-items: center; padding: 12px 0; background: none; border: 0; border-bottom: 1px solid var(--line); }
.rows .n { font-family: var(--f-num); font-weight: 600; font-size: 18px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rows .t { font-weight: 700; min-width: 0; }
.rows .t small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); }
.chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.chk.on { background: var(--ok); border-color: var(--ok); }
.chk.on::after { content: ""; width: 9px; height: 5px; border: solid #fff; border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px,-1px); }

.quizcard { margin-top: 32px; background: var(--chrome); border: 1px solid var(--line); color: #fff; border-radius: 14px; padding: 20px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.quizcard::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, #15191F 12px 24px); }
.quizcard h2 { font-size: 22px; font-weight: 900; margin-top: 4px; }
.quizcard p { margin: 0; color: rgba(255,255,255,.75); }
.quizcard .cta { justify-self: start; }
.src { margin-top: 32px; font-size: 12px; color: var(--ink-2); line-height: 1.6; }

/* lesson */
.crumb { font-size: 13px; color: var(--ink-2); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.crumb b { white-space: nowrap; flex: none; font-family: var(--f-num); font-size: 15px; background: var(--ink); color: var(--bg); padding: 0 7px; border-radius: 4px; letter-spacing: .04em; }
.ltitle { font-size: clamp(26px, 7vw, 34px); font-weight: 900; margin: 8px 0 2px; }
.ltitle-ko { color: var(--ink-2); font-size: 15px; font-weight: 500; margin: 0 0 6px; }
.blocks { display: grid; gap: 18px; margin-top: 18px; }
.blocks > * { margin: 0; min-width: 0; }
.lead { font-size: 18px; font-weight: 500; }
.blocks h3 { font-size: 17px; font-weight: 800; padding-top: 6px; display: flex; gap: 8px; align-items: center; }
.blocks h3::before { content: ""; width: 4px; height: 18px; background: var(--ink); border-radius: 2px; flex: none; }
.blocks h3.do::before { background: var(--ok); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps li::before { content: counter(s); font-family: var(--f-num); font-weight: 800; font-size: 17px; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; margin-top: 1px; }
.steps.do li { background: var(--ok-soft); padding: 10px 12px; border-radius: var(--r); }
.steps.do li::before { background: var(--ok); color: #fff; }
.steps.bad li::before { background: var(--ban); color: #fff; }
.dots { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.stat { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 14px 16px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border-left: 6px solid var(--ban); }
.stat b { font-family: var(--f-num); font-size: 48px; font-weight: 800; line-height: 1; color: var(--ban); font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--ink-2); }
.def { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.def strong { font-size: 15px; }
.def ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.def p { margin: 0; }
.note, .warn { padding: 12px 14px; border-radius: var(--r); background: var(--note-soft); display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
.note::before, .warn::before { content: "!"; width: 22px; height: 22px; border-radius: 50%; background: var(--hazard); color: var(--hazard-ink); font-weight: 900; display: grid; place-items: center; font-size: 14px; margin-top: 2px; }
.warn { background: var(--bad-soft); }
.warn::before { content: "✕"; background: var(--ban); color: #fff; font-size: 12px; }
.case { border: 2px solid var(--ban); border-radius: var(--r); overflow: hidden; }
.case > div { padding: 12px 14px; }
.case .ck { background: var(--ban); color: #fff; font-weight: 800; padding: 6px 14px; font-size: 14px; }
.case .cl { background: var(--ok-soft); border-top: 1px solid var(--line); }
.case .cl b { color: var(--ok); margin-right: 6px; }
.kv { display: grid; border-top: 1px solid var(--line); margin: 0; }
.kv div { display: grid; grid-template-columns: minmax(96px, 34%) 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv dt { font-weight: 700; font-size: 14px; }
.kv dd { margin: 0; font-size: 15px; }
.signs h4 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.signs h4 i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.signs.ban h4 i { background: var(--ban); border-radius: 50%; }
.signs.caution h4 i { background: var(--hazard); clip-path: polygon(50% 0, 100% 100%, 0 100%); border-radius: 0; }
.signs.must h4 i { background: var(--must); border-radius: 50%; }
.signs.info h4 i { background: var(--ok); }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.sgrid figure { margin: 0; background: var(--sign-bg); border-radius: 8px; padding: 8px 4px 8px; text-align: center; border: 1px solid var(--line); }
.sgrid .sg { width: 60px; height: 60px; display: block; margin: 0 auto 6px; }
.sgrid figcaption { font-size: 12.5px; font-weight: 700; line-height: 1.3; color: #15191F; }
.sgrid figcaption small, .ppe small { display: block; font-weight: 400; font-size: 11px; color: #5A616B; }
.ppe { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ppe figure { margin: 0; background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.ppe .ph { background: #fff; display: grid; place-items: center; height: 104px; padding: 8px; }
.ppe .ph img { max-height: 88px; width: auto; }
.ppe figcaption { padding: 8px 10px 10px; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.ppe figcaption b { display: block; color: var(--ink); font-size: 15px; }
.ppe figcaption small { color: var(--ink-2); }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pics figure { margin: 0; }
.pics img, .pic img { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--sunk); }
.pics figcaption { font-size: 13.5px; margin-top: 6px; line-height: 1.45; display: grid; grid-template-columns: 20px 1fr; gap: 6px; }
.pics figcaption b { font-family: var(--f-num); font-weight: 800; width: 20px; height: 20px; border-radius: 50%; background: var(--ban); color: #fff; display: grid; place-items: center; font-size: 13px; }
.pic { margin: 0; }
.pic figcaption { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.call { background: var(--ban); color: #fff; border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.call b { font-family: var(--f-num); font-size: 56px; font-weight: 800; line-height: .9; grid-row: span 2; }
.call strong { font-size: 16px; }
.call span { font-size: 13px; opacity: .92; }

.mark { margin-top: 26px; width: 100%; border: 2px solid var(--ok); background: transparent; color: var(--ok); font-weight: 800; padding: 13px; border-radius: var(--r); display: flex; gap: 8px; justify-content: center; align-items: center; }
.mark[aria-pressed="true"] { background: var(--ok); color: #fff; }

.pager { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.pager-in { max-width: 640px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; }
.pager button { border: 1px solid var(--line); background: var(--surface); padding: 11px 10px; border-radius: var(--r); font-weight: 700; font-size: 14px; min-width: 0; }
.pager .nx { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pager button:disabled { opacity: .35; cursor: default; }

/* quiz */
.qhead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.qhead b { font-family: var(--f-num); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.qq { font-size: 21px; font-weight: 800; margin: 14px 0 16px; }
.opts { display: grid; gap: 10px; }
.opts button { text-align: left; padding: 14px 16px; border-radius: var(--r); border: 2px solid var(--line); background: var(--surface); font-weight: 600; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; }
.opts button span:first-child { font-family: var(--f-num); font-weight: 800; width: 26px; height: 26px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; }
.opts button.ok { border-color: var(--ok); background: var(--ok-soft); }
.opts button.ok span:first-child { background: var(--ok); color: #fff; }
.opts button.no { border-color: var(--ban); background: var(--bad-soft); }
.opts button.no span:first-child { background: var(--ban); color: #fff; }
.opts button:disabled { cursor: default; color: var(--ink); }
.fb { margin-top: 14px; padding: 12px 14px; border-radius: var(--r); background: var(--sunk); }
.fb b { display: block; }
.fb.ok b { color: var(--ok); } .fb.no b { color: var(--ban); }
.qnext { margin-top: 16px; width: 100%; }
.score { text-align: center; padding: 30px 0 10px; display: grid; gap: 10px; justify-items: center; }
.score .big { font-family: var(--f-num); font-weight: 800; font-size: 96px; line-height: 1; }
.score .big small { font-size: 36px; color: var(--ink-2); }

.srcbox { font-size: 12.5px; color: var(--ink-2); border-top: 1px dashed var(--line); padding-top: 10px; }
.srcbox b { font-size: 12px; letter-spacing: .06em; }
.srcbox ul { margin: 4px 0 0; padding-left: 1.1em; }
.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.help > div { background: var(--chrome); color: #fff; border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.help b { font-family: var(--f-num); font-size: 36px; font-weight: 800; line-height: 1; color: var(--hazard); font-variant-numeric: tabular-nums; }
.help strong { font-size: 15px; }
.help span { font-size: 13px; opacity: .85; }
.ico .hz { stroke: var(--ban); }
.lic { width: 88px; height: 88px; border-radius: 16px; background: var(--surface); border: 2px solid var(--ink); display: grid; place-items: center; margin-top: 14px; color: var(--ink); }
.ppe .ph .ico { color: #15191F; }
.scenebox { margin: 14px 0 0; border-radius: 14px; overflow: hidden; border: 2px solid var(--ink); background: #E6EBEF; }
.scene { display: block; width: 100%; height: auto; }
.blocks ul.cklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cklist label { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
.cklist input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.cklist input:checked + span { color: var(--ink-2); text-decoration: line-through; }
.photo { margin: 0; border-radius: 14px; overflow: hidden; border: 2px solid var(--ok); background: var(--surface); }
.photo img { display: block; width: 100%; height: auto; }
.photo figcaption { padding: 12px 14px; display: grid; gap: 6px; }
.photo figcaption b { color: var(--ok); font-size: 15px; }
.photo .ai { font-size: 11.5px; color: var(--ink-2); }
.photo ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; font-size: 14.5px; }
.namecard { margin-top: 18px; background: var(--surface); border: 2px solid var(--hazard); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.namecard h2 { font-size: 18px; font-weight: 800; }
.namecard .notice { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.namecard form { display: flex; gap: 8px; }
.namecard form .cta { flex: none; padding: 11px 16px; }
.namecard input { flex: 1; min-width: 0; width: 0; font: inherit; font-size: 17px; padding: 11px 12px; border: 2px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--ink); }
.namecard input:focus { border-color: var(--ink); outline: none; }
.namecard .hint, .cert .hint { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.namecard.on { border-color: var(--ok); gap: 8px; }
.namecard.on b { font-size: 18px; }
.namebtns { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--ink-2); text-decoration: underline; font-size: 14px; }
.cta.small { padding: 9px 14px; font-size: 14px; }
.sync { font-size: 12px; color: var(--ink-2); }
.cert { border: 3px solid var(--ok); border-radius: 16px; overflow: hidden; background: var(--surface); }
.cert-top { background: var(--ok); color: #fff; font-weight: 800; font-size: 18px; padding: 14px 16px; }
.cert dl { margin: 0; padding: 8px 16px; }
.cert dl div { display: grid; grid-template-columns: 40% 1fr; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cert dt { color: var(--ink-2); font-size: 14px; }
.cert dd { margin: 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.cert dd b { font-family: var(--f-num); font-size: 26px; }
.cert dd.nm { font-weight: 800; font-size: 20px; }
.cert .track { margin: 6px 16px 10px; }

.score { justify-items: center; }

.ways { display: grid; gap: 10px; margin-top: 10px; }
.way { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; position: relative; }
.way h3 { font-size: 16px; font-weight: 800; }
.way p { margin: 6px 0 0; font-size: 15px; }
.way.mine { border: 2px solid var(--hazard); }
.way .tag { position: absolute; top: -10px; right: 12px; background: var(--hazard); color: var(--hazard-ink); font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; }
.hint { font-size: 12.5px; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const g = (t, inner) => `<g transform="${t}">${inner}</g>`;

    { t: "p", x: L("성희롱은 '그럴 뜻이 없었다'로 판단하지 않습니다. 피해자와 같은 처지의 보통 사람이 불쾌하고 굴욕적으로 느낄 만한지를 봅니다. 한 번뿐이어도, 회사 밖 회식이나 메신저에서 일어나도 성희롱이 될 수 있습니다.",

      L("1년에 1번 이상 성희롱 예방교육을 하고, 그 내용을 누구나 볼 수 있게 게시합니다.", "Magbigay ng training sa pag-iwas sa sexual harassment kahit isang beses sa isang taon at ipaskil ang nilalaman.", "จัดอบรมป้องกันการล่วงละเมิดทางเพศอย่างน้อยปีละครั้ง และติดประกาศเนื้อหาให้ทุกคนเห็น", "Đào tạo phòng chống quấy rối tình dục ít nhất 1 lần/năm và niêm yết nội dung cho mọi người xem."),
      L("신고 담당자와 연락 방법을 정해 알립니다. 외국인 근로자도 이해할 수 있게 안내합니다.", "Itakda at ipaalam ang taong tatanggap ng ulat at paraan ng pakikipag-ugnayan—pati sa dayuhang manggagawa.", "กำหนดและแจ้งผู้รับเรื่องและช่องทางติดต่อ ให้คนงานต่างชาติเข้าใจด้วย", "Chỉ định và thông báo người tiếp nhận báo cáo, cách liên lạc, sao cho cả lao động nước ngoài hiểu.")
    ]}
  ], ["남녀고용평등법 제13조(성희롱 예방교육), 제29조의2~제29조의3(노동위원회 시정명령), 제39조 제1항(시정명령 불이행 과태료 1억원 이하)", "근로기준법 제93조 제11호(취업규칙: 직장 내 괴롭힘 예방 및 발생 시 조치)"]);

// PART 5 확대: 새 단원 6개 (맨 뒤에 추가 → 기존 주차 배정 유지)
(() => {
  const P5 = window.NEW_PARTS[window.NEW_PARTS.length - 1];
  const H = (ko, tl, th, vi, tone) => ({ t: "h", x: L(ko, tl, th, vi), tone });
  const QA = (q, a) => ({ t: "def", k: q, v: a });

  P5.lessons.push(
  // ---------- 1. 괴롭힘 Q&A ----------
  { id: "p4-5", title: L("괴롭힘, 이것도 해당될까? (Q&A)", "Panliligalig ba ito? (Q&A)", "แบบนี้นับเป็นการกลั่นแกล้งไหม (ถาม-ตอบ)", "Thế này có phải quấy rối không? (Hỏi-đáp)"),
    blocks: [
      { t: "lead", x: L("현장에서 자주 받는 질문입니다. 판단의 기준은 '업무에 필요한 범위였는가, 그리고 사람을 존중했는가'입니다.",
        "Mga madalas itanong sa trabaho. Ang batayan: 'Kailangan ba ito sa trabaho, at iginalang ba ang tao?'",
        "คำถามที่พบบ่อยในหน้างาน เกณฑ์คือ 'จำเป็นต่องานหรือไม่ และเคารพคนหรือไม่'",
        "Những câu hỏi hay gặp tại hiện trường. Tiêu chí là 'có cần thiết cho công việc không, và có tôn trọng con người không'.") },
      QA(L("Q. 반장이 큰 소리로 혼냈어요. 괴롭힘인가요?", "Q. Sinigawan ako ng team leader. Panliligalig ba?", "Q. หัวหน้าดุเสียงดัง เป็นการกลั่นแกล้งไหม", "Q. Tổ trưởng mắng to tiếng. Có phải quấy rối không?"),
        L("A. 위험한 행동을 즉시 멈추게 하려고 소리친 것은 괴롭힘이 아닙니다. 하지만 욕설·인격 모독이 섞이거나, 같은 일로 여러 사람 앞에서 계속 망신을 준다면 괴롭힘이 될 수 있습니다.",
          "A. Hindi panliligalig ang pagsigaw para agad patigilin ang delikadong kilos. Pero kapag may mura o pang-iinsulto, o paulit-ulit kang pinapahiya sa harap ng iba, puwede itong maging panliligalig.",
          "A. ตะโกนเพื่อหยุดการกระทำที่อันตรายทันที ไม่ใช่การกลั่นแกล้ง แต่ถ้ามีคำหยาบ ดูหมิ่น หรือประจานซ้ำ ๆ ต่อหน้าคนอื่น อาจเป็นการกลั่นแกล้ง",
          "A. Hét lên để dừng ngay hành động nguy hiểm thì không phải quấy rối. Nhưng nếu kèm chửi bới, xúc phạm nhân cách, hoặc liên tục làm nhục trước nhiều người thì có thể là quấy rối.")),
      QA(L("Q. 회식에 안 가면 눈치를 줘요.", "Q. Pinaparinggan ako kapag hindi sumama sa company dinner.", "Q. ไม่ไปงานเลี้ยงแล้วถูกมองไม่ดี", "Q. Không đi liên hoan thì bị khó chịu ra mặt."),
        L("A. 회식은 강제가 아닙니다. 참석하지 않았다고 일을 몰아주거나 따돌린다면 괴롭힘에 해당할 수 있습니다. 술을 억지로 권하는 것도 마찬가지입니다.",
          "A. Hindi sapilitan ang company dinner. Kapag dinagdagan ang trabaho mo o ibinukod ka dahil hindi sumama, puwedeng panliligalig. Ganoon din ang pagpilit uminom.",
          "A. งานเลี้ยงไม่ใช่การบังคับ ถ้าไม่ไปแล้วถูกโยนงานหรือกีดกัน อาจเป็นการกลั่นแกล้ง การบังคับดื่มเหล้าก็เช่นกัน",
          "A. Liên hoan không bắt buộc. Không đi mà bị dồn việc hay cô lập thì có thể là quấy rối. Ép uống rượu cũng vậy.")),
      QA(L("Q. 쉬는 날에도 계속 연락이 와요.", "Q. Patuloy akong kinokontak kahit day off.", "Q. วันหยุดก็ยังติดต่อมาเรื่อย ๆ", "Q. Ngày nghỉ vẫn liên tục bị gọi, nhắn."),
        L("A. 급한 사고·설비 문제로 한 번 연락하는 것은 업무일 수 있습니다. 하지만 급하지 않은 일로 밤늦게나 휴일마다 반복해서 연락하고 답을 강요하면 괴롭힘이 될 수 있습니다.",
          "A. Puwedeng trabaho ang isang tawag dahil sa emergency. Pero kapag paulit-ulit sa gabi o day off para sa hindi agarang bagay at pinipilit kang sumagot, puwedeng panliligalig.",
          "A. ติดต่อครั้งเดียวเพราะอุบัติเหตุหรือเครื่องเสียด่วนอาจเป็นเรื่องงาน แต่ถ้าติดต่อซ้ำ ๆ ดึกดื่นหรือวันหยุดในเรื่องไม่ด่วนและบังคับให้ตอบ อาจเป็นการกลั่นแกล้ง",
          "A. Liên lạc một lần vì sự cố gấp có thể là công việc. Nhưng liên tục nhắn đêm khuya, ngày nghỉ vì việc không gấp và ép trả lời thì có thể là quấy rối.")),
      QA(L("Q. 한국어를 못 한다고 놀려요.", "Q. Tinutukso ako dahil hindi magaling sa Korean.", "Q. ถูกล้อว่าพูดเกาหลีไม่เก่ง", "Q. Bị trêu vì không giỏi tiếng Hàn."),
        L("A. 말투·발음·국적·피부색을 놀리는 것은 업무와 관계없는 모욕입니다. 반복되면 괴롭힘이고, 회사는 이를 멈추게 할 의무가 있습니다.",
          "A. Pang-iinsulto na walang kinalaman sa trabaho ang pagtukso sa punto, bigkas, nasyonalidad o kulay ng balat. Kapag paulit-ulit, panliligalig ito at dapat itong patigilin ng kumpanya.",
          "A. การล้อสำเนียง การออกเสียง สัญชาติ สีผิว เป็นการดูถูกที่ไม่เกี่ยวกับงาน ถ้าซ้ำ ๆ คือการกลั่นแกล้ง และบริษัทมีหน้าที่ต้องหยุดมัน",
          "A. Trêu giọng nói, phát âm, quốc tịch, màu da là xúc phạm không liên quan công việc. Lặp lại thì là quấy rối, công ty có nghĩa vụ chấm dứt.")),
      QA(L("Q. 나만 힘든 일을 계속 시켜요.", "Q. Ako lang lagi ang binibigyan ng mabigat na trabaho.", "Q. ให้ฉันทำงานหนักอยู่คนเดียว", "Q. Chỉ mình tôi luôn bị giao việc nặng."),
        L("A. 일의 배분은 회사가 정할 수 있지만, 이유 없이 특정 사람에게만 위험하거나 힘든 일을 계속 몰아주는 것은 괴롭힘이 될 수 있습니다. 날짜와 내용을 기록해 두세요.",
          "A. Ang kumpanya ang nagbabahagi ng trabaho, pero puwedeng panliligalig kapag walang dahilan na laging iisang tao ang binibigyan ng delikado o mabigat na trabaho. Itala ang petsa at detalye.",
          "A. บริษัทจัดสรรงานได้ แต่การโยนงานอันตรายหรือหนักให้คนเดียวตลอดโดยไม่มีเหตุผล อาจเป็นการกลั่นแกล้ง ให้จดวันที่และรายละเอียดไว้",
          "A. Công ty được phân công việc, nhưng vô cớ chỉ dồn việc nguy hiểm, nặng cho một người có thể là quấy rối. Hãy ghi lại ngày và nội dung."))
    ]},

  // ---------- 2. 성희롱 Q&A ----------
  { id: "p4-6", title: L("성희롱, 이것도 해당될까? (Q&A)", "Sexual harassment ba ito? (Q&A)", "แบบนี้นับเป็นการล่วงละเมิดทางเพศไหม (ถาม-ตอบ)", "Thế này có phải quấy rối tình dục không? (Hỏi-đáp)"),
    blocks: [
      { t: "lead", x: L("'나는 칭찬이었다', '장난이었다'는 기준이 아닙니다. 듣는 사람이 성적으로 불쾌하고 굴욕적으로 느낄 만한지가 기준입니다.",
        "Hindi batayan ang 'papuri lang' o 'biro lang'. Ang batayan ay kung makakaramdam ng sekswal na pagkasuklam o kahihiyan ang nakarinig.",
        "'แค่ชม' หรือ 'แค่ล้อเล่น' ไม่ใช่เกณฑ์ เกณฑ์คือผู้ฟังจะรู้สึกไม่พอใจหรืออับอายทางเพศหรือไม่",
        "'Tôi chỉ khen', 'chỉ đùa thôi' không phải tiêu chí. Tiêu chí là người nghe có cảm thấy khó chịu, nhục nhã về mặt tình dục không.") },
      QA(L("Q. \"오늘 예쁘네\"도 성희롱인가요?", "Q. Sexual harassment ba ang \"Ang ganda mo ngayon\"?", "Q. \"วันนี้สวยนะ\" ก็เป็นการล่วงละเมิดไหม", "Q. \"Hôm nay xinh thế\" cũng là quấy rối à?"),
        L("A. 한 번의 가벼운 인사는 보통 해당하지 않습니다. 하지만 몸매·옷차림을 성적으로 평가하거나, 싫다고 했는데도 계속하면 성희롱이 될 수 있습니다.",
          "A. Karaniwang hindi kasama ang isang magaan na bati. Pero kapag sekswal na pagkomento sa katawan o damit, o patuloy kahit sinabing ayaw, puwedeng sexual harassment.",
          "A. ทักทายเบา ๆ ครั้งเดียวมักไม่เข้าข่าย แต่ถ้าวิจารณ์รูปร่างหรือการแต่งตัวในเชิงเพศ หรือทำต่อทั้งที่บอกว่าไม่ชอบ อาจเป็นการล่วงละเมิด",
          "A. Một lời chào nhẹ một lần thường không tính. Nhưng bình phẩm cơ thể, trang phục theo hướng tình dục, hoặc vẫn tiếp tục khi đã bị nói không thích thì có thể là quấy rối.")),
      QA(L("Q. 남자끼리, 여자끼리도 성희롱이 되나요?", "Q. Puwede ba ito sa parehong kasarian?", "Q. ผู้ชายด้วยกัน ผู้หญิงด้วยกัน ก็เป็นการล่วงละเมิดได้ไหม", "Q. Giữa nam với nam, nữ với nữ cũng là quấy rối?"),
        L("A. 네. 성별과 상관없습니다. 남자 동료의 바지를 장난으로 내리거나, 음란한 사진을 단체로 보여 주는 것도 성희롱입니다.",
          "A. Oo. Walang kinalaman ang kasarian. Sexual harassment din ang pagbaba ng pantalon ng lalaking kasama bilang biro o pagpapakita ng bastos na larawan sa grupo.",
          "A. ใช่ ไม่เกี่ยวกับเพศ การแกล้งดึงกางเกงเพื่อนชาย หรือเปิดรูปลามกให้กลุ่มดู ก็เป็นการล่วงละเมิด",
          "A. Có. Không phân biệt giới tính. Đùa kéo quần đồng nghiệp nam hay cho cả nhóm xem ảnh đồi trụy cũng là quấy rối tình dục.")),
      QA(L("Q. 단체 채팅방에 야한 사진을 올리는 건요?", "Q. Paano ang pag-post ng bastos na larawan sa group chat?", "Q. โพสต์รูปโป๊ในกลุ่มแชทล่ะ", "Q. Đăng ảnh khiêu dâm vào nhóm chat thì sao?"),
        L("A. 업무 관련 채팅방이면 직장 안과 같습니다. 보는 사람이 불쾌하면 성희롱이고, 내용에 따라 범죄가 될 수도 있습니다.",
          "A. Kapag group chat ng trabaho, parang nasa loob ng trabaho. Sexual harassment kapag nainis ang nakakita, at puwedeng krimen depende sa nilalaman.",
          "A. ถ้าเป็นกลุ่มแชทเกี่ยวกับงานก็เหมือนในที่ทำงาน ถ้าคนเห็นไม่พอใจคือการล่วงละเมิด และอาจเป็นอาชญากรรมขึ้นกับเนื้อหา",
          "A. Nhóm chat liên quan công việc thì như ở nơi làm việc. Người xem khó chịu là quấy rối, tùy nội dung còn có thể là tội phạm.")),
      QA(L("Q. 피해자가 그 자리에서 웃었다면요?", "Q. Paano kung ngumiti ang biktima noon?", "Q. ถ้าผู้เสียหายหัวเราะตอนนั้นล่ะ", "Q. Nếu nạn nhân cười lúc đó thì sao?"),
        L("A. 상사 앞에서 분위기를 깨기 어려워 웃는 경우가 많습니다. 웃었다고 동의한 것이 아닙니다. 거절하지 못한 것은 피해자의 잘못이 아닙니다.",
          "A. Madalas ngumingiti dahil mahirap sirain ang usapan sa harap ng boss. Hindi pagpayag ang pagngiti. Hindi kasalanan ng biktima na hindi siya nakatanggi.",
          "A. หลายครั้งหัวเราะเพราะไม่กล้าทำให้บรรยากาศเสียต่อหน้าหัวหน้า หัวเราะไม่ได้แปลว่ายินยอม การปฏิเสธไม่ได้ไม่ใช่ความผิดของผู้เสียหาย",
          "A. Nhiều khi cười vì khó làm mất không khí trước cấp trên. Cười không có nghĩa là đồng ý. Không từ chối được không phải lỗi của nạn nhân.")),
      QA(L("Q. 퇴근 후 개인 메시지로 \"보고 싶다\"고 계속 보내요.", "Q. Pagkatapos ng trabaho, paulit-ulit na nagme-message ng \"Miss na kita\".", "Q. หลังเลิกงานส่งข้อความส่วนตัวว่า \"คิดถึง\" ซ้ำ ๆ", "Q. Sau giờ làm cứ nhắn riêng \"nhớ em\"."),
        L("A. 직장 관계를 이용해 원하지 않는 사적인 연락을 계속하면 성희롱이 될 수 있고, 반복되면 스토킹 범죄가 될 수도 있습니다. 메시지를 지우지 말고 저장하세요.",
          "A. Kapag ginamit ang relasyon sa trabaho para sa paulit-ulit na hindi gustong personal na mensahe, puwedeng sexual harassment, at kapag tuloy-tuloy, puwedeng krimen na stalking. Huwag burahin—i-save.",
          "A. ใช้ความสัมพันธ์ในที่ทำงานติดต่อส่วนตัวที่ไม่ต้องการซ้ำ ๆ อาจเป็นการล่วงละเมิด และถ้าต่อเนื่องอาจเป็นอาชญากรรมสะกดรอยตาม อย่าลบข้อความ ให้เก็บไว้",
          "A. Lợi dụng quan hệ công việc để liên tục nhắn riêng khi người kia không muốn có thể là quấy rối tình dục, kéo dài có thể là tội rình rập (stalking). Đừng xóa, hãy lưu lại."))
    ]},

  // ---------- 3. 고객·거래처에 의한 피해 ----------
  { id: "p4-7", title: L("고객·거래처·다른 회사 사람이 그럴 때", "Kapag galing sa customer o ibang kumpanya", "เมื่อลูกค้าหรือคนบริษัทอื่นทำ", "Khi khách hàng, đối tác, người công ty khác làm vậy"),
    blocks: [
      { t: "lead", x: L("판금 공장에는 납품 기사, 원청 담당자, 협력업체 직원 등 다른 회사 사람이 자주 드나듭니다. 이들에게 폭언이나 성희롱을 당해도 회사가 보호해야 합니다.",
        "Madalas pumunta sa sheet metal factory ang delivery driver, tauhan ng main contractor at ng subcontractor. Kahit sila ang nanakit o nanligalig, dapat kang protektahan ng kumpanya.",
        "ในโรงงานแผ่นโลหะ มีคนบริษัทอื่นเข้าออกบ่อย เช่น คนขับส่งของ ผู้รับผิดชอบจากบริษัทแม่ พนักงานบริษัทรับเหมา ถ้าถูกพวกเขาด่าว่าหรือล่วงละเมิด บริษัทก็ต้องคุ้มครอง",
        "Ở xưởng tấm kim loại hay có người công ty khác ra vào như tài xế giao hàng, người phụ trách bên đặt hàng, nhân viên nhà thầu phụ. Bị họ chửi bới hay quấy rối, công ty vẫn phải bảo vệ bạn.") },
      { t: "kv", rows: [
        [L("성희롱", "Sexual harassment", "ล่วงละเมิดทางเพศ", "Quấy rối tình dục"), L("고객 등에게 성희롱 피해를 입었다고 말하면, 회사는 근무 장소를 바꾸거나 배치를 바꾸는 등 보호 조치를 해야 합니다. 이를 이유로 불이익을 주면 안 됩니다.", "Kapag sinabi mong nanligalig ang customer, dapat kang protektahan ng kumpanya, hal. ilipat ng puwesto. Bawal kang parusahan dahil dito.", "เมื่อบอกว่าถูกลูกค้าล่วงละเมิด บริษัทต้องคุ้มครอง เช่น ย้ายที่ทำงานหรือเปลี่ยนหน้าที่ และห้ามลงโทษเพราะเรื่องนี้", "Khi báo bị khách hàng quấy rối, công ty phải bảo vệ như đổi chỗ làm, đổi bố trí. Không được gây bất lợi vì lý do này.")],
        [L("폭언·폭행", "Mura at pananakit", "ด่าว่าและทำร้าย", "Chửi bới, hành hung"), L("고객의 폭언으로 몸과 마음이 상하지 않도록 회사는 업무를 잠시 멈추거나 바꾸게 하고, 필요하면 치료·상담을 지원해야 합니다.", "Dapat pansamantalang ipahinto o palitan ng kumpanya ang trabaho at suportahan ang gamot o konsultasyon kapag kailangan.", "บริษัทต้องให้หยุดหรือเปลี่ยนงานชั่วคราว และสนับสนุนการรักษาหรือปรึกษาเมื่อจำเป็น เพื่อไม่ให้กายใจเสียหายจากคำด่าของลูกค้า", "Công ty phải cho tạm dừng hoặc đổi việc, hỗ trợ điều trị, tư vấn khi cần để không bị tổn hại vì lời chửi bới của khách.")]
      ]},
      H("이렇게 하세요", "Gawin ito", "ทำแบบนี้", "Hãy làm thế này", "do"),
      { t: "ol", tone: "do", items: [
        L("상대가 누구든 그 자리에서 벗어나 반장이나 관리자에게 바로 알립니다.", "Sino man ang gumawa, umalis sa lugar at sabihin agad sa team leader o manager.", "ไม่ว่าอีกฝ่ายเป็นใคร ออกจากที่นั่นแล้วบอกหัวหน้าหรือผู้จัดการทันที", "Dù đối phương là ai, rời khỏi đó và báo ngay tổ trưởng hoặc quản lý."),
        L("상대의 회사 이름, 차량 번호, 날짜·시간을 기록해 둡니다.", "Itala ang pangalan ng kumpanya, plate number ng sasakyan, petsa at oras.", "จดชื่อบริษัท ทะเบียนรถ วันที่และเวลาของอีกฝ่าย", "Ghi lại tên công ty, biển số xe, ngày giờ của đối phương."),
        L("'거래처라서 참아야 한다'는 생각은 버리세요. 회사가 상대 회사에 항의하고 재발을 막아야 합니다.", "Kalimutan ang 'kailangan kong tiisin dahil kliyente sila'. Ang kumpanya ang dapat magreklamo at pumigil na maulit.", "ทิ้งความคิดว่า 'ต้องทนเพราะเป็นคู่ค้า' บริษัทต้องประท้วงบริษัทนั้นและป้องกันไม่ให้เกิดซ้ำ", "Bỏ suy nghĩ 'là đối tác nên phải chịu'. Công ty phải phản đối với bên kia và ngăn tái diễn.")
      ]},
      { t: "note", x: L("반대로 우리도 다른 회사에 가서 일할 때는 그곳 직원을 존중해야 합니다. 우리 회사 이름을 걸고 일하는 것입니다.",
        "Sa kabilang banda, kapag tayo ang nagtatrabaho sa ibang kumpanya, igalang ang kanilang mga tauhan. Dala natin ang pangalan ng kumpanya.",
        "ในทางกลับกัน เมื่อเราไปทำงานที่บริษัทอื่น ก็ต้องเคารพพนักงานที่นั่น เพราะเราทำงานในนามบริษัทของเรา",
        "Ngược lại, khi đến làm ở công ty khác, ta cũng phải tôn trọng nhân viên ở đó. Ta làm việc mang tên công ty mình.") },
      { t: "src", items: ["남녀고용평등법 제14조의2(고객 등에 의한 성희롱 방지)", "산업안전보건법 제41조(고객의 폭언등으로 인한 건강장해 예방조치 등)"] }
    ]},

  // ---------- 4. 2차 피해와 신고자 보호 ----------
  { id: "p4-8", title: L("2차 피해를 막고 신고한 사람을 지키기", "Pigilan ang pangalawang pinsala at protektahan ang nag-ulat", "ป้องกันความเสียหายซ้ำและปกป้องผู้แจ้ง", "Ngăn tổn hại thứ cấp và bảo vệ người báo cáo"),
    blocks: [
      { t: "lead", x: L("피해를 말한 뒤에 받는 따가운 시선, 소문, 불이익을 '2차 피해'라고 합니다. 2차 피해가 무서워 아무도 말하지 않으면 괴롭힘은 계속됩니다.",
        "Ang masasakit na tingin, tsismis at parusa pagkatapos magsalita ng biktima ay tinatawag na 'pangalawang pinsala'. Kapag natakot ang lahat na magsalita, magpapatuloy ang panliligalig.",
        "สายตาที่ไม่เป็นมิตร ข่าวลือ และการถูกลงโทษหลังจากพูดเรื่องที่ถูกกระทำ เรียกว่า 'ความเสียหายซ้ำ' ถ้าทุกคนกลัวจนไม่มีใครพูด การกลั่นแกล้งจะดำเนินต่อไป",
        "Ánh mắt soi mói, tin đồn, bất lợi sau khi lên tiếng gọi là 'tổn hại thứ cấp'. Nếu sợ mà không ai nói, quấy rối sẽ còn tiếp diễn.") },
      H("이런 말과 행동이 2차 피해입니다", "Pangalawang pinsala ang mga ito", "คำพูดและการกระทำแบบนี้คือความเสียหายซ้ำ", "Lời nói, hành động này là tổn hại thứ cấp", "bad"),
      { t: "ol", tone: "bad", items: [
        L("\"네가 먼저 빌미를 준 거 아니야?\" — 피해자 탓하기", "\"Hindi ba ikaw ang nagsimula?\" — paninisi sa biktima", "\"เธอให้ท่าก่อนหรือเปล่า\" — โทษผู้เสียหาย", "\"Chẳng phải em gây chuyện trước à?\" — đổ lỗi cho nạn nhân"),
        L("\"그 정도는 다들 참고 살아.\" — 피해를 작게 만들기", "\"Lahat naman tinitiis iyan.\" — pagmamaliit sa pinsala", "\"แค่นั้นใคร ๆ ก็ทน\" — ทำให้ความเสียหายดูเล็ก", "\"Chuyện đó ai cũng chịu được.\" — xem nhẹ tổn hại"),
        L("누가 신고했는지 캐묻고 소문내기", "Pag-uusisa kung sino ang nag-ulat at pagkakalat ng tsismis", "สืบว่าใครแจ้งแล้วปล่อยข่าวลือ", "Dò hỏi ai báo cáo rồi lan tin đồn"),
        L("신고한 사람과 말을 섞지 말라고 하거나 일에서 빼기", "Pagbabawal makipag-usap sa nag-ulat o pag-alis sa kaniya sa trabaho", "สั่งไม่ให้คุยกับผู้แจ้ง หรือเอาออกจากงาน", "Bảo đừng nói chuyện với người báo cáo hoặc gạt họ khỏi công việc")
      ]},
      H("법이 금지하는 불리한 처우", "Mga parusang ipinagbabawal ng batas", "การปฏิบัติที่ไม่เป็นธรรมที่กฎหมายห้าม", "Đối xử bất lợi bị luật cấm"),
      { t: "ul", items: [
        L("해고, 징계, 정직, 감봉, 승진 제한", "Pagtanggal, disiplina, suspensyon, bawas-sahod, hadlang sa promosyon", "เลิกจ้าง ลงโทษทางวินัย พักงาน ลดเงินเดือน จำกัดการเลื่อนตำแหน่ง", "Sa thải, kỷ luật, đình chỉ, giảm lương, hạn chế thăng tiến"),
        L("원하지 않는 부서 이동, 일 빼앗기, 재계약 거절", "Paglipat na hindi gusto, pag-agaw ng trabaho, pagtanggi sa renewal ng kontrata", "ย้ายแผนกโดยไม่สมัครใจ ยึดงาน ไม่ต่อสัญญา", "Điều chuyển không mong muốn, tước việc, từ chối gia hạn hợp đồng"),
        L("집단 따돌림·폭언을 내버려 두기", "Pagpapabaya sa pambubukod o mura ng grupo", "ปล่อยให้ถูกรุมกีดกันหรือด่าว่า", "Bỏ mặc việc bị cô lập, chửi bới tập thể")
      ]},
      { t: "warn", x: L("신고자나 피해자에게 불리한 처우를 하면 3년 이하의 징역 또는 3천만원 이하의 벌금에 처해질 수 있습니다. 조사에 참여한 동료(참고인)도 보호받습니다.",
        "Ang pagpaparusa sa nag-ulat o biktima ay may kulong hanggang 3 taon o multa hanggang 30 milyong won. Protektado rin ang kasamang tumestigo.",
        "การปฏิบัติไม่เป็นธรรมต่อผู้แจ้งหรือผู้เสียหาย อาจถูกจำคุกไม่เกิน 3 ปี หรือปรับไม่เกิน 30 ล้านวอน เพื่อนที่ให้ข้อมูลในการสอบสวนก็ได้รับความคุ้มครอง",
        "Đối xử bất lợi với người báo cáo hay nạn nhân có thể bị phạt tù đến 3 năm hoặc phạt tiền đến 30 triệu won. Đồng nghiệp làm chứng cũng được bảo vệ.") },
      { t: "src", items: ["근로기준법 제76조의3 제6항(불리한 처우 금지), 제109조(벌칙)", "남녀고용평등법 제14조 제6항(불리한 처우 금지), 제37조(벌칙)"] }
    ]},

  // ---------- 5. 회사 조사 절차 ----------
  { id: "p4-9", title: L("신고하면 어떻게 진행되나요", "Ano ang mangyayari pagkatapos mag-ulat", "แจ้งแล้วจะดำเนินการอย่างไร", "Báo cáo rồi sẽ tiến hành thế nào"),
    blocks: [
      { t: "lead", x: L("신고 뒤에 무슨 일이 일어나는지 알면 덜 두렵습니다. 회사는 아래 순서로 처리해야 합니다.",
        "Mas hindi nakakatakot kapag alam mo ang mangyayari. Ganito dapat ang proseso ng kumpanya.",
        "ถ้ารู้ว่าหลังแจ้งจะเกิดอะไร ก็จะกลัวน้อยลง บริษัทต้องดำเนินการตามลำดับนี้",
        "Biết trước sau khi báo cáo sẽ xảy ra gì thì đỡ sợ hơn. Công ty phải xử lý theo thứ tự sau.") },
      { t: "ol", items: [
        L("접수 — 말·문서·메신저 어떤 방법으로든 신고할 수 있습니다. 피해자가 아니어도 됩니다.", "Pagtanggap — puwedeng mag-ulat sa salita, sulat o messenger. Hindi kailangang biktima ka.", "รับเรื่อง — แจ้งได้ทุกทาง ทั้งพูด เอกสาร แชท ไม่จำเป็นต้องเป็นผู้เสียหาย", "Tiếp nhận — báo bằng lời, văn bản, tin nhắn đều được. Không cần là nạn nhân."),
        L("즉시 보호 — 조사 기간에도 피해자가 원하면 근무 장소 변경, 유급휴가 등을 해 줍니다. 피해자 뜻에 반하는 조치는 하지 않습니다.", "Agarang proteksyon — kahit habang iniimbestigahan, puwedeng ilipat ng puwesto o bigyan ng bayad na leave kung gusto ng biktima. Walang hakbang na labag sa kagustuhan niya.", "คุ้มครองทันที — ระหว่างสอบสวน ถ้าผู้เสียหายต้องการ ย้ายที่ทำงานหรือให้ลาโดยได้รับค่าจ้าง ไม่ทำสิ่งที่ขัดกับความต้องการของผู้เสียหาย", "Bảo vệ ngay — kể cả trong thời gian điều tra, nếu nạn nhân muốn thì đổi chỗ làm, cho nghỉ có lương. Không làm trái ý nạn nhân."),
        L("조사 — 피해자, 가해자, 본 사람의 이야기를 따로 듣고 증거를 확인합니다. 지체 없이, 공정하게 합니다.", "Imbestigasyon — hiwalay na pinakikinggan ang biktima, gumawa at saksi, at sinusuri ang ebidensya. Mabilis at patas.", "สอบสวน — ฟังผู้เสียหาย ผู้กระทำ และพยานแยกกัน ตรวจหลักฐาน ทำโดยไม่ชักช้าและเป็นธรรม", "Điều tra — nghe riêng nạn nhân, người gây ra, người chứng kiến và kiểm tra bằng chứng. Không chậm trễ, công bằng."),
        L("결과 알림과 조치 — 사실이면 가해자를 징계하거나 근무 장소를 바꿉니다. 징계 전에 피해자의 의견을 듣습니다.", "Resulta at aksyon — kapag totoo, didisiplinahin o ililipat ang gumawa. Pakikinggan muna ang biktima bago magdisiplina.", "แจ้งผลและดำเนินการ — ถ้าเป็นความจริง ลงโทษหรือย้ายผู้กระทำ ฟังความเห็นผู้เสียหายก่อนลงโทษ", "Thông báo kết quả và xử lý — nếu đúng sự thật, kỷ luật hoặc điều chuyển người gây ra. Nghe ý kiến nạn nhân trước khi kỷ luật."),
        L("비밀 유지와 재발 방지 — 조사 내용은 피해자 뜻에 반해 알리지 않고, 다시 일어나지 않도록 교육·점검을 합니다.", "Lihim at pag-iwas sa pag-ulit — hindi ipinapaalam ang imbestigasyon nang labag sa kagustuhan ng biktima; may training at pagsusuri para hindi maulit.", "รักษาความลับและป้องกันซ้ำ — ไม่เปิดเผยเนื้อหาการสอบสวนขัดกับความต้องการของผู้เสียหาย และจัดอบรมตรวจสอบไม่ให้เกิดซ้ำ", "Giữ bí mật và ngăn tái diễn — không tiết lộ nội dung điều tra trái ý nạn nhân; đào tạo, kiểm tra để không lặp lại.")
      ]},
      { t: "note", x: L("조사에 참고인으로 불려 가면 본 것만 사실대로 말하면 됩니다. 들은 내용은 다른 사람에게 옮기지 않습니다.",
        "Kapag tinawag bilang saksi, sabihin lang nang totoo ang nakita mo. Huwag ikalat ang narinig.",
        "ถ้าถูกเรียกเป็นพยาน ให้พูดตามจริงเฉพาะสิ่งที่เห็น และไม่นำสิ่งที่ได้ยินไปบอกต่อ",
        "Được gọi làm người chứng kiến thì chỉ cần nói đúng sự thật những gì đã thấy. Không truyền đạt lại cho người khác.") },
      { t: "src", items: ["근로기준법 제76조의3(직장 내 괴롭힘 발생 시 조치)", "남녀고용평등법 제14조(직장 내 성희롱 발생 시 조치)"] }
    ]},

  // ---------- 6. 서로 존중하는 일터 ----------
  { id: "p4-10", title: L("서로 존중하는 일터 만들기", "Paggawa ng lugar ng trabahong may respeto", "สร้างที่ทำงานที่เคารพกัน", "Xây dựng nơi làm việc tôn trọng nhau"),
    blocks: [
      { t: "lead", x: L("우리 공장에는 여러 나라 사람이 함께 일합니다. 서로 존중하는 팀은 신호가 잘 맞고, 위험을 서로 알려 주어 사고도 적습니다.",

      L("스트레스 관리도 안전의 일부입니다.", "Bahagi rin ng kaligtasan ang pamamahala ng stress.", "การจัดการความเครียดเป็นส่วนหนึ่งของความปลอดภัย", "Quản lý căng thẳng cũng là một phần của an toàn.")),
    Q(L("힘든 일은 혼자 참는 것이 가장 좋은 방법이다.", "Pinakamabuting tiisin nang mag-isa ang hirap.", "เรื่องหนักใจควรทนคนเดียว", "Chuyện khó khăn tốt nhất là chịu đựng một mình."), false,
      L("동료·관리자·상담센터에 이야기하세요.", "Makipag-usap sa kasama, manager o counseling center.", "คุยกับเพื่อน หัวหน้า หรือศูนย์ปรึกษา", "Hãy nói với đồng nghiệp, quản lý hoặc trung tâm tư vấn."))
  ],
  "p1-11": [
    Q(L("8시간 일하면 쉬는 시간은 1시간 이상이다.", "1 oras o higit ang pahinga sa 8 oras na trabaho.", "ทำงาน 8 ชั่วโมงพัก 1 ชั่วโมงขึ้นไป", "Làm 8 giờ thì nghỉ từ 1 giờ."), true,
      L("4시간에 30분, 8시간에 1시간 이상입니다.", "30 minuto sa 4 oras, 1 oras sa 8 oras.", "4 ชั่วโมงพัก 30 นาที 8 ชั่วโมงพัก 1 ชั่วโมงขึ้นไป", "4 giờ nghỉ 30 phút, 8 giờ nghỉ từ 1 giờ.")),
    Q(L("휴게실을 자재 창고로 같이 써도 된다.", "Puwedeng gawing bodega ng materyales ang rest area.", "ใช้ห้องพักเป็นโกดังเก็บวัสดุร่วมด้วยได้", "Có thể dùng phòng nghỉ làm kho vật liệu."), false,
      L("휴게시설은 다른 용도로 쓰면 안 됩니다.", "Bawal gamitin sa ibang layunin.", "ห้ามใช้ห้องพักเพื่อการอื่น", "Không được dùng phòng nghỉ vào mục đích khác."))
  ],
  "p2-1": [
    Q(L("중대재해처벌법은 상시근로자 5명 이상 사업장에 적용된다.", "Sakop ng batas ang 5 pataas na manggagawa.", "กฎหมายนี้ใช้กับสถานที่ที่มีลูกจ้าง 5 คนขึ้นไป", "Luật áp dụng cho nơi có từ 5 lao động thường xuyên."), true,
      L("2024년 1월 27일부터 5인 이상 모든 사업장에 적용됩니다.", "Mula Enero 27, 2024.", "ตั้งแต่ 27 ม.ค. 2024", "Từ 27/1/2024.")),
    Q(L("이 법은 회사 처벌이 목적이라 근로자와는 관계가 없다.", "Para lang parusahan ang kumpanya ang batas, walang kinalaman sa manggagawa.", "กฎหมายนี้มีไว้ลงโทษบริษัท ไม่เกี่ยวกับคนงาน", "Luật này để phạt công ty nên không liên quan người lao động."), false,
      L("목적은 일하는 사람의 생명 보호입니다. 근로자 의견을 듣는 절차도 회사 의무입니다.", "Layunin ang protektahan ang buhay ng manggagawa. Tungkulin din ng kumpanya ang makinig sa kanila.", "จุดประสงค์คือปกป้องชีวิตคนทำงาน การรับฟังความเห็นคนงานก็เป็นหน้าที่บริษัท", "Mục đích là bảo vệ tính mạng người lao động. Lắng nghe ý kiến họ cũng là nghĩa vụ công ty."))
  ],
  "p2-2": [
    Q(L("회사가 위험을 알고도 고치지 않으면 1350에 신고할 수 있다.", "Puwedeng iulat sa 1350 kapag hindi inaayos ang alam na panganib.", "บริษัทรู้ว่าอันตรายแต่ไม่แก้ไข แจ้ง 1350 ได้", "Công ty biết nguy hiểm mà không sửa thì có thể báo 1350."), true,
      L("신고했다고 불이익을 주는 것은 금지되어 있습니다.", "Bawal ang parusa dahil nag-ulat.", "ห้ามลงโทษเพราะแจ้ง", "Cấm gây bất lợi vì đã báo cáo.")),
    Q(L("중대재해 처벌을 받아도 회사 이름은 공개되지 않는다.", "Hindi isinasapubliko ang pangalan ng kumpanyang naparusahan.", "แม้ถูกลงโทษ ชื่อบริษัทก็ไม่ถูกเปิดเผย", "Dù bị phạt, tên công ty cũng không bị công bố."), false,
      L("처벌이 확정되면 공표될 수 있습니다.", "Puwedeng isapubliko kapag pinal na.", "เมื่อการลงโทษถึงที่สุดอาจถูกประกาศ", "Khi án đã xác định có thể bị công bố."))
  ],
  "p4-1": [
    Q(L("안전수칙을 지키라고 단호하게 말하는 것은 괴롭힘이다.", "Panliligalig ang mariing pagpapaalala sa safety rules.", "การพูดหนักแน่นให้ทำตามกฎความปลอดภัยเป็นการกลั่นแกล้ง", "Nói dứt khoát yêu cầu tuân thủ an toàn là quấy rối."), false,
      L("업무상 필요한 정당한 지시입니다. 욕설·모욕이 섞이면 달라집니다.", "Makatwirang utos. Iba kapag may mura o insulto.", "เป็นคำสั่งงานที่ชอบธรรม ถ้ามีคำหยาบหรือดูถูกจะต่างไป", "Là chỉ thị chính đáng. Có chửi bới, xúc phạm thì khác.")),
    Q(L("동료 여러 명이 한 사람을 따돌리는 것도 괴롭힘이 될 수 있다.", "Puwedeng panliligalig ang pambubukod ng grupo sa isang tao.", "เพื่อนหลายคนรุมกีดกันคนหนึ่งก็เป็นการกลั่นแกล้งได้", "Nhiều đồng nghiệp cô lập một người cũng có thể là quấy rối."), true,
      L("인원수도 '관계의 우위'입니다.", "Ang dami ay 'kapangyarihan' din.", "จำนวนคนก็คือ 'ความได้เปรียบ'", "Số đông cũng là 'ưu thế quan hệ'."))
  ],
  "p4-2": [
    Q(L("피해자가 그 자리에서 웃었다면 성희롱이 아니다.", "Hindi sexual harassment kung ngumiti ang biktima.", "ถ้าผู้เสียหายหัวเราะตอนนั้น ไม่ใช่การล่วงละเมิด", "Nạn nhân cười lúc đó thì không phải quấy rối."), false,
      L("웃었다고 동의한 것이 아닙니다.", "Hindi pagpayag ang pagngiti.", "หัวเราะไม่ได้แปลว่ายินยอม", "Cười không có nghĩa là đồng ý.")),
    Q(L("회식 자리나 업무 메신저에서 일어나도 직장 내 성희롱이다.", "Sexual harassment sa trabaho kahit sa company dinner o work chat.", "เกิดในงานเลี้ยงหรือแชทงานก็เป็นการล่วงละเมิดในที่ทำงาน", "Xảy ra ở liên hoan hay tin nhắn công việc cũng là quấy rối tình dục nơi làm việc."), true,
      L("업무와 관련된 자리는 모두 '직장'입니다.", "Lahat ng may kinalaman sa trabaho ay 'trabaho'.", "ที่ที่เกี่ยวกับงานทั้งหมดคือ 'ที่ทำงาน'", "Mọi dịp liên quan công việc đều là 'nơi làm việc'."))
  ],
  "p4-3": [
    Q(L("내가 참여한 대화를 녹음하는 것은 불법이다.", "Ilegal ang pag-record ng usapang kasali ka.", "อัดเสียงบทสนทนาที่ตัวเองร่วมอยู่ผิดกฎหมาย", "Ghi âm cuộc nói chuyện mình tham gia là phạm pháp."), false,
      L("내가 참여한 대화 녹음은 불법이 아닙니다. 남들끼리의 대화를 몰래 녹음하면 안 됩니다.", "Hindi ilegal. Bawal ang lihim na pag-record ng usapan ng iba.", "ไม่ผิด แต่ห้ามแอบอัดบทสนทนาของคนอื่น", "Không phạm pháp. Không được lén ghi âm chuyện của người khác.")),
    Q(L("피해자가 아닌 동료도 회사에 신고할 수 있다.", "Puwedeng mag-ulat kahit hindi biktima.", "เพื่อนที่ไม่ใช่ผู้เสียหายก็แจ้งบริษัทได้", "Đồng nghiệp không phải nạn nhân cũng có thể báo công ty."), true,
      L("그 사실을 아는 사람은 누구든 신고할 수 있습니다.", "Sinumang nakakaalam ay puwedeng mag-ulat.", "ใครที่รู้เรื่องก็แจ้งได้", "Ai biết sự việc đều có thể báo."))
  ],
  "p4-4": [
    Q(L("회사가 노동위원회 시정명령을 따르지 않으면 1억원 이하 과태료를 낸다.", "Multa hanggang 100 milyong won kapag hindi sinunod ang utos ng Labor Commission.", "ถ้าไม่ทำตามคำสั่งคณะกรรมการแรงงาน ถูกปรับไม่เกิน 100 ล้านวอน", "Không tuân lệnh khắc phục của Ủy ban lao động bị phạt đến 100 triệu won."), true,
      L("성희롱 피해자 보호 의무를 지키게 하는 장치입니다.", "Para matiyak ang proteksyon sa biktima.", "เป็นกลไกให้บริษัทคุ้มครองผู้เสียหาย", "Là cơ chế buộc bảo vệ nạn nhân.")),
    Q(L("성희롱 예방교육은 회사가 원할 때만 하면 된다.", "Ginagawa lang ang training kapag gusto ng kumpanya.", "การอบรมป้องกันการล่วงละเมิดทำเมื่อบริษัทต้องการเท่านั้น", "Đào tạo phòng chống quấy rối chỉ làm khi công ty muốn."), false,
      L("1년에 1번 이상 해야 하고, 안 하면 과태료입니다.", "Kahit isang beses sa isang taon; may multa kapag hindi.", "ต้องทำอย่างน้อยปีละครั้ง ไม่ทำถูกปรับ", "Phải làm ít nhất 1 lần/năm, không làm bị phạt."))
  ],
  "p4-5": [
    Q(L("쉬는 날 급하지 않은 일로 계속 연락하고 답을 강요하면 괴롭힘이 될 수 있다.", "Puwedeng panliligalig ang paulit-ulit na pagkontak sa day off para sa hindi agarang bagay.", "ติดต่อวันหยุดเรื่องไม่ด่วนซ้ำ ๆ และบังคับให้ตอบ อาจเป็นการกลั่นแกล้ง", "Liên tục liên lạc ngày nghỉ vì việc không gấp và ép trả lời có thể là quấy rối."), true,
      L("업무상 필요한 범위를 넘었기 때문입니다.", "Lumampas sa kailangan sa trabaho.", "เพราะเกินขอบเขตที่จำเป็นต่องาน", "Vì vượt quá phạm vi cần thiết của công việc.")),
    Q(L("회식에 빠졌다고 일을 몰아주는 것은 괜찮다.", "Okay lang dagdagan ang trabaho dahil hindi sumama sa dinner.", "ไม่ไปงานเลี้ยงแล้วถูกโยนงานให้ ไม่เป็นไร", "Không đi liên hoan thì bị dồn việc cũng được."), false,
      L("회식은 강제가 아니며, 이를 이유로 한 불이익은 괴롭힘이 될 수 있습니다.", "Hindi sapilitan; puwedeng panliligalig ang parusa dahil dito.", "งานเลี้ยงไม่ใช่การบังคับ การลงโทษเพราะเหตุนี้อาจเป็นการกลั่นแกล้ง", "Liên hoan không bắt buộc; gây bất lợi vì lý do này có thể là quấy rối."))
  ],
  "p4-6": [
    Q(L("남자끼리는 성희롱이 성립하지 않는다.", "Walang sexual harassment sa pagitan ng lalaki.", "ผู้ชายด้วยกันไม่เป็นการล่วงละเมิดทางเพศ", "Giữa nam với nam không thể là quấy rối tình dục."), false,
      L("성별과 관계없이 성립합니다.", "Kahit anong kasarian.", "เกิดได้ไม่ว่าเพศใด", "Có thể xảy ra bất kể giới tính.")),
    Q(L("퇴근 후 원하지 않는 개인 메시지를 계속 보내는 것은 성희롱이나 스토킹이 될 수 있다.", "Puwedeng sexual harassment o stalking ang paulit-ulit na hindi gustong mensahe pagkatapos ng trabaho.", "ส่งข้อความส่วนตัวที่ไม่ต้องการหลังเลิกงานซ้ำ ๆ อาจเป็นการล่วงละเมิดหรือสะกดรอยตาม", "Liên tục nhắn riêng khi người kia không muốn sau giờ làm có thể là quấy rối hoặc rình rập."), true,
      L("메시지를 지우지 말고 저장해 두세요.", "Huwag burahin—i-save.", "อย่าลบ ให้เก็บไว้", "Đừng xóa, hãy lưu lại."))
  ],
  "p4-7": [
    Q(L("거래처 직원에게 성희롱을 당하면 회사와는 상관없으니 혼자 해결해야 한다.", "Kapag sa kliyente galing, wala nang pakialam ang kumpanya.", "ถูกพนักงานคู่ค้าล่วงละเมิด ไม่เกี่ยวกับบริษัท ต้องแก้เอง", "Bị nhân viên đối tác quấy rối thì không liên quan công ty, phải tự giải quyết."), false,
      L("회사는 근무 장소 변경 등 보호 조치를 해야 합니다.", "Dapat kang protektahan ng kumpanya.", "บริษัทต้องคุ้มครอง เช่น ย้ายที่ทำงาน", "Công ty phải có biện pháp bảo vệ như đổi chỗ làm.")),
    Q(L("상대의 회사 이름, 차량 번호, 날짜를 기록해 두면 도움이 된다.", "Makakatulong ang pagtatala ng pangalan ng kumpanya, plate number at petsa.", "จดชื่อบริษัท ทะเบียนรถ วันที่ไว้จะช่วยได้", "Ghi lại tên công ty, biển số xe, ngày tháng sẽ có ích."), true,
      L("회사가 상대 회사에 항의하고 재발을 막는 근거가 됩니다.", "Batayan ito ng reklamo ng kumpanya.", "เป็นหลักฐานให้บริษัทประท้วงและป้องกันซ้ำ", "Là căn cứ để công ty phản đối và ngăn tái diễn."))
  ],
  "p4-8": [
    Q(L("누가 신고했는지 알아내서 소문내는 것은 2차 피해이다.", "Pangalawang pinsala ang pag-alam at pagkalat kung sino ang nag-ulat.", "สืบว่าใครแจ้งแล้วปล่อยข่าวคือความเสียหายซ้ำ", "Dò ai báo cáo rồi lan tin đồn là tổn hại thứ cấp."), true,
      L("신고자를 지켜야 다음 피해를 막습니다.", "Kailangang protektahan ang nag-ulat para mapigilan ang susunod.", "ต้องปกป้องผู้แจ้งจึงป้องกันครั้งต่อไปได้", "Phải bảo vệ người báo cáo mới ngăn được lần sau.")),
    Q(L("신고자를 원하지 않는 부서로 옮기는 것은 불리한 처우가 아니다.", "Hindi parusa ang ilipat ang nag-ulat sa hindi gustong departamento.", "ย้ายผู้แจ้งไปแผนกที่เขาไม่ต้องการ ไม่ใช่การปฏิบัติไม่เป็นธรรม", "Chuyển người báo cáo sang bộ phận họ không muốn không phải đối xử bất lợi."), false,
      L("원하지 않는 이동은 불리한 처우이며 처벌 대상입니다.", "Parusa ito at may kaparusahan.", "การย้ายโดยไม่สมัครใจคือการปฏิบัติไม่เป็นธรรม และถูกลงโทษ", "Điều chuyển không mong muốn là đối xử bất lợi và bị phạt."))
  ],
  "p4-9": [
    Q(L("조사 중에는 피해자를 보호할 수 없다.", "Hindi mapoprotektahan ang biktima habang iniimbestigahan.", "ระหว่างสอบสวนคุ้มครองผู้เสียหายไม่ได้", "Trong thời gian điều tra không thể bảo vệ nạn nhân."), false,
      L("조사 중에도 피해자가 원하면 근무 장소 변경, 유급휴가 등을 해 줍니다.", "Kahit habang iniimbestigahan, puwedeng ilipat o bigyan ng bayad na leave.", "ระหว่างสอบสวนก็ย้ายที่ทำงานหรือให้ลาได้ ถ้าผู้เสียหายต้องการ", "Kể cả khi điều tra, nếu nạn nhân muốn thì đổi chỗ, cho nghỉ có lương.")),
    Q(L("참고인으로 조사받았다면 들은 내용을 다른 사람에게 말하지 않는다.", "Huwag ikalat ang narinig kapag naging saksi.", "ถ้าเป็นพยาน อย่านำสิ่งที่ได้ยินไปบอกต่อ", "Đã làm người chứng kiến thì không kể lại cho người khác."), true,
      L("비밀 유지는 피해자와 신고자를 지킵니다.", "Pinoprotektahan ng lihim ang biktima at nag-ulat.", "การรักษาความลับปกป้องผู้เสียหายและผู้แจ้ง", "Giữ bí mật bảo vệ nạn nhân và người báo cáo."))
  ],
  "p4-10": [
    Q(L("동료를 \"야!\" 대신 이름으로 부르는 것도 존중의 시작이다.", "Simula ng respeto ang pagtawag sa pangalan sa halip na \"Hoy!\".", "เรียกชื่อแทน \"เฮ้ย!\" ก็เป็นจุดเริ่มต้นของการเคารพ", "Gọi tên thay vì \"Ê!\" cũng là khởi đầu của tôn trọng."), true,
