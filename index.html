// "현장 이야기(예시)" — 판금 현장에서 있을 법한 상황을 직접 지어 쓴 예시 이야기 (실제 사건 아님)
(() => {
  const find = id => { for (const p of window.NEW_PARTS) for (const l of p.lessons) if (l.id === id) return l; return null; };
  const K = L("현장 이야기 (예시)", "Kuwento sa trabaho (halimbawa)", "เรื่องเล่าจากหน้างาน (ตัวอย่าง)", "Câu chuyện hiện trường (ví dụ)");
  const put = (id, blocks) => {
    const l = find(id); if (!l) return;
    let i = l.blocks.findIndex(b => b.t === "ox"); if (i < 0) i = l.blocks.findIndex(b => b.t === "src"); if (i < 0) i = l.blocks.length;
    l.blocks.splice(i, 0, ...blocks);
  };
  const S = (id, ko, tl, th, vi) => put(id, [{ t: "def", k: K, v: L(ko, tl, th, vi) }]);
  window.PUT_BEFORE_OX = put;

  S("p1-1",
    "입사 3개월 된 민수 씨는 절곡기 앞에서 손가락이 금형에 닿을 뻔했지만 '별일 없었으니까' 하고 말하지 않았습니다. 일주일 뒤 옆 라인의 동료가 같은 방식으로 일하다 손가락을 다쳤습니다. 민수 씨가 그때 말했다면 반장은 판재를 잡는 위치를 바꾸도록 모두에게 알렸을 것입니다. 아차사고를 말하는 것은 나를 위한 일이 아니라 동료를 지키는 일입니다.",
    "Si Minsu, 3 buwan pa lang sa trabaho, muntik nang maipit ang daliri sa bending die pero hindi nagsabi dahil 'wala namang nangyari'. Isang linggo pagkatapos, nasaktan ang daliri ng kasama sa kabilang linya sa parehong paraan. Kung nagsabi si Minsu, sinabihan sana ng team leader ang lahat na baguhin ang paghawak sa sheet. Ang pagsasabi ng muntikang aksidente ay pagprotekta sa kasama.",
    "มินซูทำงานได้ 3 เดือน เกือบโดนแม่พิมพ์เครื่องพับหนีบนิ้ว แต่ไม่บอกใครเพราะ 'ก็ไม่เป็นอะไร' หนึ่งสัปดาห์ต่อมา เพื่อนไลน์ข้าง ๆ ทำงานแบบเดียวกันแล้วนิ้วบาดเจ็บ ถ้ามินซูบอกตอนนั้น หัวหน้าคงแจ้งทุกคนให้เปลี่ยนตำแหน่งจับแผ่น การบอกเหตุเกือบเกิดคือการปกป้องเพื่อน",
    "Anh Minsu mới vào làm 3 tháng, suýt bị khuôn máy chấn kẹp ngón tay nhưng không nói vì 'có sao đâu'. Một tuần sau, đồng nghiệp ở dây chuyền bên làm cùng cách và bị thương ngón tay. Nếu khi đó Minsu nói ra, tổ trưởng đã báo mọi người đổi vị trí cầm tấm. Nói ra sự cố suýt xảy ra là bảo vệ đồng nghiệp.");
  S("p1-2",
    "용접 작업자 A씨는 여름에 덥다며 보안면을 벗고 보안경만 쓴 채 작업했습니다. 며칠 뒤 밤에 눈이 모래가 들어간 것처럼 아파 잠을 못 잤습니다. 회사는 보호구를 지급했지만, 쓰는 것은 근로자의 의무입니다. 더운 날에는 반장에게 말해 쉬는 시간을 늘리거나 냉방 조끼를 요청하는 것이 맞는 방법입니다.",
    "Inalis ni A, isang welder, ang face shield dahil mainit at goggles lang ang suot. Ilang araw pagkatapos, hindi siya makatulog sa gabi dahil masakit ang mata na parang may buhangin. Nagbigay ng PPE ang kumpanya, pero tungkulin ng manggagawa ang gamitin ito. Sa mainit na araw, sabihin sa team leader para dagdagan ang pahinga o humingi ng cooling vest.",
    "ช่างเชื่อม A ถอดกระบังหน้าเพราะร้อน ใส่แค่แว่นตา ไม่กี่วันต่อมากลางคืนปวดตาเหมือนมีทรายจนนอนไม่หลับ บริษัทให้อุปกรณ์ป้องกันแล้ว แต่การสวมเป็นหน้าที่ของคนงาน วันที่ร้อนควรบอกหัวหน้าเพื่อเพิ่มเวลาพักหรือขอเสื้อกั๊กระบายความร้อน",
    "Thợ hàn A tháo mặt nạ vì nóng, chỉ đeo kính. Vài ngày sau, ban đêm mắt đau như có cát, không ngủ được. Công ty đã cấp đồ bảo hộ nhưng đeo là nghĩa vụ của người lao động. Ngày nóng nên báo tổ trưởng để tăng giờ nghỉ hoặc xin áo làm mát.");
  S("a-stop",
    "크레인으로 판재 묶음을 옮기던 중 와이어로프에서 '틱' 하는 소리가 나고 가닥이 몇 개 끊어져 있었습니다. 작업자 B씨는 '조금만 더 옮기면 끝인데' 하는 생각이 들었지만 바로 내려놓고 작업을 멈췄습니다. 반장은 로프를 교체했고, 끊어진 로프는 폐기했습니다. 멈춘 5분이 큰 사고를 막았습니다.",
    "Habang inililipat ang bundle gamit ang crane, may tumunog na 'tik' sa wire rope at may ilang hiblang putol. Naisip ni B na 'konti na lang, tapos na', pero ibinaba niya agad ito at huminto. Pinalitan ng team leader ang rope at itinapon ang sira. Ang 5 minutong paghinto ang pumigil sa malaking aksidente.",
    "ระหว่างใช้เครนย้ายมัดแผ่นโลหะ มีเสียง 'ติ๊ก' จากลวดสลิงและเส้นลวดขาดไปหลายเส้น B คิดว่า 'อีกนิดเดียวก็เสร็จ' แต่ก็วางลงและหยุดงานทันที หัวหน้าเปลี่ยนลวดสลิงและทิ้งเส้นที่ขาด การหยุด 5 นาทีป้องกันอุบัติเหตุใหญ่ได้",
    "Đang dùng cẩu chuyển bó tấm, cáp phát ra tiếng 'tách' và vài sợi bị đứt. Anh B nghĩ 'chỉ một chút nữa là xong' nhưng vẫn hạ xuống và dừng ngay. Tổ trưởng thay cáp, bỏ cáp hỏng. 5 phút dừng lại đã ngăn một tai nạn lớn.");
  S("p1-6",
    "새로 온 C씨는 귀마개를 귀 입구에만 살짝 꽂아 두었습니다. 반장이 손가락으로 귀마개를 말아서 귀를 위로 당기고 깊이 넣는 법을 보여 주자, 프레스 소리가 확 작아졌습니다. 보호구는 '쓰는 것'만큼 '바르게 쓰는 것'이 중요합니다. 모르면 부끄러워하지 말고 물어보세요.",
    "Ang bagong si C ay bahagya lang na isinuksok ang ear plug sa bungad ng tainga. Nang ipakita ng team leader kung paano i-roll, hilahin pataas ang tainga at ipasok nang malalim, biglang humina ang ingay ng press. Kasinghalaga ng pagsuot ang tamang pagsuot. Magtanong kung hindi alam.",
    "C พนักงานใหม่ เสียบที่อุดหูแค่ปากรูหู เมื่อหัวหน้าสาธิตวิธีคลึงให้เรียว ดึงใบหูขึ้น แล้วใส่ลึก ๆ เสียงเครื่องเพรสก็เบาลงทันที การ 'สวมให้ถูก' สำคัญพอ ๆ กับการ 'สวม' ไม่รู้ก็ถามได้ ไม่ต้องอาย",
    "Anh C mới vào chỉ nhét nút tai ở miệng tai. Khi tổ trưởng chỉ cách vê nhỏ, kéo vành tai lên và nhét sâu, tiếng máy dập nhỏ hẳn đi. 'Đeo đúng' quan trọng như 'đeo'. Không biết thì cứ hỏi, đừng ngại.");
  S("p1-5",
    "레이저 가공기 옆 '레이저광선 경고' 표지가 자재에 가려 보이지 않았습니다. 처음 온 협력업체 직원이 문이 열린 가공기 안을 들여다보려 하자, 근처 작업자가 막았습니다. 그날 표지를 눈높이로 옮겨 다시 붙였습니다. 표지는 '모르는 사람'을 지키기 위해 있습니다. 가려진 표지를 보면 바로 치우거나 알려 주세요.",
    "Natakpan ng materyales ang karatulang 'Babala sa laser' sa tabi ng laser machine. Nang sisilipin ng bagong tauhan ng subcontractor ang loob ng bukas na makina, pinigilan siya ng kalapit na manggagawa. Inilipat ang karatula sa taas ng mata noong araw ding iyon. Para sa 'hindi nakakaalam' ang karatula. Alisin o ipaalam kapag may natakpan.",
    "ป้าย 'เตือนแสงเลเซอร์' ข้างเครื่องเลเซอร์ถูกวัสดุบังจนมองไม่เห็น พนักงานบริษัทรับเหมาที่มาครั้งแรกจะชะโงกดูข้างในเครื่องที่เปิดประตูอยู่ คนงานใกล้ ๆ ห้ามไว้ทัน วันนั้นย้ายป้ายไปติดระดับสายตา ป้ายมีไว้ปกป้อง 'คนที่ไม่รู้' เห็นป้ายถูกบังให้เก็บหรือแจ้งทันที",
    "Biển 'Cảnh báo tia laser' cạnh máy laser bị vật liệu che khuất. Nhân viên nhà thầu phụ lần đầu đến định nhìn vào máy đang mở cửa thì người gần đó ngăn lại. Ngay hôm đó biển được dời lên ngang tầm mắt. Biển báo để bảo vệ 'người không biết'. Thấy biển bị che thì dọn hoặc báo ngay.");
  S("p1-7",
    "절곡기의 광선식 안전장치가 자꾸 멈춰서 작업이 느리다고, 누군가 감도를 낮춰 두었습니다. 다음 날 작업자의 장갑 끝이 광선을 지나쳤는데도 기계가 멈추지 않았고, 다행히 손가락은 빠졌습니다. 장치가 '자꾸 멈춘다'는 것은 고장이 아니라 위험을 알려 주는 신호일 수 있습니다. 설정을 바꾸지 말고 관리자에게 점검을 요청합니다.",
    "Dahil madalas huminto ang light guard ng bending machine at bumabagal ang trabaho, may nagbaba ng sensitivity nito. Kinabukasan, dumaan ang dulo ng gloves sa liwanag pero hindi huminto ang makina—buti na lang nakaalis ang daliri. Hindi sira ang 'madalas huminto'; babala ito ng panganib. Huwag baguhin ang setting—ipasuri sa manager.",
    "เพราะม่านแสงของเครื่องพับหยุดบ่อยจนงานช้า มีคนลดความไวลง วันรุ่งขึ้นปลายถุงมือผ่านลำแสงแต่เครื่องไม่หยุด โชคดีที่ดึงนิ้วออกทัน การที่อุปกรณ์ 'หยุดบ่อย' อาจไม่ใช่ของเสีย แต่เป็นสัญญาณเตือนอันตราย อย่าเปลี่ยนการตั้งค่า ให้แจ้งหัวหน้าตรวจ",
    "Vì rèm quang máy chấn hay dừng làm chậm việc, ai đó đã giảm độ nhạy. Hôm sau đầu găng tay lướt qua tia sáng mà máy không dừng, may mà kịp rút ngón tay. 'Hay dừng' có thể không phải hỏng mà là tín hiệu nguy hiểm. Đừng đổi cài đặt, hãy báo quản lý kiểm tra.");
  S("p1-9",
    "탈지 작업을 하던 D씨가 시너를 작은 생수병에 덜어 작업대 위에 두었습니다. 점심 후 목이 마른 동료가 그 병을 집어 들었다가 냄새를 맡고 내려놓았습니다. 그날 회사는 전용 용기와 경고표지를 새로 붙였습니다. 화학물질은 원래 용기나 표지가 있는 전용 용기에만 담습니다.",
    "Inilagay ni D ang thinner sa maliit na bote ng tubig habang nag-de-degrease at iniwan sa mesa. Pagkatapos ng tanghalian, kinuha ito ng uhaw na kasama pero naamoy at ibinaba. Noong araw ding iyon, naglagay ang kumpanya ng tamang lalagyan at babala. Sa orihinal o may label na lalagyan lang ilagay ang kemikal.",
    "D แบ่งทินเนอร์ใส่ขวดน้ำดื่มเล็ก ๆ ระหว่างล้างไขมันแล้ววางบนโต๊ะ หลังพักเที่ยง เพื่อนที่กระหายน้ำหยิบขวดขึ้นมา แต่ได้กลิ่นจึงวางลง วันนั้นบริษัทจัดภาชนะเฉพาะและติดป้ายเตือนใหม่ สารเคมีต้องใส่ในภาชนะเดิมหรือภาชนะเฉพาะที่มีป้ายเท่านั้น",
    "Anh D chiết thinner vào chai nước nhỏ khi tẩy dầu rồi để trên bàn. Sau giờ trưa, đồng nghiệp khát nước cầm chai lên, ngửi thấy mùi mới đặt xuống. Ngay hôm đó công ty cấp bình chuyên dụng và dán nhãn cảnh báo. Hóa chất chỉ được chứa trong bình gốc hoặc bình chuyên dụng có nhãn.");
  S("w-0",
    "어느 판금 공장의 하루를 돌아보면, 아침 지게차 하역에서 한 번, 오후 절곡기에서 한 번, 저녁 트럭 상차에서 한 번 '아찔한 순간'이 있었습니다. 모두 다른 작업이지만 공통점이 있었습니다. 바빠서 순서를 건너뛰었다는 것입니다. 5대 유형을 기억하는 이유는, 지금 하는 일이 어떤 위험에 속하는지 떠올리고 한 번 더 확인하기 위해서입니다.",
    "Sa isang araw sa isang sheet metal factory, may 'muntikang sandali' sa forklift sa umaga, sa bending machine sa hapon at sa pagkarga ng trak sa gabi. Iba-iba ang trabaho, pero pareho ang dahilan: nilaktawan ang hakbang dahil nagmamadali. Inaalala natin ang 5 uri para maisip kung saang panganib kabilang ang ginagawa at suriin muli.",
    "ย้อนดูหนึ่งวันในโรงงานแผ่นโลหะ มี 'ช่วงเสียว' ตอนรถยกลงของตอนเช้า ตอนพับโลหะช่วงบ่าย และตอนขึ้นของรถบรรทุกตอนเย็น งานต่างกันแต่มีจุดร่วม คือข้ามขั้นตอนเพราะรีบ การจำ 5 รูปแบบก็เพื่อนึกว่างานที่ทำอยู่เสี่ยงแบบไหน และตรวจอีกครั้ง",
    "Nhìn lại một ngày ở xưởng tấm kim loại: sáng có 'giây phút thót tim' khi xe nâng dỡ hàng, chiều ở máy chấn, tối khi chất hàng lên xe tải. Việc khác nhau nhưng giống nhau ở chỗ: vì vội nên bỏ qua bước. Nhớ 5 loại để nghĩ xem việc mình đang làm thuộc nguy cơ nào và kiểm tra lại.");
  S("w-1",
    "레이저 팔레트 체인저에 스크랩이 걸려 멈췄습니다. E씨는 '금방 빼면 된다'며 문을 열고 손을 넣으려 했고, 그 순간 다른 사람이 조작반에서 재시작 버튼을 누르려 했습니다. 반장이 소리쳐 둘 다 멈췄습니다. 그 뒤로 이 공장은 체인저 안에 들어갈 때 각자 자물쇠를 거는 규칙을 만들었습니다.",
    "Naipit ang scrap sa pallet changer ng laser at huminto ito. Binuksan ni E ang pinto para ipasok ang kamay dahil 'mabilis lang', at sa sandaling iyon, pipindutin na ng iba ang restart sa control panel. Sumigaw ang team leader at parehong huminto. Mula noon, may patakaran nang magkabit ng sariling kandado bago pumasok sa changer.",
    "เศษโลหะติดที่พาเลทเชนเจอร์ของเครื่องเลเซอร์จนหยุด E บอกว่า 'เอาออกแป๊บเดียว' แล้วเปิดประตูจะยื่นมือเข้าไป ขณะนั้นอีกคนกำลังจะกดปุ่มรีสตาร์ทที่แผงควบคุม หัวหน้าตะโกนห้ามทั้งคู่ทัน หลังจากนั้นโรงงานนี้ตั้งกฎให้แต่ละคนคล้องกุญแจของตัวเองก่อนเข้าไปในเชนเจอร์",
    "Phế liệu kẹt ở bộ đổi pallet máy laser làm máy dừng. Anh E nói 'gỡ nhanh thôi' rồi mở cửa định thò tay vào, đúng lúc người khác sắp nhấn nút khởi động lại ở bảng điều khiển. Tổ trưởng hét lên, cả hai dừng kịp. Từ đó xưởng có quy định mỗi người phải khóa ổ khóa của mình trước khi vào bộ đổi pallet.");
  S("w-bend",
    "2인 1조로 긴 판재를 절곡하던 중, 뒤쪽 작업자가 판재를 다시 맞추려고 손을 금형 근처로 넣었는데 앞쪽 작업자는 신호를 들은 줄 알고 페달을 밟으려 했습니다. 다행히 판재가 들리는 것을 보고 발을 뗐습니다. 그 뒤로 이 팀은 '손 떼!' 구호를 외치고, 상대가 '떼었음!'이라고 답한 뒤에만 페달을 밟기로 했습니다.",
    "Habang nagbabaluktot ng mahabang sheet ang dalawang tao, ipinasok ng nasa likod ang kamay malapit sa die para ayusin ang sheet, pero inakala ng nasa harap na may senyas na at tatapak na sa pedal. Buti na lang nakita niyang gumagalaw ang sheet kaya inalis ang paa. Mula noon, sumisigaw sila ng 'Alis kamay!' at tumatapak lang pagkatapos sumagot ng 'Naalis na!'.",
    "ระหว่างพับแผ่นยาวสองคน คนด้านหลังยื่นมือใกล้แม่พิมพ์เพื่อจัดแผ่นใหม่ แต่คนด้านหน้าคิดว่าได้ยินสัญญาณแล้วกำลังจะเหยียบแป้น โชคดีที่เห็นแผ่นขยับจึงยกเท้า หลังจากนั้นทีมนี้ตกลงตะโกน 'เอามือออก!' และเหยียบแป้นหลังอีกฝ่ายตอบ 'ออกแล้ว!' เท่านั้น",
    "Khi hai người chấn tấm dài, người phía sau đưa tay gần khuôn để chỉnh lại tấm, còn người phía trước tưởng đã có tín hiệu nên định đạp bàn đạp. May thấy tấm động đậy nên nhấc chân. Từ đó đội này hô 'Bỏ tay ra!' và chỉ đạp sau khi người kia đáp 'Đã bỏ!'.");
  S("w-2",
    "금형을 교체하던 F씨는 슬라이드를 올린 채 안전블록 없이 금형 위치를 맞추고 있었습니다. 유압이 조금씩 새면서 슬라이드가 천천히 내려오는 것을 동료가 발견해 소리쳤습니다. 기계는 전원을 꺼도 유압·공기압·무게 때문에 움직일 수 있습니다. 그래서 금형 작업에는 안전블록이 반드시 필요합니다.",
    "Inaayos ni F ang posisyon ng die nang nakataas ang slide at walang safety block. Napansin ng kasama na dahan-dahang bumababa ang slide dahil sa tumatagas na hydraulic at sumigaw siya. Kahit patay ang makina, puwede itong gumalaw dahil sa hydraulic, hangin o bigat. Kaya kailangan ang safety block sa trabaho sa die.",
    "F จัดตำแหน่งแม่พิมพ์ขณะยกสไลด์ค้างไว้โดยไม่ใส่บล็อกนิรภัย เพื่อนเห็นสไลด์ค่อย ๆ ลดลงเพราะน้ำมันไฮดรอลิกรั่วจึงตะโกนเตือน แม้ตัดไฟ เครื่องก็อาจขยับได้จากไฮดรอลิก ลม หรือน้ำหนัก งานแม่พิมพ์จึงต้องใช้บล็อกนิรภัยเสมอ",
    "Anh F chỉnh vị trí khuôn khi đầu trượt đang nâng mà không có khối an toàn. Đồng nghiệp thấy đầu trượt từ từ hạ xuống do dầu thủy lực rò nên hét lên. Dù tắt điện, máy vẫn có thể chuyển động do thủy lực, khí nén hay trọng lượng. Vì vậy làm khuôn bắt buộc phải có khối an toàn.");
  S("w-weld",
    "구석진 곳에서 CO2 용접을 하던 G씨가 30분쯤 지나자 머리가 아프고 어지러웠습니다. 흄 흡입기를 멀리 둔 채 작업하고 있었던 것입니다. 흡입기를 용접 부위 가까이 옮기고 출입문을 열어 환기하자 증상이 나아졌습니다. 용접 흄과 가스는 눈에 잘 보이지 않아도 쌓입니다.",
    "Sa sulok, nag-CO₂ welding si G at pagkalipas ng 30 minuto, sumakit ang ulo at nahilo siya. Malayo pala ang fume extractor. Nang ilapit ito sa welding at buksan ang pinto para sa hangin, gumaan ang pakiramdam. Naiipon ang usok at gas kahit hindi gaanong nakikita.",
    "G เชื่อม CO₂ ในมุมอับ ผ่านไปราว 30 นาทีก็ปวดหัวและเวียนหัว เพราะวางเครื่องดูดควันไว้ไกล เมื่อย้ายเครื่องดูดใกล้จุดเชื่อมและเปิดประตูระบายอากาศ อาการก็ดีขึ้น ควันและก๊าซจากการเชื่อมสะสมได้แม้มองไม่ค่อยเห็น",
    "Anh G hàn CO₂ ở góc khuất, khoảng 30 phút sau đau đầu, chóng mặt. Hóa ra máy hút khói để ở xa. Khi dời máy hút lại gần mối hàn và mở cửa thông gió thì đỡ hơn. Khói và khí hàn tích tụ dù khó nhìn thấy.");
  S("w-fork",
    "점심시간 직후, 지게차가 긴 판재를 싣고 통로를 지나는데 휴게실에서 나온 H씨가 휴대폰을 보며 걸어 나왔습니다. 운전자가 경적을 울려 멈췄지만 판재 끝이 H씨 바로 앞에서 섰습니다. 이후 회사는 휴게실 출입구 앞에 보행자 안전선을 칠하고 볼록거울을 달았습니다. 통로에서는 휴대폰을 보지 않습니다.",
    "Pagkatapos ng tanghalian, dumadaan ang forklift na may mahabang sheet nang lumabas si H sa rest area habang nakatingin sa cellphone. Bumusina at huminto ang driver, pero huminto ang dulo ng sheet sa mismong harap ni H. Pagkatapos, nagpinta ang kumpanya ng linya para sa naglalakad at naglagay ng convex mirror. Huwag gumamit ng cellphone sa daanan.",
    "หลังพักเที่ยง รถยกบรรทุกแผ่นยาวผ่านทางเดิน H เดินออกจากห้องพักพลางดูโทรศัพท์ คนขับบีบแตรและหยุด แต่ปลายแผ่นหยุดตรงหน้า H พอดี หลังจากนั้นบริษัททาสีเส้นทางเดินหน้าห้องพักและติดกระจกโค้ง เดินในทางเดินห้ามดูโทรศัพท์",
    "Ngay sau giờ trưa, xe nâng chở tấm dài đi qua lối đi thì anh H vừa ra khỏi phòng nghỉ vừa nhìn điện thoại. Tài xế bấm còi và dừng nhưng đầu tấm dừng ngay trước mặt H. Sau đó công ty sơn vạch an toàn và lắp gương cầu lồi trước cửa phòng nghỉ. Đi trên lối đi không nhìn điện thoại.");
  S("w-crush",
    "금형 대차를 끌고 가던 I씨가 뒤로 걷다 바닥의 턱에 걸려 넘어졌고, 무거운 대차가 계속 굴러와 발등을 눌렀습니다. 안전화 덕분에 발가락뼈는 무사했지만 발등이 크게 부었습니다. 대차는 앞에서 밀고, 경사나 턱이 있으면 두 사람이 함께 옮깁니다.",
    "Habang hinihila ni I ang kariton ng die nang paatras, natisod siya sa gilid ng sahig at natumba; patuloy na gumulong ang mabigat na kariton at dinaganan ang paa niya. Dahil sa safety shoes, ligtas ang buto ng daliri, pero namaga nang husto ang paa. Itulak ang kariton mula sa likod nito, at dalawang tao kapag may dalisdis o gilid.",
    "I เดินถอยหลังลากรถเข็นแม่พิมพ์ สะดุดขอบพื้นล้มลง รถเข็นหนักยังไหลมาทับหลังเท้า เพราะใส่รองเท้านิรภัย กระดูกนิ้วเท้าจึงไม่เป็นไร แต่หลังเท้าบวมมาก รถเข็นต้องเข็นจากด้านหลัง และถ้ามีทางลาดหรือขอบให้ช่วยกันสองคน",
    "Anh I đi lùi kéo xe đẩy khuôn, vấp gờ sàn ngã xuống, chiếc xe nặng tiếp tục lăn tới đè lên mu bàn chân. Nhờ giày bảo hộ nên xương ngón chân không sao nhưng mu bàn chân sưng to. Xe đẩy phải đẩy từ phía sau, có dốc hoặc gờ thì hai người cùng chuyển.");
  S("w-cut",
    "레이저로 자른 부품을 맨손으로 정리하던 J씨는 버에 손바닥을 베였습니다. 상처는 작았지만 기름이 묻은 채 계속 일하다 이틀 뒤 손이 붓고 열이 났습니다. 작은 상처라도 바로 씻고 소독하고 알려야 하는 이유입니다. 그리고 버가 있는 부품은 반드시 베임방지 장갑을 끼고 만집니다.",
    "Inaayos ni J nang walang gloves ang mga piyesang pinutol ng laser at nahiwa ang palad niya ng burr. Maliit ang sugat pero nagpatuloy siyang magtrabaho na may langis, at makalipas ang dalawang araw namaga at nilagnat ang kamay. Kaya hugasan, disimpektahan at ipaalam agad kahit maliit na sugat, at laging magsuot ng cut-resistant gloves sa may burr.",
    "J จัดชิ้นงานที่ตัดด้วยเลเซอร์ด้วยมือเปล่า แล้วถูกครีบบาดฝ่ามือ แผลเล็กแต่ทำงานต่อทั้งที่เปื้อนน้ำมัน สองวันต่อมามือบวมและมีไข้ นี่คือเหตุผลที่แผลเล็กก็ต้องล้าง ฆ่าเชื้อ และแจ้งทันที และชิ้นงานที่มีครีบต้องใส่ถุงมือกันบาดเสมอ",
    "Anh J sắp xếp chi tiết cắt laser bằng tay không và bị ba via cắt vào lòng bàn tay. Vết thương nhỏ nhưng vẫn làm tiếp khi tay dính dầu, hai ngày sau tay sưng và sốt. Vì vậy vết thương nhỏ cũng phải rửa, sát trùng và báo ngay; chi tiết có ba via luôn phải đeo găng chống cắt.");
  S("w-3",
    "드릴 작업을 하던 K씨의 면장갑 끝 실밥이 드릴날에 걸렸습니다. 순식간에 장갑이 감기며 손목이 꺾였고, 다른 손으로 비상정지를 눌러 겨우 멈췄습니다. 장갑을 벗고 일했다면 실밥이 걸릴 일도 없었습니다. 회전체 앞에서는 장갑을 끼지 않거나 몸에 꼭 맞는 전용 장갑만 씁니다.",
    "Habang nag-da-drill si K, sumabit sa drill bit ang sinulid sa dulo ng cotton gloves niya. Biglang napulupot ang gloves at napilipit ang pulso; napindot niya ang emergency stop gamit ang kabilang kamay. Kung walang gloves, walang sinulid na sasabit. Sa umiikot na makina, walang gloves o sakto lang sa kamay na espesyal na gloves.",
    "ระหว่างเจาะ ด้ายที่ปลายถุงมือผ้าของ K เกี่ยวกับดอกสว่าน ถุงมือพันเข้าไปในพริบตาจนข้อมือบิด เขาใช้มืออีกข้างกดปุ่มหยุดฉุกเฉินจึงหยุดได้ ถ้าไม่ใส่ถุงมือ ด้ายก็ไม่เกี่ยว หน้าเครื่องหมุนต้องไม่ใส่ถุงมือ หรือใส่เฉพาะถุงมือพิเศษที่พอดีมือ",
    "Khi khoan, sợi chỉ ở đầu găng vải của anh K mắc vào mũi khoan. Găng bị cuốn vào trong tích tắc làm gãy gập cổ tay, anh phải dùng tay kia nhấn dừng khẩn cấp. Không đeo găng thì đã không có chỉ để mắc. Trước máy quay không đeo găng hoặc chỉ dùng găng chuyên dụng vừa khít tay.");
  S("w-lift",
    "L씨는 2mm 판재를 하루 종일 혼자 들어 옮기다 저녁에 허리를 펴지 못했습니다. 다음 날 반장은 진공 리프터를 쓰는 방법을 알려 주고, 큰 판재는 2인 1조로 바꾸었습니다. 한 번에 다치는 것이 아니라 매일 조금씩 쌓여서 생기는 것이 근골격계질환입니다. 아프기 시작하면 바로 말하세요.",
    "Buong araw na mag-isang binuhat ni L ang 2mm na sheet at sa gabi hindi na niya maituwid ang likod. Kinabukasan, itinuro ng team leader ang paggamit ng vacuum lifter at ginawang 2 tao ang malaking sheet. Hindi isang beses nangyayari ang sakit sa kalamnan at buto—naiipon ito araw-araw. Sabihin agad kapag nagsimulang sumakit.",
    "L ยกแผ่น 2 มม. คนเดียวทั้งวัน ตอนเย็นยืดหลังไม่ได้ วันรุ่งขึ้นหัวหน้าสอนใช้ที่ยกสุญญากาศ และให้แผ่นใหญ่ทำ 2 คน โรคกล้ามเนื้อและกระดูกไม่ได้เกิดครั้งเดียว แต่สะสมทีละน้อยทุกวัน เริ่มเจ็บให้บอกทันที",
    "Anh L tự nâng tấm 2mm suốt cả ngày, đến tối không duỗi lưng được. Hôm sau tổ trưởng hướng dẫn dùng bộ nâng chân không và chuyển tấm lớn sang làm 2 người. Bệnh cơ xương không xảy ra một lần mà tích tụ từng chút mỗi ngày. Bắt đầu đau thì nói ngay.");
  S("w-6",
    "출하 날, M씨는 트럭 적재함 위에서 판재 묶음을 밧줄로 묶다가 뒷걸음질하며 적재함 끝을 밟았습니다. 동료가 팔을 잡아 떨어지지는 않았습니다. 1.5m 높이였지만 콘크리트 바닥에 머리부터 떨어졌다면 크게 다쳤을 것입니다. 상하차는 같은 높이의 상차장에서 하고, 적재함 끝에 등을 지지 않습니다.",
    "Sa araw ng paghahatid, habang itinatali ni M ang bundle sa ibabaw ng trak, umatras siya at natapakan ang gilid. Nahawakan siya ng kasama kaya hindi nahulog. 1.5m lang, pero malubha sana kung ulo ang tumama sa semento. Magkarga sa kapantay na dock at huwag tumalikod sa gilid.",
    "วันส่งของ M มัดเชือกมัดแผ่นโลหะบนกระบะรถ แล้วถอยหลังไปเหยียบขอบกระบะ เพื่อนคว้าแขนไว้ทันจึงไม่ตก สูงแค่ 1.5 ม. แต่ถ้าหัวกระแทกพื้นคอนกรีตคงบาดเจ็บหนัก ขึ้นลงของต้องทำที่ลานที่สูงเท่ากัน และอย่าหันหลังให้ขอบกระบะ",
    "Hôm xuất hàng, anh M buộc dây bó tấm trên thùng xe tải, lùi lại và giẫm hụt mép thùng. Đồng nghiệp kịp nắm tay nên không ngã. Chỉ cao 1,5m nhưng nếu đập đầu xuống nền bê tông thì đã bị thương nặng. Bốc xếp ở bến cao bằng thùng xe, không quay lưng ra mép thùng.");
  S("w-7",
    "비 오는 날, 창고 바닥의 물웅덩이 위에 연장선 멀티탭이 놓여 있었습니다. N씨가 그라인더를 꽂으려다 '찌릿' 하는 느낌에 손을 뗐습니다. 누전차단기가 바로 떨어져 큰 사고는 없었습니다. 그날 멀티탭은 벽에 걸고 누전차단기 시험 버튼을 매달 누르기로 정했습니다.",
    "Sa araw ng ulan, may extension cord sa ibabaw ng tubig sa sahig ng bodega. Habang isasaksak ni N ang grinder, naramdaman niya ang 'kuryente' at binitawan. Agad na pumutok ang breaker kaya walang malaking aksidente. Noong araw ding iyon, isinabit ang extension sa pader at napagkasunduang pindutin buwan-buwan ang test button ng breaker.",
    "วันฝนตก ปลั๊กพ่วงวางอยู่บนแอ่งน้ำบนพื้นโกดัง N จะเสียบเครื่องเจียรแล้วรู้สึก 'ซ่า' จึงปล่อยมือ เบรกเกอร์กันไฟรั่วตัดทันทีจึงไม่เกิดอุบัติเหตุใหญ่ วันนั้นตกลงแขวนปลั๊กพ่วงไว้ที่ผนัง และกดปุ่มทดสอบเบรกเกอร์ทุกเดือน",
    "Ngày mưa, ổ cắm kéo dài nằm trên vũng nước ở sàn kho. Anh N định cắm máy mài thì thấy 'tê tê' nên buông tay. Aptomat chống giật ngắt ngay nên không có tai nạn lớn. Hôm đó quyết định treo ổ cắm lên tường và mỗi tháng nhấn nút thử aptomat.");
  S("w-8",
    "용접하던 곳 뒤편 3m 거리에 기름걸레가 담긴 종이상자가 있었습니다. 작업을 마치고 퇴근한 지 1시간 뒤, 상자에서 연기가 나는 것을 경비원이 발견했습니다. 불티가 걸레 속에서 천천히 타고 있었던 것입니다. 용접이 끝난 뒤에도 30분 이상 주변에 불씨가 없는지 확인합니다.",
    "May kahong papel na may basahang may langis 3m sa likod ng lugar ng welding. Isang oras matapos umuwi ang manggagawa, nakita ng guard na umuusok ang kahon. Dahan-dahang nagliliyab pala ang spark sa loob ng basahan. Pagkatapos mag-weld, tingnan ang paligid nang hindi bababa sa 30 minuto kung may baga.",
    "ห่างจากจุดเชื่อมไปข้างหลัง 3 ม. มีกล่องกระดาษใส่ผ้าเปื้อนน้ำมัน หนึ่งชั่วโมงหลังเลิกงาน ยามเห็นควันออกจากกล่อง ประกายไฟไหม้อยู่ในผ้าอย่างช้า ๆ หลังเชื่อมเสร็จต้องตรวจรอบ ๆ อย่างน้อย 30 นาทีว่าไม่มีถ่านไฟ",
    "Cách chỗ hàn 3m phía sau có thùng giấy đựng giẻ dầu. Một giờ sau khi tan ca, bảo vệ thấy khói bốc ra từ thùng. Tia lửa đã âm ỉ cháy trong giẻ. Hàn xong phải kiểm tra xung quanh ít nhất 30 phút xem còn tàn lửa không.");
  S("w-confined",
    "집수조 펌프를 고치러 들어간 작업자가 쓰러지자, 위에 있던 동료가 이름을 부르며 사다리를 내려가려 했습니다. 감시인으로 있던 반장이 붙잡고 119에 먼저 신고했고, 구조대가 공기호흡기를 쓰고 들어갔습니다. 동료를 구하려는 마음은 귀하지만, 맨몸으로 들어가면 두 사람 모두 쓰러집니다.",
    "Nang bumagsak ang manggagawang pumasok para ayusin ang pump ng sump, sinubukan ng kasama sa itaas na bumaba sa hagdan habang tinatawag ang pangalan niya. Pinigilan siya ng team leader na tagabantay at tumawag muna sa 119; pumasok ang rescue team na may breathing apparatus. Mahalaga ang kagustuhang tumulong, pero kapag pumasok nang walang proteksyon, pareho kayong babagsak.",
    "คนงานที่ลงไปซ่อมปั๊มในบ่อพักน้ำล้มลง เพื่อนข้างบนเรียกชื่อแล้วจะลงบันไดไป หัวหน้าที่เป็นผู้เฝ้าระวังรั้งไว้และโทร 119 ก่อน ทีมกู้ภัยใส่เครื่องช่วยหายใจลงไปช่วย ความตั้งใจจะช่วยเพื่อนมีค่า แต่ถ้าลงไปตัวเปล่าจะล้มทั้งสองคน",
    "Công nhân xuống sửa bơm trong hố thu nước bị ngã quỵ, đồng nghiệp phía trên vừa gọi tên vừa định leo xuống thang. Tổ trưởng làm người giám sát giữ lại và gọi 119 trước; đội cứu hộ đeo bình thở xuống cứu. Ý muốn cứu đồng nghiệp rất quý, nhưng xuống không bảo hộ thì cả hai sẽ cùng ngã.");
  S("p1-3",
    "프레스 작업 중 손가락을 다친 동료를 보고 모두 당황해 우왕좌왕했습니다. 그때 응급처치 교육을 받은 O씨가 깨끗한 수건으로 상처를 누르고, 다른 사람에게 119와 반장에게 연락하라고 정확히 지시했습니다. 잘린 손가락은 거즈로 싸서 비닐에 넣고 얼음물에 담가 함께 보냈습니다. 침착한 한 사람이 결과를 바꿉니다.",
    "Nang masaktan ang daliri ng kasama sa press, nataranta ang lahat. Si O, na may first aid training, ay diniinan ang sugat ng malinis na tuwalya at malinaw na inutusan ang iba na tumawag sa 119 at sa team leader. Binalot ng gasa ang naputol na daliri, inilagay sa plastik at sa tubig na may yelo, at isinama. Isang kalmadong tao ang nagbabago ng resulta.",
    "เมื่อเพื่อนบาดเจ็บที่นิ้วจากเครื่องเพรส ทุกคนตกใจทำอะไรไม่ถูก O ที่เคยอบรมปฐมพยาบาลใช้ผ้าสะอาดกดแผล และสั่งให้คนอื่นโทร 119 และแจ้งหัวหน้าอย่างชัดเจน นิ้วที่ขาดห่อผ้าก๊อซใส่ถุงแช่น้ำแข็งส่งไปด้วย คนที่ใจเย็นเพียงคนเดียวเปลี่ยนผลลัพธ์ได้",
    "Khi đồng nghiệp bị thương ngón tay ở máy dập, ai cũng hoảng loạn. Anh O từng học sơ cứu đã dùng khăn sạch ấn vết thương và chỉ rõ người khác gọi 119, báo tổ trưởng. Ngón tay đứt được bọc gạc, cho vào túi, ngâm nước đá và gửi theo. Một người bình tĩnh có thể thay đổi kết quả.");
  S("c-fire",
    "레이저 가공기 집진기 쪽에서 연기가 나자 P씨는 소화기를 들고 갔지만 안전핀이 잘 안 빠져 시간을 놓쳤습니다. 다른 동료가 비상정지를 누르고 소화기를 다시 가져와 껐습니다. 그 뒤 이 공장은 분기마다 소화기를 실제로 들어 보고 핀을 뽑는 연습을 합니다. 한 번 해 본 사람은 실제 상황에서 몸이 먼저 움직입니다.",
    "Nang umusok ang dust collector ng laser, dinala ni P ang extinguisher pero hindi agad natanggal ang safety pin kaya nasayang ang oras. Pinindot ng kasama ang emergency stop, kumuha ng isa pang extinguisher at pinatay ang apoy. Mula noon, tuwing quarter nagsasanay sila sa pag-angat ng extinguisher at pagtanggal ng pin. Ang nakasubok na ay mabilis kumilos sa totoong sitwasyon.",
    "เมื่อมีควันจากเครื่องดูดฝุ่นของเครื่องเลเซอร์ P ถือถังดับเพลิงไป แต่ดึงสลักไม่ออกจนเสียเวลา เพื่อนอีกคนกดหยุดฉุกเฉินและนำถังอีกใบมาดับ หลังจากนั้นโรงงานนี้ซ้อมยกถังดับเพลิงและดึงสลักจริงทุกไตรมาส คนที่เคยลองแล้วจะลงมือได้ทันทีในเหตุการณ์จริง",
    "Khi máy hút bụi của máy laser bốc khói, anh P cầm bình chữa cháy chạy tới nhưng rút chốt mãi không ra nên mất thời gian. Đồng nghiệp khác nhấn dừng khẩn cấp, lấy bình khác dập tắt. Từ đó xưởng tập cầm bình thật và rút chốt mỗi quý. Người đã từng thử sẽ phản xạ nhanh khi gặp thật.");
  S("p1-10",
    "Q씨가 '절곡기 뒤 백게이지 쪽 바닥이 미끄럽다'고 TBM에서 말했습니다. 반장은 위험성평가 표에 적고, 원인을 찾아보니 유압유가 조금씩 새고 있었습니다. 호스를 바꾸고 미끄럼 방지 매트를 깔았습니다. 근로자의 한마디가 위험성평가의 시작이고, 회사의 개선으로 끝납니다.",
    "Sinabi ni Q sa TBM na 'madulas ang sahig sa likod ng bending machine, sa may backgauge'. Isinulat ito ng team leader sa risk assessment at nalamang tumatagas ang hydraulic oil. Pinalitan ang hose at naglagay ng anti-slip mat. Nagsisimula ang risk assessment sa salita ng manggagawa at nagtatapos sa pagpapabuti ng kumpanya.",
    "Q พูดใน TBM ว่า 'พื้นด้านหลังเครื่องพับตรงแบ็กเกจลื่น' หัวหน้าจดลงในแบบประเมินความเสี่ยง ตรวจหาสาเหตุพบว่าน้ำมันไฮดรอลิกรั่วทีละน้อย จึงเปลี่ยนสายและปูแผ่นกันลื่น การประเมินความเสี่ยงเริ่มจากคำพูดของคนงาน และจบที่การปรับปรุงของบริษัท",
    "Anh Q nói trong TBM 'sàn phía sau máy chấn, chỗ cữ sau, bị trơn'. Tổ trưởng ghi vào bảng đánh giá rủi ro, tìm nguyên nhân thì thấy dầu thủy lực rò từng chút. Đã thay ống và trải thảm chống trơn. Đánh giá rủi ro bắt đầu từ một lời của người lao động và kết thúc bằng cải tiến của công ty.");
  S("p1-4",
    "외국에서 온 R씨는 입사 교육 때 한국어 설명을 반만 알아들었지만 서명했습니다. 첫날 지게차 통로를 모르고 걷다 경적 소리에 놀랐습니다. 그 뒤 회사는 그림과 R씨의 모국어 자료로 다시 교육했습니다. 이해하지 못한 교육은 받지 않은 것과 같습니다. 모르면 '다시 설명해 주세요'라고 말하세요.",
    "Si R, mula sa ibang bansa, kalahati lang ang naintindihan sa orientation sa Korean pero pumirma. Sa unang araw, hindi niya alam ang daanan ng forklift at nagulat sa busina. Pagkatapos, muling nagsanay ang kumpanya gamit ang larawan at materyales sa sariling wika ni R. Ang hindi naintindihang training ay parang hindi natanggap. Sabihin: 'Pakiulit po.'",
    "R ที่มาจากต่างประเทศเข้าใจการอบรมแรกเข้าที่อธิบายเป็นภาษาเกาหลีแค่ครึ่งเดียวแต่ก็เซ็นชื่อ วันแรกเดินในทางรถยกโดยไม่รู้ตัวจนตกใจเสียงแตร หลังจากนั้นบริษัทอบรมใหม่ด้วยรูปภาพและเอกสารภาษาแม่ของ R การอบรมที่ไม่เข้าใจก็เหมือนไม่ได้รับ ไม่เข้าใจให้พูดว่า 'ช่วยอธิบายอีกครั้ง'",
    "Anh R đến từ nước ngoài chỉ hiểu một nửa buổi đào tạo đầu vào bằng tiếng Hàn nhưng vẫn ký. Ngày đầu đi vào lối xe nâng mà không biết, giật mình vì tiếng còi. Sau đó công ty đào tạo lại bằng hình ảnh và tài liệu bằng tiếng mẹ đẻ của R. Đào tạo mà không hiểu thì như chưa được đào tạo. Không hiểu hãy nói 'Xin giải thích lại'.");
  S("p1-8",
    "용접을 10년 한 S씨는 특수건강진단에서 청력이 떨어졌다는 결과(C1)를 받았습니다. 처음엔 별것 아니라고 생각했지만, 의사의 권고에 따라 귀마개를 바꾸고 소음이 덜한 공정과 번갈아 일하게 되었습니다. 1년 뒤 검사에서 더 나빠지지 않았습니다. 건강진단 결과는 '나를 위한 경고등'입니다.",
    "Si S, 10 taon nang welder, ay nakakuha ng resultang C1 sa special check-up—humina ang pandinig. Noong una, inakala niyang wala lang, pero sinunod niya ang doktor: pinalitan ang ear plug at nagpapalit-palit sa mas tahimik na proseso. Pagkalipas ng isang taon, hindi na lumala. Ang resulta ng check-up ay 'babalang ilaw para sa iyo'.",
    "S เป็นช่างเชื่อมมา 10 ปี ได้ผลตรวจสุขภาพพิเศษ C1 ว่าการได้ยินลดลง ตอนแรกคิดว่าไม่เป็นไร แต่ทำตามคำแนะนำแพทย์ เปลี่ยนที่อุดหูและสลับไปทำงานที่เสียงเบากว่า ผลตรวจปีถัดมาไม่แย่ลง ผลตรวจสุขภาพคือ 'ไฟเตือนเพื่อตัวเรา'",
    "Anh S làm thợ hàn 10 năm, nhận kết quả khám đặc biệt C1 — thính lực giảm. Lúc đầu nghĩ không sao, nhưng làm theo khuyến nghị của bác sĩ: đổi nút tai và luân phiên làm công đoạn ít ồn hơn. Một năm sau khám lại không xấu thêm. Kết quả khám sức khỏe là 'đèn cảnh báo cho chính mình'.");
  S("c-noise",
    "T씨는 '귀마개를 끼면 신호를 못 듣는다'며 끼지 않았습니다. 반장은 귀마개를 껴도 사람 목소리와 경적은 들린다는 것을 함께 확인시켜 주었고, 대신 중요한 신호는 손짓으로도 하기로 정했습니다. 소음성 난청은 아프지 않게, 몇 년에 걸쳐 조용히 찾아옵니다.",
    "Hindi nagsusuot ng ear plug si T dahil 'hindi ko maririnig ang senyas'. Ipinakita ng team leader na naririnig pa rin ang boses at busina kahit may ear plug, at napagkasunduang gamitin din ang hand signal para sa mahahalagang senyas. Dahan-dahan at walang sakit na dumarating ang pagkabingi dahil sa ingay sa loob ng ilang taon.",
    "T ไม่ใส่ที่อุดหูเพราะ 'ใส่แล้วไม่ได้ยินสัญญาณ' หัวหน้าพาลองว่าใส่แล้วยังได้ยินเสียงคนและแตร และตกลงใช้สัญญาณมือสำหรับสัญญาณสำคัญด้วย หูตึงจากเสียงดังมาอย่างเงียบ ๆ ไม่เจ็บ ใช้เวลาหลายปี",
    "Anh T không đeo nút tai vì 'đeo vào không nghe được tín hiệu'. Tổ trưởng cho thử thấy đeo vẫn nghe được giọng người và tiếng còi, đồng thời thống nhất dùng thêm ký hiệu tay cho tín hiệu quan trọng. Điếc do tiếng ồn đến lặng lẽ, không đau, qua nhiều năm.");
  S("c-heat",
    "8월 오후, 철판 지붕 아래에서 용접하던 U씨가 갑자기 말이 어눌해지고 비틀거렸습니다. 동료가 바로 시원한 휴게실로 옮기고 119에 신고한 뒤, 옷을 느슨하게 하고 몸에 물을 뿌리며 부채질했습니다. 병원에서는 빨리 몸을 식힌 덕분에 회복이 빨랐다고 했습니다. 더운 날에는 서로의 얼굴을 살펴 주세요.",
    "Isang hapon ng Agosto, habang nagwe-weld sa ilalim ng bubong na bakal, biglang lumabo ang pagsasalita ni U at sumuray. Agad siyang dinala ng kasama sa malamig na rest area, tumawag sa 119, niluwagan ang damit, binasa ng tubig at pinaypayan. Sabi ng ospital, mabilis siyang gumaling dahil agad napalamig. Sa mainit na araw, bantayan ang isa't isa.",
    "บ่ายวันหนึ่งในเดือนสิงหาคม U เชื่อมอยู่ใต้หลังคาเหล็ก จู่ ๆ พูดไม่ชัดและเดินเซ เพื่อนพาไปห้องพักที่เย็นทันที โทร 119 คลายเสื้อผ้า ราดน้ำและพัดให้ โรงพยาบาลบอกว่าฟื้นเร็วเพราะลดอุณหภูมิได้เร็ว วันที่ร้อนให้คอยดูหน้าตาของกันและกัน",
    "Một buổi chiều tháng 8, anh U đang hàn dưới mái tôn bỗng nói líu lưỡi và loạng choạng. Đồng nghiệp lập tức đưa vào phòng nghỉ mát, gọi 119, nới lỏng quần áo, tưới nước và quạt. Bệnh viện nói nhờ làm mát nhanh nên hồi phục nhanh. Ngày nóng hãy để ý sắc mặt của nhau.");
  S("c-chem",
    "V씨는 세척제를 다룰 때 장갑이 불편하다며 맨손으로 일했습니다. 몇 주 뒤 손이 갈라지고 가려운 피부염이 생겼습니다. 화학물질용 장갑으로 바꾸고 일이 끝나면 보습제를 바르자 나아졌습니다. 피부로 스며드는 물질은 냄새가 없어도 몸에 쌓일 수 있습니다.",
    "Nagtrabaho si V nang walang gloves sa panlinis dahil hindi komportable. Pagkalipas ng ilang linggo, nagkaroon siya ng dermatitis—bitak at makati ang kamay. Gumaling ito nang gumamit ng chemical gloves at moisturizer pagkatapos ng trabaho. Naiipon sa katawan ang kemikal na tumatagos sa balat kahit walang amoy.",
    "V จับน้ำยาล้างด้วยมือเปล่าเพราะใส่ถุงมือไม่สะดวก ไม่กี่สัปดาห์ต่อมามือแตกและคันเป็นผิวหนังอักเสบ เมื่อเปลี่ยนเป็นถุงมือกันสารเคมีและทาครีมหลังเลิกงานก็ดีขึ้น สารที่ซึมผ่านผิวสะสมในร่างกายได้แม้ไม่มีกลิ่น",
    "Anh V làm với chất tẩy rửa bằng tay không vì thấy găng vướng víu. Vài tuần sau tay nứt nẻ, ngứa, bị viêm da. Đổi sang găng chống hóa chất và bôi kem dưỡng sau giờ làm thì đỡ. Chất thấm qua da có thể tích tụ trong cơ thể dù không có mùi.");
  S("c-heart",
    "야간 근무를 마친 W씨가 아침에 가슴이 조이는 느낌이 있었지만 '피곤해서 그렇다'며 참았습니다. 동료가 얼굴이 창백한 것을 보고 바로 119를 불렀고, 병원에서 심근경색 초기라는 진단을 받았습니다. 빨리 치료를 받아 회복할 수 있었습니다. 가슴 통증은 참지 말고 바로 알립니다.",
    "Pagkatapos ng night shift, nakaramdam si W ng paninikip ng dibdib sa umaga pero tiniis dahil 'pagod lang'. Nakita ng kasama na maputla siya kaya tumawag agad sa 119; sa ospital, maagang heart attack ang diagnosis. Dahil maagang nagamot, gumaling siya. Huwag tiisin ang sakit sa dibdib—sabihin agad.",
    "หลังจบกะกลางคืน W รู้สึกแน่นหน้าอกตอนเช้า แต่ทนไว้เพราะคิดว่า 'แค่เหนื่อย' เพื่อนเห็นหน้าซีดจึงโทร 119 ทันที โรงพยาบาลวินิจฉัยว่าเป็นกล้ามเนื้อหัวใจขาดเลือดระยะแรก ได้รักษาเร็วจึงหายได้ เจ็บหน้าอกอย่าทน ให้บอกทันที",
    "Sau ca đêm, sáng ra anh W thấy tức ngực nhưng cố chịu vì nghĩ 'chỉ mệt thôi'. Đồng nghiệp thấy mặt tái nên gọi 119 ngay; bệnh viện chẩn đoán nhồi máu cơ tim giai đoạn đầu. Nhờ chữa trị sớm nên hồi phục. Đau ngực đừng chịu đựng, hãy báo ngay.");
  S("c-stress",
    "한국에 온 지 6개월 된 X씨는 말이 잘 통하지 않아 혼자 밥을 먹고, 밤에 잠을 잘 못 잤습니다. 작업 중 실수가 잦아지자 반장이 따로 불러 이야기를 들었습니다. 같은 나라 출신 선배와 점심을 함께 먹게 하고, 외국인력상담센터 번호를 알려 주었습니다. 힘들다는 말은 약한 것이 아니라 나를 지키는 용기입니다.",
    "Si X, 6 buwan pa lang sa Korea, ay mag-isang kumakain dahil hirap makipag-usap at hindi makatulog sa gabi. Nang dumami ang mali sa trabaho, kinausap siya ng team leader. Pinasabay siya sa tanghalian sa senior na kababayan at binigyan ng numero ng Foreign Workforce Counseling Center. Hindi kahinaan ang pagsasabing nahihirapan ka—tapang iyon.",
    "X มาเกาหลีได้ 6 เดือน สื่อสารไม่ค่อยได้จึงกินข้าวคนเดียวและนอนไม่ค่อยหลับ เมื่อทำงานผิดพลาดบ่อยขึ้น หัวหน้าเรียกมาคุยแยก ให้ไปกินข้าวกับรุ่นพี่ชาติเดียวกัน และให้เบอร์ศูนย์ให้คำปรึกษาแรงงานต่างชาติ การบอกว่าลำบากไม่ใช่ความอ่อนแอ แต่เป็นความกล้าที่ปกป้องตัวเอง",
    "Anh X sang Hàn được 6 tháng, khó giao tiếp nên ăn cơm một mình, đêm khó ngủ. Khi làm việc hay mắc lỗi, tổ trưởng gọi riêng ra nói chuyện, xếp cho ăn trưa cùng đàn anh đồng hương và cho số Trung tâm tư vấn lao động nước ngoài. Nói ra mình đang khó khăn không phải yếu đuối mà là dũng khí bảo vệ bản thân.");
  S("p1-11",
    "한여름, 휴게실 에어컨이 고장 나 근로자들이 기계 옆 그늘에서 쉬었습니다. 쉬는 시간에도 소음과 열에서 벗어나지 못하자 오후 실수가 늘었습니다. 근로자 대표가 회사에 알렸고, 회사는 바로 수리하고 정수기도 새로 놓았습니다. 제대로 쉬는 것도 안전입니다.",
    "Sa kalagitnaan ng tag-init, nasira ang aircon ng rest area kaya nagpahinga ang mga manggagawa sa lilim sa tabi ng makina. Hindi sila nakaalis sa ingay at init kahit pahinga kaya dumami ang mali sa hapon. Ipinaalam ito ng kinatawan ng manggagawa at agad itong inayos ng kumpanya at naglagay ng water dispenser. Kaligtasan din ang maayos na pahinga.",
    "กลางฤดูร้อน แอร์ห้องพักเสีย คนงานจึงพักในที่ร่มข้างเครื่องจักร ช่วงพักก็หนีเสียงดังและความร้อนไม่พ้น ช่วงบ่ายจึงผิดพลาดบ่อยขึ้น ตัวแทนคนงานแจ้งบริษัท บริษัทซ่อมทันทีและติดตั้งเครื่องกรองน้ำใหม่ การพักอย่างถูกต้องก็คือความปลอดภัย",
    "Giữa mùa hè, điều hòa phòng nghỉ hỏng nên công nhân nghỉ dưới bóng râm cạnh máy. Giờ nghỉ vẫn không thoát được tiếng ồn và nhiệt nên chiều lỗi tăng lên. Đại diện người lao động báo công ty, công ty sửa ngay và lắp thêm máy lọc nước. Nghỉ ngơi đúng cách cũng là an toàn.");
  S("p2-1",
    "한 공장에서 근로자가 '프레스 안전장치가 자주 고장 난다'고 여러 번 말했지만 고쳐지지 않았고, 결국 끼임 사고로 사망자가 생겼습니다. 조사에서 회사가 위험을 알고도 예산과 인력을 쓰지 않은 것이 드러났습니다. 중대재해처벌법은 바로 이런 일을 막기 위해, 경영책임자가 미리 위험을 없애도록 책임을 지운 법입니다.",
    "Sa isang pabrika, ilang beses sinabi ng manggagawa na 'madalas masira ang safety device ng press' pero hindi naayos, at may namatay sa pagkaipit. Lumabas sa imbestigasyon na alam ng kumpanya ang panganib pero hindi naglaan ng badyet at tauhan. Ginawa ang Serious Accidents Punishment Act para pigilan ito—pinananagot ang namamahala na alisin muna ang panganib.",
    "ในโรงงานแห่งหนึ่ง คนงานบอกหลายครั้งว่า 'อุปกรณ์นิรภัยของเครื่องเพรสเสียบ่อย' แต่ไม่ได้รับการแก้ไข สุดท้ายมีผู้เสียชีวิตจากการถูกหนีบ การสอบสวนพบว่าบริษัทรู้ถึงอันตรายแต่ไม่ใช้งบและคน พ.ร.บ.ลงโทษอุบัติเหตุร้ายแรงมีไว้ป้องกันเรื่องแบบนี้ โดยให้ผู้บริหารรับผิดชอบขจัดอันตรายล่วงหน้า",
    "Ở một nhà máy, công nhân nhiều lần nói 'thiết bị an toàn máy dập hay hỏng' nhưng không được sửa, cuối cùng có người chết vì bị kẹp. Điều tra cho thấy công ty biết nguy hiểm mà không chi ngân sách, nhân lực. Luật Xử phạt tai nạn nghiêm trọng ra đời để ngăn chuyện như vậy, buộc người đứng đầu loại bỏ nguy hiểm từ trước.");
  S("p2-2",
    "Y씨는 TBM에서 '크레인 리모컨의 비상정지 버튼이 눌려도 바로 안 멈춘다'고 말했습니다. 반장은 그날 크레인 사용을 멈추고 업체를 불러 수리했으며, 이 내용을 안전 점검표에 기록했습니다. 근로자의 의견을 듣고, 고치고, 기록하는 것 — 이것이 회사가 해야 하는 안전보건관리체계의 모습입니다.",
    "Sinabi ni Y sa TBM na 'hindi agad humihinto ang crane kapag pinindot ang emergency stop sa remote'. Itinigil ng team leader ang paggamit ng crane noong araw ding iyon, nagpatawag ng technician, at itinala ito sa safety checklist. Makinig, ayusin, itala—iyan ang sistemang pangkaligtasan na dapat gawin ng kumpanya.",
    "Y พูดใน TBM ว่า 'กดปุ่มหยุดฉุกเฉินที่รีโมตเครนแล้วไม่หยุดทันที' หัวหน้าหยุดใช้เครนวันนั้นเลย เรียกช่างมาซ่อม และบันทึกลงแบบตรวจความปลอดภัย ฟังความเห็นคนงาน แก้ไข และบันทึก — นี่คือระบบการจัดการความปลอดภัยที่บริษัทต้องทำ",
    "Anh Y nói trong TBM 'nhấn nút dừng khẩn cấp trên điều khiển cẩu mà không dừng ngay'. Tổ trưởng ngừng dùng cẩu ngay hôm đó, gọi đơn vị sửa chữa và ghi vào phiếu kiểm tra an toàn. Lắng nghe, sửa chữa, ghi chép — đó là hệ thống quản lý an toàn công ty phải làm.");
  S("p4-4",
    "Z씨가 상사의 폭언을 회사에 신고했지만 두 달이 지나도 조사가 시작되지 않았고, 오히려 야간조로 옮겨졌습니다. Z씨는 기록과 동료의 진술을 모아 지방고용노동관서에 진정했습니다. 근로감독관이 조사해 회사에 과태료가 부과되었고, Z씨는 원래 근무조로 돌아왔습니다.",
    "Iniulat ni Z sa kumpanya ang pagmumura ng boss, pero kahit dalawang buwan na, walang imbestigasyon at inilipat pa siya sa night shift. Inipon ni Z ang tala at pahayag ng kasama at nagreklamo sa labor office. Nag-imbestiga ang labor inspector, pinagmulta ang kumpanya, at naibalik si Z sa dati niyang shift.",
    "Z แจ้งบริษัทเรื่องหัวหน้าด่าว่า แต่ผ่านไปสองเดือนก็ยังไม่สอบสวน กลับถูกย้ายไปกะกลางคืน Z รวบรวมบันทึกและคำให้การของเพื่อน แล้วยื่นคำร้องที่สำนักงานแรงงาน เจ้าหน้าที่ตรวจแรงงานสอบสวนและปรับบริษัท Z ได้กลับไปทำกะเดิม",
    "Chị Z báo công ty về việc cấp trên chửi mắng nhưng hai tháng vẫn chưa điều tra, còn bị chuyển sang ca đêm. Z thu thập ghi chép và lời khai đồng nghiệp rồi khiếu nại lên văn phòng lao động. Thanh tra lao động điều tra, công ty bị phạt, Z được trở lại ca cũ.");
  S("p4-5",
    "외국에서 온 AA씨는 선배가 매일 이름 대신 '야, 외국인!'이라고 부르는 것이 싫었지만 참았습니다. 동료가 이를 반장에게 알렸고, 반장은 선배와 따로 이야기한 뒤 모두에게 이름을 부르자고 TBM에서 말했습니다. 작은 호칭 하나가 사람을 존중하는지 보여 줍니다.",
    "Ayaw ni AA, mula sa ibang bansa, na tinatawag siya ng senior araw-araw ng 'Hoy, dayuhan!' sa halip na pangalan pero tiniis niya. Ipinaalam ito ng kasama sa team leader, na kinausap ang senior at sinabi sa TBM na tawagin ang lahat sa pangalan. Ang simpleng pagtawag ay nagpapakita kung iginagalang ang tao.",
    "AA ที่มาจากต่างประเทศไม่ชอบที่รุ่นพี่เรียกทุกวันว่า 'เฮ้ย ต่างชาติ!' แทนชื่อ แต่ก็ทนไว้ เพื่อนแจ้งหัวหน้า หัวหน้าคุยกับรุ่นพี่แยก และบอกใน TBM ให้ทุกคนเรียกชื่อกัน คำเรียกเล็ก ๆ แสดงว่าเราเคารพคนหรือไม่",
    "Chị AA đến từ nước ngoài không thích bị đàn anh gọi mỗi ngày là 'Ê, người nước ngoài!' thay vì tên nhưng vẫn chịu đựng. Đồng nghiệp báo tổ trưởng, tổ trưởng nói chuyện riêng với đàn anh rồi nhắc trong TBM mọi người gọi nhau bằng tên. Một cách xưng hô nhỏ cho thấy có tôn trọng con người hay không.");
  S("p4-6",
    "단체 채팅방에서 한 직원이 여성 동료의 사진에 몸매를 평가하는 글을 올렸고, 몇 명이 웃는 이모티콘을 달았습니다. 다른 동료가 '이건 아닌 것 같아요'라고 짧게 쓰고 관리자에게 알렸습니다. 회사는 글을 삭제하고 조사해 징계했습니다. 웃는 이모티콘 하나도 2차 피해가 될 수 있습니다.",
    "Sa group chat, nag-post ang isang empleyado ng komento tungkol sa katawan ng babaeng kasama sa litrato niya, at may ilang naglagay ng tumatawang emoji. Maikling isinulat ng isa pang kasama na 'Hindi tama ito' at iniulat sa manager. Binura ng kumpanya ang post, nag-imbestiga at nagdisiplina. Puwedeng pangalawang pinsala kahit isang tumatawang emoji.",
    "ในกลุ่มแชท พนักงานคนหนึ่งโพสต์วิจารณ์รูปร่างในรูปของเพื่อนผู้หญิง และมีหลายคนใส่อีโมจิหัวเราะ เพื่อนอีกคนพิมพ์สั้น ๆ ว่า 'แบบนี้ไม่ถูกนะ' แล้วแจ้งผู้จัดการ บริษัทลบโพสต์ สอบสวน และลงโทษ อีโมจิหัวเราะแค่อันเดียวก็เป็นความเสียหายซ้ำได้",
    "Trong nhóm chat, một nhân viên đăng lời bình phẩm cơ thể trên ảnh của nữ đồng nghiệp, vài người thả biểu tượng cười. Một đồng nghiệp khác viết ngắn 'Thế này không đúng đâu' và báo quản lý. Công ty xóa bài, điều tra và kỷ luật. Một biểu tượng cười cũng có thể là tổn hại thứ cấp.");
  S("p4-7",
    "납품하러 온 거래처 기사가 사무실 여직원에게 반복해서 사적인 질문을 하고 손을 잡으려 했습니다. 직원이 관리자에게 알리자, 회사는 그 기사의 납품 시간에 남자 직원이 응대하도록 바꾸고 거래처에 공식 항의했습니다. 거래처는 기사를 교체했습니다.",
    "Paulit-ulit na nagtanong ng personal ang delivery driver ng kliyente sa babaeng staff sa opisina at sinubukang hawakan ang kamay niya. Nang iulat niya ito, binago ng kumpanya ang tumatanggap sa oras ng delivery at pormal na nagreklamo sa kliyente. Pinalitan ng kliyente ang driver.",
    "คนขับส่งของจากบริษัทคู่ค้าถามเรื่องส่วนตัวพนักงานหญิงในออฟฟิศซ้ำ ๆ และพยายามจับมือ เมื่อพนักงานแจ้งผู้จัดการ บริษัทให้พนักงานชายรับของในช่วงเวลาส่งของของคนขับคนนั้น และประท้วงคู่ค้าอย่างเป็นทางการ คู่ค้าเปลี่ยนคนขับ",
    "Tài xế giao hàng của đối tác liên tục hỏi chuyện riêng tư nữ nhân viên văn phòng và định nắm tay. Khi chị báo quản lý, công ty đổi sang nhân viên nam tiếp nhận vào giờ giao hàng của tài xế đó và phản đối chính thức với đối tác. Đối tác đã thay tài xế.");
  S("p4-8",
    "BB씨가 괴롭힘을 신고한 뒤, 일부 동료가 '회사 분위기를 망쳤다'며 BB씨에게 말을 걸지 않았습니다. 회사는 이것도 2차 피해로 보고 해당 직원들에게 주의를 주고 다시 교육했습니다. 신고한 사람이 외롭지 않게 하는 것, 그것이 동료가 할 수 있는 가장 큰 도움입니다.",

  S("p4-10",

    C(RY(5), L("한 구청의 과장(서울행정법원, 2026년 9월). 지각하지 않은 팀장에게 \"늦게 왔네, 몇 시에 왔어?\"라고 몰아세우고, 육아휴직을 내려는 직원에게 \"남편한테 보라고 해\"라며 막았다. → 법원은 단 한 번의 말이라도 괴롭힘이 될 수 있다며 징계(감봉)가 정당하다고 했다. → '한 번뿐이었다'는 변명이 되지 않는다. 휴가·휴직을 막는 말도 괴롭힘이다.",
      "Isang manager sa district office (Seoul Administrative Court, Set. 2026). Pinagalitan niya ang team leader na hindi naman nahuli: 'Late ka, anong oras ka dumating?' at pinigilan ang empleyadong magpa-parental leave: 'Asawa mo ang mag-alaga.' → Sinabi ng korte na kahit isang beses na salita ay puwedeng panliligalig, at tama ang parusang bawas-sahod. → Hindi palusot ang 'isang beses lang'. Panliligalig din ang pagpigil sa leave.",
      "หัวหน้าแผนกในสำนักงานเขต (ศาลปกครองโซล ก.ย. 2026) ต่อว่าหัวหน้าทีมที่ไม่ได้มาสายว่า 'มาสายนะ มากี่โมง' และขวางพนักงานที่จะลาเลี้ยงลูกว่า 'ให้สามีเลี้ยงสิ' → ศาลชี้ว่าแม้พูดครั้งเดียวก็เป็นการกลั่นแกล้งได้ และการลงโทษตัดเงินเดือนชอบแล้ว → 'แค่ครั้งเดียว' ไม่ใช่ข้ออ้าง การขวางการลาก็เป็นการกลั่นแกล้ง",
      "Trưởng phòng ở một văn phòng quận (Tòa Hành chính Seoul, 9/2026). Mắng tổ trưởng không hề đi muộn: 'Đến muộn nhỉ, mấy giờ mới đến?', và ngăn nhân viên xin nghỉ nuôi con: 'Bảo chồng trông đi.' → Tòa cho rằng dù chỉ một câu cũng có thể là quấy rối, kỷ luật cắt lương là đúng. → 'Chỉ một lần' không phải lý do. Ngăn nghỉ phép, nghỉ việc cũng là quấy rối.")),
    C(RN(6), L("한 콜센터의 입사 동기 두 사람(서울행정법원, 2026년 2월 보도). 한 사람이 다른 사람에게 욕을 하고 의자를 밀쳤다. 회사는 괴롭힘으로 징계했지만, 법원은 같은 시기에 들어온 동료 사이라 지위·관계의 우위가 없다며 괴롭힘이 아니라고 보고 징계를 취소했다. → 괴롭힘은 '힘의 차이'가 있어야 한다. 하지만 욕설·폭행은 괴롭힘이 아니어도 회사 규칙 위반이나 범죄가 될 수 있다.",
      "Dalawang magkasabay na pumasok sa isang call center (Seoul Administrative Court, ulat Peb. 2026). Minura ng isa ang isa at itinulak ang upuan. Pinarusahan ito ng kumpanya bilang panliligalig, pero kinansela ng korte: walang lamang sa posisyon o relasyon dahil magkasabay silang pumasok. → Kailangan ng 'pagkakaiba sa kapangyarihan' para maging panliligalig. Pero kahit hindi panliligalig, puwedeng labag sa patakaran o krimen ang mura at pananakit.",
      "พนักงานรุ่นเดียวกันสองคนในคอลเซ็นเตอร์ (ศาลปกครองโซล ข่าว ก.พ. 2026) คนหนึ่งด่าอีกคนและผลักเก้าอี้ บริษัทลงโทษฐานกลั่นแกล้ง แต่ศาลเพิกถอนเพราะเป็นเพื่อนรุ่นเดียวกัน ไม่มีความได้เปรียบด้านตำแหน่งหรือความสัมพันธ์ → การกลั่นแกล้งต้องมี 'ความต่างของอำนาจ' แต่ถึงไม่ใช่การกลั่นแกล้ง คำหยาบและการทำร้ายก็อาจผิดระเบียบหรือเป็นอาชญากรรมได้",
      "Hai người vào cùng đợt ở một tổng đài (Tòa Hành chính Seoul, tin 2/2026). Một người chửi và đẩy ghế người kia. Công ty kỷ luật vì quấy rối, nhưng tòa hủy vì hai người cùng đợt, không có ưu thế về vị trí hay quan hệ. → Quấy rối phải có 'chênh lệch quyền lực'. Nhưng dù không phải quấy rối, chửi bới và hành hung vẫn có thể vi phạm nội quy hoặc là tội phạm.")),
    C(RN(7), L("고용노동부 매뉴얼에 실린 '괴롭힘으로 보지 않은' 실제 판단 예. ① 응급실에서 급한 상황에 선배 간호사가 큰 소리로 지시한 것. ② 15개월 동안 13번, 업무상 꼭 필요할 때 퇴근 후 카톡을 보낸 것. ③ 출장 보고를 빠뜨린 직원을 관리자가 바로잡은 것. → 업무상 필요하고, 정도가 지나치지 않으면 괴롭힘이 아니다. 반대로 같은 말이라도 반복되고 모욕적이면 괴롭힘이 된다.",
      "Mga totoong halimbawa sa manual ng Ministry of Labor na 'hindi panliligalig': ① Malakas na utos ng senior nurse sa emergency room sa oras ng emergency. ② 13 KakaoTalk sa loob ng 15 buwan pagkatapos ng trabaho kapag talagang kailangan. ③ Pagtatama ng manager sa empleyadong hindi nag-ulat ng business trip. → Hindi panliligalig kapag kailangan sa trabaho at hindi sobra. Pero nagiging panliligalig kapag paulit-ulit at nakakainsulto.",
      "ตัวอย่างจริงในคู่มือกระทรวงแรงงานที่ 'ไม่ถือเป็นการกลั่นแกล้ง' ① พยาบาลรุ่นพี่สั่งงานเสียงดังในห้องฉุกเฉินขณะเร่งด่วน ② ส่งคาคาโอหลังเลิกงาน 13 ครั้งใน 15 เดือนเมื่อจำเป็นจริง ③ ผู้จัดการแก้ไขพนักงานที่ไม่รายงานการไปทำงานนอกสถานที่ → ถ้าจำเป็นต่องานและไม่เกินควร ก็ไม่ใช่การกลั่นแกล้ง แต่ถ้าซ้ำ ๆ และดูถูก ก็กลายเป็นการกลั่นแกล้ง",
      "Ví dụ thực tế trong sổ tay của Bộ Lao động 'không bị coi là quấy rối': ① Y tá đàn chị lớn tiếng chỉ thị trong phòng cấp cứu lúc khẩn cấp. ② Nhắn KakaoTalk sau giờ làm 13 lần trong 15 tháng khi thật sự cần. ③ Quản lý nhắc nhở nhân viên quên báo cáo đi công tác. → Cần cho công việc và không quá mức thì không phải quấy rối. Nhưng lặp lại và xúc phạm thì thành quấy rối.")),
    { t: "note", x: L("공통점: 실제로 처벌·배상이 된 사건은 모두 증거(영상·메시지·녹음·목격자)가 있었습니다. 당하거나 봤다면 날짜·시간·내용을 바로 적어 두세요.",

        "A. การขู่โดยใช้สภาพการทำงานหรือการพำนักเป็นตัวประกันคือการกลั่นแกล้ง การหักเงินเดือนตามใจชอบก็ผิดกฎหมายอยู่แล้ว เก็บข้อความหรือเสียงไว้ และปรึกษา 1577-0071",

        "A. Kahit messenger sa labas ng trabaho, puwedeng panliligalig ang pambubukod at paninira ng mga katrabaho batay sa relasyon sa trabaho. Kung may kasamang nakakita, pakiusapang mag-screenshot.",

    C(SY(1), L("대법원(2018년 4월). 대법원은 성희롱인지 판단할 때 가해자의 의도가 아니라 '피해자와 같은 처지에 있는 보통 사람'이 성적 굴욕감이나 불쾌감을 느낄 만한지를 봐야 한다고 처음으로 기준을 밝혔다. 피해자가 바로 항의하지 않았다고 해서 거짓으로 보면 안 된다고도 했다. → \"그런 뜻 아니었다\", \"그때는 가만있었잖아\"는 변명이 되지 않는다.",

      "ศาลฎีกา (เม.ย. 2018) วางหลักครั้งแรกว่า การตัดสินว่าเป็นการล่วงละเมิดทางเพศหรือไม่ ไม่ได้ดูเจตนาผู้กระทำ แต่ดูว่า 'คนทั่วไปในสถานะเดียวกับผู้เสียหาย' จะรู้สึกอับอายหรือไม่พอใจทางเพศหรือไม่ และไม่ควรมองว่าโกหกเพียงเพราะผู้เสียหายไม่ประท้วงทันที → 'ไม่ได้ตั้งใจ' หรือ 'ตอนนั้นก็เงียบนี่' ไม่ใช่ข้ออ้าง",

const TRACK = (() => {
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let dev = get("dev", null);
  if (!dev) { dev = Math.random().toString(16).slice(2, 6).toUpperCase(); set("dev", dev); }
  const url = () => (window.SAFETY_CONFIG && window.SAFETY_CONFIG.sheetUrl) || "";

  // ---- 전송 대기열 ----
  // 같은 휴대폰에서 앱이 두 개(설치 앱 + 브라우저 탭 등) 열려 있어도 한 곳에서만 보내도록 잠금
  let flushing = false;
  function withLock(name, fn) {
    if (navigator.locks && navigator.locks.request) return navigator.locks.request(name, { ifAvailable: true }, l => l ? fn() : null);
    const k = "lk_" + name, now = Date.now();
    if (now - get(k, 0) < 20000) return Promise.resolve();
    set(k, now);
    return Promise.resolve(fn()).finally(() => set(k, 0));
  }
  async function flushNow() {
    let q;
    while ((q = get("queue", [])).length) {
      const item = q[0];
      const sentIds = get("sentIds", []);
      if (item.eid && sentIds.includes(item.eid)) { q.shift(); set("queue", q); continue; }   // 이미 보낸 기록은 건너뜀
      try {
        await fetch(url(), { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(item) });
        if (item.eid) set("sentIds", sentIds.concat(item.eid).slice(-100));
        const now = get("queue", []);                       // 보내는 동안 새로 쌓인 기록은 지우지 않음
        if (now.length && (now[0].eid ? now[0].eid === item.eid : now[0].time === item.time && now[0].type === item.type)) now.shift();
        set("queue", now);
      } catch (e) { break; }
    }
  }
  async function flush() {
    if (flushing || !url() || !navigator.onLine) return;
    flushing = true;
    try { await withLock("safety-flush", flushNow); } finally { flushing = false; }
  }
  addEventListener("online", flush);
  setTimeout(flush, 1500);
  function send(ev) {
    const n = get("name", "");
    if (!n) return;
    const q = get("queue", []);
    const item = Object.assign({ time: new Date().toISOString(), name: n, dev, lang: get("lang", "ko") }, window.WEEKINFO ? window.WEEKINFO() : {}, ev);
    item.eid = dev + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
    const last = q[q.length - 1];
    if (last && last.type === item.type && last.id === item.id && Date.parse(item.time) - Date.parse(last.time) < 2000) return;   // 같은 기록이 연달아 두 번 쌓이지 않게
    q.push(item);
    set("queue", q.slice(-300));
    flush();
  }

  // ---- 학습 시간: 화면이 보이고 최근 30초 안에 조작이 있을 때만 15초씩 더함 ----
  const TICK = 5, IDLE = 30;
  let cur = null, curTitle = "", lastAct = Date.now();
  ["scroll", "touchstart", "touchmove", "pointerdown", "pointermove", "keydown", "wheel"].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));   // PC는 마우스 움직임도 포함
  const secs = () => get("secs", {});
  const me = Math.random().toString(36).slice(2, 8);
  setInterval(() => {
    if (!cur || document.hidden || Date.now() - lastAct > IDLE * 1000) return;
    // 앱이 여러 개 열려 있어도 시간은 한 곳에서만 셈
    const own = get("tickOwner", null), now = Date.now();
    if (own && own.id !== me && now - own.t < TICK * 3000) return;
    set("tickOwner", { id: me, t: now });
    const s = secs(); s[cur] = (s[cur] || 0) + TICK; set("secs", s);
    const w = get("wsecs", {}); w[cur] = (w[cur] || 0) + TICK; set("wsecs", w);   // 이번 주 읽은 시간
  }, TICK * 1000);
  const lessonMin = id => Math.round((secs()[id] || 0) / 60);
  const weekMin = id => Math.round((get("wsecs", {})[id] || 0) / 60);        // 이 단원을 이번 주에 읽은 시간(분)
  const totalMin = () => Math.round(Object.values(secs()).reduce((a, b) => a + b, 0) / 60);
  function markSent(id) { const sent = get("sentSecs", {}); sent[id] = secs()[id] || 0; set("sentSecs", sent); }
  function leave(id, title) {
    // 단원을 떠날 때 아직 안 보낸 시간이 1분 이상이면 '학습' 기록으로 보냄
    if (!id || id === "quiz") return;
    const sent = get("sentSecs", {}), s = secs()[id] || 0;
    if (s - (sent[id] || 0) >= 60) { markSent(id); send({ type: "time", id, title, min: weekMin(id), totalMin: totalMin() }); }
  }
  addEventListener("visibilitychange", () => { if (document.hidden) leave(cur, curTitle); });

  return {
    dev,
    name: () => get("name", ""),
    setName(n) { n = String(n || "").trim().slice(0, 40); set("name", n); if (n) send({ type: "register", totalMin: totalMin() }); },
    best: () => get("best", null),
    setBest(s) { const b = get("best", null); if (b == null || s > b) set("best", s); },
    pending: () => get("queue", []).length,
    enabled: () => !!url(),
    send,
    setCurrent(id, title) { if (cur && cur !== id) leave(cur, curTitle); cur = id; curTitle = title || ""; lastAct = Date.now(); },
    lessonMin, weekMin, totalMin, markSent,
    lessonSecs: id => secs()[id] || 0,
    idle: () => document.hidden || Date.now() - lastAct > IDLE * 1000,
    weekSecs: id => get("wsecs", {})[id] || 0
  };
})();

const WEEK = (() => {
  const PER = 6;
  const DAY = 864e5;
  const EPOCH = new Date(2026, 9, 26); // 2026-10-26 (월) = 1주차
  const pad = x => String(x).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  function monday(d) { const m = new Date(d.getFullYear(), d.getMonth(), d.getDate()); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }
  function info(all, now) {
    now = now || new Date();
    const m = monday(now), sun = new Date(m.getFullYear(), m.getMonth(), m.getDate() + 6);
    const cycles = Math.max(1, Math.ceil(all.length / PER));
    const wi = Math.round((m - EPOCH) / (7 * DAY));
    const c = ((wi % cycles) + cycles) % cycles;
    return { id: ymd(m), no: c + 1, cycles, from: m, to: sun, lessons: all.slice(c * PER, c * PER + PER) };
  }
  function daily(now) {
    now = now || new Date();
    const d = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - EPOCH) / DAY);
    return DAILY[((d % DAILY.length) + DAILY.length) % DAILY.length];
  }
  const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
  return { PER, EPOCH, info, daily, md, ymd };
})();

@media(min-width:600px){.gd-bg{align-items:center}.gd{border-radius:18px}}
.gd h2{margin:0 0 4px;font-size:1.25rem}.gd .gd-sub{margin:0 0 14px;opacity:.75;font-size:.92rem}
.gd ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.gd li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px;border-radius:12px;background:var(--sunk,rgba(127,127,127,.09))}

    run(svg, step, still) {

        } else {

      case "pic": return `<figure class="pic"><img src="img/${b.src}" alt="" width="900" height="680" loading="lazy">${b.cap && lang !== "ko" ? `<figcaption>${T(b.cap)}</figcaption>` : ""}</figure>`;
      case "chk": return `<ul class="cklist">${b.items.map((i, k) => `<li><label><input type="checkbox" id="c-${k}-${Math.random().toString(36).slice(2, 7)}"><span>${T(i)}</span></label></li>`).join("")}</ul>`;
      case "photo": return `<figure class="photo"><img src="img/${b.src}" alt="" width="900" height="597" loading="lazy"><figcaption><b>✓ ${T(b.x)}</b><ul>${b.items.map(i => `<li>${T(i)}</li>`).join("")}</ul><small class="ai">${T(UI.aiImg)}</small></figcaption></figure>`;
      case "src": return `<div class="srcbox"><b>${T(UI.srcLabel)}</b><ul>${b.items.map(i => `<li lang="ko">${esc(i)}</li>`).join("")}</ul></div>`;
      case "help": return `<div class="help"><div><b>1350</b><strong>${T(UI.h1350)}</strong><span>${T(UI.h1350s)}</span></div><div><b>1577-0071</b><strong>${T(UI.h0071)}</strong><span>${T(UI.h0071s)}</span></div></div>`;
      case "ox": return `<section class="oxbox"><h4>✍ ${T(UI5.oxTitle)}</h4>${b.items.map(([q, o, why], k) =>
        `<details class="oxq"><summary><b>Q${k + 1}</b><span>${T(q)}</span><em>${T(UI5.oxTap)}</em></summary><p class="${o ? "o" : "x"}"><b>${o ? "⭕ O" : "❌ X"}</b> ${T(why)}</p></details>`).join("")}</section>`;
      case "motion": return `<div class="motion" data-motion="${esc(b.k)}"></div>`;
      case "call": return `<div class="call" role="note"><b>119</b><strong>${T(UI.callText)}</strong><span>${T(UI.callSub)}</span></div>`;
    }

  }

  function mkCard() {
    const pn = pDone(), pt = PW.lessons.length, nextP = PW.lessons.find(a => !pOk(a.lesson.id));
    return `<section class="weekcard mkcard"><div class="wtop"><div><span class="wno">${esc(pLabel())}</span><h2>↺ ${T(UI6.title)}</h2></div><div class="wcount">${pn}<small> / ${pt}</small></div></div>
      <p class="hint" style="margin:6px 0 0">${T(UI6.sub)}</p>

      <ul class="rows">${PW.lessons.map((a, k) => `<li><button type="button" data-go="${a.lesson.id}"><span class="n">${String(k + 1).padStart(2, "0")}</span><span class="t">${T(a.lesson.title)}${koSub(a.lesson.title)}</span><span class="chk ${pOk(a.lesson.id) ? "on" : ""}"></span></button></li>`).join("")}</ul>

  function lesson(id) {
    const k = ALL.findIndex(a => a.lesson.id === id);
    if (k < 0) return home();
    const { part, lesson: l, idx } = ALL[k];
    app.innerHTML = `<div class="crumb"><b>PART ${part.no}</b><span>${T(part.title)}</span></div>
      ${l.scene ? `<figure class="scenebox">${scene(l.scene)}</figure>` : ""}${WSET.has(l.id) ? `<span class="wtag">★ ${T(UI4.tag)}</span>` : (PSET.has(l.id) && mkOpen()) ? `<span class="wtag mk">↺ ${T(UI6.tag)}</span>` : `<div class="note" style="margin:0 0 10px"><span>${T(UI5.notWeek)} <button type="button" class="linkbtn" data-go="">${T(UI4.weekTitle)} →</button></span></div>`}<h1 class="ltitle">${T(l.title)}</h1>${lang !== "ko" ? `<p class="ltitle-ko" lang="ko">${esc(l.title.ko)}</p>` : ""}
      <div class="blocks">${l.blocks.map(block).join("")}${LSRC[l.id] ? block({ t: "src", items: LSRC[l.id] }) : ""}</div>
      <button type="button" class="mark" id="mark" aria-pressed="${!!done[l.id]}">${done[l.id] ? "✓ " + T(UI.doneOn) : T(UI.done)}</button>
      <p class="hint" id="waitHint" hidden style="text-align:center;margin-top:6px">${T(UI5.waitHint)}</p>`;
    // 최소 읽기 시간: 2분 (화면이 보이고 조작이 있을 때만 시간이 올라감)
    const MIN_SEC = 120, markEl = document.getElementById("mark"), hintEl = document.getElementById("waitHint");
    const need = () => Math.max(0, MIN_SEC - TRACK.weekSecs(l.id));
    const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    const paint = () => {
      if (done[l.id] || !need()) { markEl.disabled = false; markEl.textContent = done[l.id] ? "✓ " + tx(UI.doneOn) : tx(UI.done); hintEl.hidden = true; return true; }
      markEl.disabled = true; markEl.textContent = TRACK.idle() ? tx(UI5.paused) + " (" + fmt(need()) + ")" : "⏱ " + tx(UI5.wait).replace("{t}", fmt(need())); hintEl.hidden = false; return false;
    };
    if (!paint()) lessonTimer = setInterval(() => { if (paint()) { clearInterval(lessonTimer); lessonTimer = null; } }, 1000);
    // 2분을 채운 뒤 '다음'만 눌러도 '다 읽었어요'로 처리 (깜빡하고 넘어가는 경우 방지)
    const autoDone = () => { if (!done[l.id] && !need()) { markEl.onclick(); return true; } return false; };
    markEl.onclick = () => {
      if (!done[l.id] && need()) return;
      if (done[l.id]) return;                                   // 이미 읽은 단원은 실수로 체크가 풀리지 않게 함
      {
        ever[l.id] = 1; store.set("ever", ever);
        done[l.id] = 1; TRACK.markSent(l.id);
        // 지난주 보충 6단원을 다 마치면 지난주 이수로 기록 (요약 탭이 이번 주로 남도록 단원 기록보다 먼저 보냄)
        if (PSET.has(l.id) && mkOpen() && pDone() >= PW.lessons.length) {
          const hist = wHist(); hist[PW.id] = 1; store.set("wkHist", hist);
          TRACK.send({ type: "week", week: PW.id, wno: PW.no, wdone: PW.lessons.length, wtotal: PW.lessons.length, weekMin: null, totalMin: TRACK.totalMin() });
          mkJustDone = true;
        }
        TRACK.send({ type: "lesson", id: l.id, title: l.title.ko, count: Object.keys(done).length, total: ALL.length, min: TRACK.weekMin(l.id), totalMin: TRACK.totalMin() }); }
      store.set("done", done);
      if (done[l.id] && WSET.has(l.id)) {
        const nextA = WK.lessons.find(a => !done[a.lesson.id]);
        if (!nextA) {
          const hist = wHist();
          if (!hist[WK.id]) { hist[WK.id] = 1; store.set("wkHist", hist); TRACK.send({ type: "week", min: wMin(), totalMin: TRACK.totalMin() }); }
          go("");
        } else go(nextA.lesson.id);
        return;
      }
      if (done[l.id] && PSET.has(l.id)) {
        if (mkJustDone) { mkJustDone = false; go(""); return; }
        const nextP = PW.lessons.find(a => !pOk(a.lesson.id));
        if (nextP && mkOpen()) { go(nextP.lesson.id); return; }
      }
      if (done[l.id] && ALL[k + 1]) go(ALL[k + 1].lesson.id); else lesson(id);
    };
    pager.hidden = false;
    { const ib = document.getElementById("installBar"); if (ib) ib.hidden = true; }   // 설치 안내 막대가 '다음' 버튼을 가리지 않게
    const pv = document.getElementById("pv"), nx = document.getElementById("nx"), hm = document.getElementById("hm");
    pv.textContent = "← " + tx(UI.prev); hm.textContent = tx(UI.home);
    hm.onclick = () => go("");
    const wi = WK.lessons.findIndex(a => a.lesson.id === l.id);
    if (wi >= 0) {
      // 이번 주 교육 단원: 이전/다음은 이번 주 6단원 안에서만 이동
      const pw = WK.lessons[wi - 1], nw = WK.lessons[wi + 1];
      pv.disabled = !pw; pv.onclick = () => pw && go(pw.lesson.id);
      if (nw) { nx.textContent = tx(UI.next) + " →"; nx.onclick = () => autoDone() || go(nw.lesson.id); }
      else { nx.textContent = tx(UI.home) + " →"; nx.onclick = () => autoDone() || go(""); }
    } else if (PSET.has(l.id) && mkOpen()) {
      // 지난주 보충 단원: 지난주 6단원 안에서 이동
      const pi = PW.lessons.findIndex(a => a.lesson.id === l.id), pw = PW.lessons[pi - 1], nw = PW.lessons[pi + 1];
      pv.disabled = !pw; pv.onclick = () => pw && go(pw.lesson.id);
      if (nw) { nx.textContent = tx(UI.next) + " →"; nx.onclick = () => autoDone() || go(nw.lesson.id); }
      else { nx.textContent = tx(UI.home) + " →"; nx.onclick = () => autoDone() || go(""); }
    } else {
      pv.disabled = k === 0;
      pv.onclick = () => k > 0 && go(ALL[k - 1].lesson.id);
      if (ALL[k + 1]) { nx.textContent = tx(UI.next) + " →"; nx.onclick = () => go(ALL[k + 1].lesson.id); }
      else { nx.textContent = tx(UI.quizTitle) + " →"; nx.onclick = () => go("quiz"); }
    }
  }

  let qs = { i: 0, score: 0, picked: null };
  function quiz() {
    pager.hidden = true;
    if (qs.i >= QUIZ.length) {
      const pass = qs.score >= Math.ceil(QUIZ.length * 0.8);
      if (!qs.sent) { qs.sent = 1; TRACK.setBest(qs.score); TRACK.send({ type: "quiz", score: qs.score, total: QUIZ.length, count: Object.keys(done).length, min: TRACK.lessonMin("quiz"), totalMin: TRACK.totalMin() }); }
      app.innerHTML = `<div class="score"><div class="eyebrow">${T(UI.score)}</div>
        <div class="big">${qs.score}<small> / ${QUIZ.length}</small></div>
        <p>${T(pass ? UI.pass : UI.fail)}</p>
        <button type="button" class="cta" data-go="cert">${T(UI2.cert)} →</button>
        <button type="button" class="mark" id="again" style="border-color:var(--line);color:var(--ink)">${T(UI.retry)}</button>
        <button type="button" class="mark" id="toHome" style="border-color:var(--line);color:var(--ink)">${T(UI.home)}</button></div>`;
      document.getElementById("again").onclick = () => { qs = { i: 0, score: 0, picked: null }; quiz(); };
      document.getElementById("toHome").onclick = () => go("");
      return;
    }
    const q = QUIZ[qs.i], p = qs.picked;
    app.innerHTML = `<div class="qhead"><span>${T(UI.quizTitle)}</span><b>${qs.i + 1} / ${QUIZ.length}</b></div>
      <div class="track" style="margin-top:8px"><span style="width:${(qs.i / QUIZ.length) * 100}%"></span></div>
      <h2 class="qq">${T(q.q)}</h2>
      <div class="opts">${q.opts.map((o, j) => {
        const cls = p == null ? "" : j === q.ans ? "ok" : j === p ? "no" : "";
        return `<button type="button" data-j="${j}" class="${cls}" ${p != null ? "disabled" : ""}><span>${"ABC"[j]}</span><span>${T(o)}</span></button>`;
      }).join("")}</div>
      ${p != null ? `<div class="fb ${p === q.ans ? "ok" : "no"}" role="status"><b>${T(p === q.ans ? UI.correct : UI.wrong)}</b>${T(q.why)}</div>
      <button type="button" class="cta qnext" id="qn">${T(qs.i + 1 < QUIZ.length ? UI.nextQ : UI.result)} →</button>` : ""}`;
    app.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      if (qs.picked != null) return;
      qs.picked = +b.dataset.j; if (qs.picked === q.ans) qs.score++; quiz();
    });
    const qn = document.getElementById("qn");
    if (qn) { qn.onclick = () => { qs.i++; qs.picked = null; quiz(); window.scrollTo(0, 0); }; qn.focus({ preventScroll: true }); }
  }

  let lessonTimer = null, mkJustDone = false;
  function printView(arg) {
    pager.hidden = true;
    const cur = WEEK.info(ALL), weeks = [];
    const last = new Date(cur.from.getFullYear(), cur.from.getMonth(), cur.from.getDate() + 7 * cur.cycles);
    for (let d = new Date(WEEK.EPOCH); d < last; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7)) weeks.push(WEEK.info(ALL, d));
    const sel = weeks.find(w => w.id === arg) || cur;
    const wl = w => `${tx(UI4.weekNo).replace("{n}", w.no)} · ${WEEK.md(w.from)}~${WEEK.md(w.to)}`;
    const lname = (LANGS.find(x => x[0] === lang) || LANGS[0])[1];
    const opt = Object.assign({ pic: true, ox: true, src: true, story: true, brk: true }, store.get("popt", {}));
    const skip = new Set((store.get("pskip", {})[sel.id]) || []);
    const OPTS = [["pic", UIP.oPic], ["ox", UIP.oOx], ["story", UIP.oStory], ["src", UIP.oSrc], ["brk", UIP.oBrk]];
    const isStory = b => b.t === "def" && b.k && /^현장 이야기/.test(b.k.ko || "");
    const keep = b => !((!opt.pic && (b.t === "pic" || b.t === "photo" || b.t === "motion")) || (!opt.ox && b.t === "ox") || (!opt.src && b.t === "src") || (!opt.story && isStory(b)));
    const chosen = sel.lessons.filter(a => !skip.has(a.lesson.id));
    app.innerHTML = `<section class="pctl noprint"><h1>🖨 ${T(UIP.title)}</h1><p class="hint">${T(UIP.sub)}</p>
      <label>${T(UIP.week)}<select id="pweek">${weeks.map(w => `<option value="${w.id}"${w.id === sel.id ? " selected" : ""}>${esc(w.from.getFullYear() + " " + wl(w))}${w.id === cur.id ? " ★ " + esc(tx(UIP.now)) : ""}</option>`).join("")}</select></label>
      <div class="pgrp"><b>${T(UIP.lang)}</b><div class="pchips">${LANGS.map(([c, n]) => `<button type="button" class="pchip" data-pl="${c}" aria-pressed="${c === lang}" lang="${c}">${n}</button>`).join("")}</div></div>
      <div class="pgrp"><b>${T(UIP.lessons)}</b> <button type="button" class="linkbtn" id="pall">${T(UIP.all)}</button> · <button type="button" class="linkbtn" id="pnone">${T(UIP.none)}</button>
        <ul class="pchk">${sel.lessons.map((a, k) => `<li><label><input type="checkbox" data-pid="${a.lesson.id}"${skip.has(a.lesson.id) ? "" : " checked"}> <span>${k + 1}. ${T(a.lesson.title)}</span></label></li>`).join("")}</ul></div>
      <div class="pgrp"><b>${T(UIP.opts)}</b><ul class="pchk">${OPTS.map(([k, t]) => `<li><label><input type="checkbox" data-po="${k}"${opt[k] ? " checked" : ""}> <span>${T(t)}</span></label></li>`).join("")}</ul></div>
      <button type="button" class="cta" id="pgo"${chosen.length ? "" : " disabled"}>🖨 ${T(UIP.print)} (${chosen.length} / ${sel.lessons.length})</button></section>
      <div class="phead"><b>${T(UIP.head)}</b><span>${esc(wl(sel))} (${esc(WEEK.ymd(sel.from))} ~ ${esc(WEEK.ymd(sel.to))})</span><span>${esc(lname)}</span></div>
      <div class="${opt.brk ? "pbrk" : ""}">${chosen.map(a => { const k = sel.lessons.indexOf(a); return `<article class="plesson"><div class="crumb"><b>${k + 1} / ${sel.lessons.length} · PART ${a.part.no}</b><span>${T(a.part.title)}</span></div>
        <h1 class="ltitle">${T(a.lesson.title)}</h1>${lang !== "ko" ? `<p class="ltitle-ko" lang="ko">${esc(a.lesson.title.ko)}</p>` : ""}
        ${opt.pic && a.lesson.scene ? `<figure class="scenebox">${scene(a.lesson.scene)}</figure>` : ""}
        <div class="blocks">${(a.lesson.blocks.filter(keep).map(block).join("") + (opt.src && LSRC[a.lesson.id] ? block({ t: "src", items: LSRC[a.lesson.id] }) : "")).replace(/<details class="oxq">/g, '<details class="oxq" open>')}</div></article>`; }).join("")}</div>`;
    const again = () => { const y = scrollY; printView(sel.id); scrollTo(0, y); };
    document.getElementById("pweek").onchange = e => go("print/" + e.target.value);
    document.getElementById("pgo").onclick = () => window.print();
    MOTION.mount(app, lang, { print: true });
    app.querySelectorAll("[data-pl]").forEach(b => b.onclick = () => { const r = langsEl.querySelector(`button[data-l="${b.dataset.pl}"]`); if (r) r.click(); });
    const setSkip = ids => { const all = store.get("pskip", {}); all[sel.id] = ids; store.set("pskip", all); again(); };
    app.querySelectorAll("[data-pid]").forEach(c => c.onchange = () => setSkip([...app.querySelectorAll("[data-pid]")].filter(x => !x.checked).map(x => x.dataset.pid)));
    document.getElementById("pall").onclick = () => setSkip([]);
    document.getElementById("pnone").onclick = () => setSkip(sel.lessons.map(a => a.lesson.id));
    app.querySelectorAll("[data-po]").forEach(c => c.onchange = () => { opt[c.dataset.po] = c.checked; store.set("popt", opt); again(); });
  }

  function render() {
    if (lessonTimer) { clearInterval(lessonTimer); lessonTimer = null; }
    document.documentElement.lang = lang;
    langsEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
    document.getElementById("brandTxt").textContent = tx(UI.brand);
    const h = location.hash.slice(1);
    const cl = ALL.find(x => x.lesson.id === h);
    TRACK.setCurrent(cl ? h : h === "quiz" ? "quiz" : null, cl ? cl.lesson.title.ko : "퀴즈");
    if (!h) home(); else if (h === "print" || h.startsWith("print/")) printView(h.split("/")[1]); else if (h === "quiz") quiz(); else if (h === "cert") cert(); else if (h === "install") install(); else lesson(h);
    MOTION.mount(app, lang, { print: h.startsWith("print") });
  }
  render();
})();

</script>

<div id="installBar" class="installbar" hidden>
  <span id="installTxt"></span>
  <button type="button" id="installBtn"></button>
  <button type="button" id="installX" aria-label="close">✕</button>
</div>
<style>
.installbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#15191F;color:#fff;display:flex;gap:10px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-size:14px;border-top:4px solid #F5B800}
.installbar span{flex:1;min-width:0}
.installbar button{border:0;border-radius:8px;padding:9px 14px;font-weight:800;background:#F5B800;color:#15191F;flex:none}
.installbar #installX{background:transparent;color:#fff;padding:6px}
</style>
<script>
(function(){
  const ua = navigator.userAgent;
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isKakao = /KAKAOTALK/i.test(ua);
  const isInApp = isKakao || /NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|wv\)/i.test(ua);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  window.INSTALL_ENV = { isIOS, isInApp, isKakao, standalone, isSamsung: /SamsungBrowser/i.test(ua) };

  // 카카오톡 인앱 브라우저 → 외부 브라우저로 자동 전환
  if (isKakao && !sessionStorage.getItem("kakaoOut")) {
    try { sessionStorage.setItem("kakaoOut", "1"); } catch (e) {}
    location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
  }

  const T = {
    ko: ["홈 화면에 설치하면 앱처럼 쓸 수 있어요", "설치", "설치 방법", "이 화면에서는 설치가 안 됩니다. Chrome(아이폰은 Safari)으로 열어 주세요.", "주소 복사", "복사됨"],
    tl: ["I-install sa home screen para magamit na parang app", "I-install", "Paano", "Hindi ma-install dito. Buksan sa Chrome (iPhone: Safari).", "Kopyahin", "Nakopya"],
    th: ["ติดตั้งบนหน้าจอหลักเพื่อใช้เหมือนแอป", "ติดตั้ง", "วิธีติดตั้ง", "ติดตั้งในหน้านี้ไม่ได้ กรุณาเปิดด้วย Chrome (iPhone: Safari)", "คัดลอกลิงก์", "คัดลอกแล้ว"],
    vi: ["Cài lên màn hình chính để dùng như ứng dụng", "Cài đặt", "Cách cài", "Không cài được ở đây. Hãy mở bằng Chrome (iPhone: Safari).", "Sao chép", "Đã chép"]
  };
  const lang = () => { try { return JSON.parse(localStorage.getItem("lang")) || "ko"; } catch (e) { return "ko"; } };
  const bar = document.getElementById("installBar"), btn = document.getElementById("installBtn"), txt = document.getElementById("installTxt");
  let deferred = null, mode = "";
  window.INSTALL_PROMPT = () => deferred;
  const onHome = () => !location.hash || location.hash === "#";
  addEventListener("hashchange", () => { if (!onHome()) bar.hidden = true; });
  function show(m) {
    if (!onHome()) return;                                   // 단원 화면에서는 아래 버튼을 가리지 않게 표시하지 않음
    const t = T[lang()] || T.ko; mode = m;
    if (m === "prompt") { txt.textContent = t[0]; btn.textContent = t[1]; }
    else if (m === "inapp") { txt.textContent = t[3]; btn.textContent = t[4]; }
    else { txt.textContent = t[0]; btn.textContent = t[2]; }
    bar.hidden = false;
  }
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  if (standalone) return;
  let dismissed = false; try { dismissed = localStorage.getItem("installX") === "1"; } catch (e) {}
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; if (!dismissed) show("prompt"); });
  addEventListener("appinstalled", () => { bar.hidden = true; deferred = null; });
  if (isInApp) setTimeout(() => show("inapp"), 800);
  else if (!dismissed) setTimeout(() => { if (!deferred) show("help"); }, 3500);
  btn.onclick = async () => {
    if (mode === "prompt" && deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; bar.hidden = true; return; }
    if (mode === "inapp") {
      const t = T[lang()] || T.ko;
      try { await navigator.clipboard.writeText(location.origin + location.pathname); btn.textContent = t[5]; } catch (e) { prompt && 0; }
      return;
    }
    bar.hidden = true; location.hash = "install";
  };
  document.getElementById("installX").onclick = () => { bar.hidden = true; try { localStorage.setItem("installX", "1"); } catch (e) {} };
})();
</script>

</body>
</html>
