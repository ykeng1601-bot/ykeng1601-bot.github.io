<!doctype html>

<head>

<meta name="description" content="제조업 근로자를 위한 4개 언어(한국어·Filipino·ไทย·Tiếng Việt) 모바일 안전보건 교재">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>안전보건 나침반 모바일</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Noto+Sans:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow reading column (max 640px) like a pocket handbook; hazard-stripe band marks the brand, sign colors (red/yellow/blue/green) carry meaning only */
:root {
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --sunk: #E8EAE5;
  --ink: #15191F;
  --ink-2: #4A515C;
  --line: #D5D9D2;
  --chrome: #15191F;
  --hazard: #F5B800;
  --hazard-ink: #15191F;
  --ban: #D52B2B;
  --must: #1D5FB4;
  --ok: #17805A;
  --ok-soft: #E3F2EB;
  --bad-soft: #FBE7E5;
  --note-soft: #FFF5D1;
  --sign-bg: #FFFFFF;
  --shadow: 0 1px 2px rgba(20,25,31,.06), 0 4px 14px rgba(20,25,31,.06);
  --f-body: "Noto Sans KR", "Noto Sans", "Noto Sans Thai", system-ui, sans-serif;
  --f-num: "Barlow Condensed", "Noto Sans", sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --surface: #1A1F25; --sunk: #232931; --ink: #EEF0EC; --ink-2: #A9B0BA; --line: #2E353E;
    --hazard: #F5B800; --hazard-ink: #15191F; --ban: #FF6B5E; --must: #6FA6F2; --ok: #4CC79A;
    --ok-soft: #173229; --bad-soft: #3A1E1D; --note-soft: #362D10; --sign-bg: #F4F4F0;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1A1F25; --sunk: #232931; --ink: #EEF0EC; --ink-2: #A9B0BA; --line: #2E353E;
  --hazard: #F5B800; --hazard-ink: #15191F; --ban: #FF6B5E; --must: #6FA6F2; --ok: #4CC79A;
  --ok-soft: #173229; --bad-soft: #3A1E1D; --note-soft: #362D10; --sign-bg: #F4F4F0;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
:lang(th) body, body:lang(th) { line-height: 1.8; }
html[lang="vi"] body, html[lang="tl"] body { font-family: "Noto Sans", "Noto Sans KR", system-ui, sans-serif; }
html[lang="th"] body { font-family: "Noto Sans Thai", "Noto Sans", "Noto Sans KR", system-ui, sans-serif; line-height: 1.8; }
.ko-sub { font-family: "Noto Sans KR", system-ui, sans-serif; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--must); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--chrome); color: #fff; }
.bar-in { max-width: 640px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; background: none; border: 0; padding: 0; color: #fff; margin-right: auto; }
.brand i { width: 22px; height: 22px; border-radius: 4px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 5px, #15191F 5px 10px); }
.langs { display: flex; gap: 2px; background: rgba(255,255,255,.1); padding: 3px; border-radius: 999px; }
.langs button { border: 0; background: transparent; color: rgba(255,255,255,.75); padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.langs button[aria-pressed="true"] { background: var(--hazard); color: var(--hazard-ink); }
.stripe { height: 6px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, #15191F 12px 24px); }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 120px; }

/* home */
.hero { padding-block: 8px 20px; display: grid; gap: 10px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--ink-2); }
.hero h1 { font-size: clamp(28px, 7.5vw, 38px); font-weight: 900; white-space: pre-line; letter-spacing: -.01em; }
.hero p { margin: 0; color: var(--ink-2); max-width: 34em; }
.prog { display: grid; gap: 6px; margin-top: 6px; }
.prog-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.prog-top b { font-family: var(--f-num); font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.track span { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .4s; }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--hazard); color: var(--hazard-ink); font-weight: 800; padding: 13px 20px; border-radius: var(--r); font-size: 16px; }

.part { margin-top: 28px; }
.part-head { display: grid; grid-template-columns: auto 1fr; gap: 0 14px; align-items: end; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.part-no { font-family: var(--f-num); font-weight: 800; font-size: 56px; line-height: .8; grid-row: span 2; }
.part-no small { display: block; font-size: 13px; letter-spacing: .12em; font-weight: 600; color: var(--ink-2); line-height: 1.4; }
.part-head h2 { font-size: 19px; font-weight: 800; }
.part-head p { margin: 0; font-size: 13px; color: var(--ink-2); }
.group { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--ink-2); padding: 16px 0 4px; text-transform: uppercase; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows button { width: 100%; text-align: left; display: grid; grid-template-columns: 34px 1fr 24px; gap: 10px; align-items: center; padding: 12px 0; background: none; border: 0; border-bottom: 1px solid var(--line); }
.rows .n { font-family: var(--f-num); font-weight: 600; font-size: 18px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rows .t { font-weight: 700; min-width: 0; }
.rows .t small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-2); }
.chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.chk.on { background: var(--ok); border-color: var(--ok); }
.chk.on::after { content: ""; width: 9px; height: 5px; border: solid #fff; border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px,-1px); }

.quizcard { margin-top: 32px; background: var(--chrome); border: 1px solid var(--line); color: #fff; border-radius: 14px; padding: 20px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.quizcard::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, #15191F 12px 24px); }
.quizcard h2 { font-size: 22px; font-weight: 900; margin-top: 4px; }
.quizcard p { margin: 0; color: rgba(255,255,255,.75); }
.quizcard .cta { justify-self: start; }
.src { margin-top: 32px; font-size: 12px; color: var(--ink-2); line-height: 1.6; }

/* lesson */
.crumb { font-size: 13px; color: var(--ink-2); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.crumb b { white-space: nowrap; flex: none; font-family: var(--f-num); font-size: 15px; background: var(--ink); color: var(--bg); padding: 0 7px; border-radius: 4px; letter-spacing: .04em; }
.ltitle { font-size: clamp(26px, 7vw, 34px); font-weight: 900; margin: 8px 0 2px; }
.ltitle-ko { color: var(--ink-2); font-size: 15px; font-weight: 500; margin: 0 0 6px; }
.blocks { display: grid; gap: 18px; margin-top: 18px; }
.blocks > * { margin: 0; min-width: 0; }
.lead { font-size: 18px; font-weight: 500; }
.blocks h3 { font-size: 17px; font-weight: 800; padding-top: 6px; display: flex; gap: 8px; align-items: center; }
.blocks h3::before { content: ""; width: 4px; height: 18px; background: var(--ink); border-radius: 2px; flex: none; }
.blocks h3.do::before { background: var(--ok); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps li::before { content: counter(s); font-family: var(--f-num); font-weight: 800; font-size: 17px; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; margin-top: 1px; }
.steps.do li { background: var(--ok-soft); padding: 10px 12px; border-radius: var(--r); }
.steps.do li::before { background: var(--ok); color: #fff; }
.steps.bad li::before { background: var(--ban); color: #fff; }
.dots { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.stat { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 14px 16px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border-left: 6px solid var(--ban); }
.stat b { font-family: var(--f-num); font-size: 48px; font-weight: 800; line-height: 1; color: var(--ban); font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--ink-2); }
.def { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.def strong { font-size: 15px; }
.def ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.def p { margin: 0; }
.note, .warn { padding: 12px 14px; border-radius: var(--r); background: var(--note-soft); display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
.note::before, .warn::before { content: "!"; width: 22px; height: 22px; border-radius: 50%; background: var(--hazard); color: var(--hazard-ink); font-weight: 900; display: grid; place-items: center; font-size: 14px; margin-top: 2px; }
.warn { background: var(--bad-soft); }
.warn::before { content: "✕"; background: var(--ban); color: #fff; font-size: 12px; }
.case { border: 2px solid var(--ban); border-radius: var(--r); overflow: hidden; }
.case > div { padding: 12px 14px; }
.case .ck { background: var(--ban); color: #fff; font-weight: 800; padding: 6px 14px; font-size: 14px; }
.case .cl { background: var(--ok-soft); border-top: 1px solid var(--line); }
.case .cl b { color: var(--ok); margin-right: 6px; }
.kv { display: grid; border-top: 1px solid var(--line); margin: 0; }
.kv div { display: grid; grid-template-columns: minmax(96px, 34%) 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv dt { font-weight: 700; font-size: 14px; }
.kv dd { margin: 0; font-size: 15px; }
.signs h4 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.signs h4 i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.signs.ban h4 i { background: var(--ban); border-radius: 50%; }
.signs.caution h4 i { background: var(--hazard); clip-path: polygon(50% 0, 100% 100%, 0 100%); border-radius: 0; }
.signs.must h4 i { background: var(--must); border-radius: 50%; }
.signs.info h4 i { background: var(--ok); }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.sgrid figure { margin: 0; background: var(--sign-bg); border-radius: 8px; padding: 8px 4px 8px; text-align: center; border: 1px solid var(--line); }
.sgrid .sg { width: 60px; height: 60px; display: block; margin: 0 auto 6px; }
.sgrid figcaption { font-size: 12.5px; font-weight: 700; line-height: 1.3; color: #15191F; }
.sgrid figcaption small, .ppe small { display: block; font-weight: 400; font-size: 11px; color: #5A616B; }
.ppe { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ppe figure { margin: 0; background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.ppe .ph { background: #fff; display: grid; place-items: center; height: 104px; padding: 8px; }
.ppe .ph img { max-height: 88px; width: auto; }
.ppe figcaption { padding: 8px 10px 10px; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.ppe figcaption b { display: block; color: var(--ink); font-size: 15px; }
.ppe figcaption small { color: var(--ink-2); }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pics figure { margin: 0; }
.pics img, .pic img { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--sunk); }
.pics figcaption { font-size: 13.5px; margin-top: 6px; line-height: 1.45; display: grid; grid-template-columns: 20px 1fr; gap: 6px; }
.pics figcaption b { font-family: var(--f-num); font-weight: 800; width: 20px; height: 20px; border-radius: 50%; background: var(--ban); color: #fff; display: grid; place-items: center; font-size: 13px; }
.pic { margin: 0; }
.pic figcaption { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.call { background: var(--ban); color: #fff; border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.call b { font-family: var(--f-num); font-size: 56px; font-weight: 800; line-height: .9; grid-row: span 2; }
.call strong { font-size: 16px; }
.call span { font-size: 13px; opacity: .92; }

.mark { margin-top: 26px; width: 100%; border: 2px solid var(--ok); background: transparent; color: var(--ok); font-weight: 800; padding: 13px; border-radius: var(--r); display: flex; gap: 8px; justify-content: center; align-items: center; }
.mark[aria-pressed="true"] { background: var(--ok); color: #fff; }

.pager { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.pager-in { max-width: 640px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; }
.pager button { border: 1px solid var(--line); background: var(--surface); padding: 11px 10px; border-radius: var(--r); font-weight: 700; font-size: 14px; min-width: 0; }
.pager .nx { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pager button:disabled { opacity: .35; cursor: default; }

/* quiz */
.qhead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.qhead b { font-family: var(--f-num); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.qq { font-size: 21px; font-weight: 800; margin: 14px 0 16px; }
.opts { display: grid; gap: 10px; }
.opts button { text-align: left; padding: 14px 16px; border-radius: var(--r); border: 2px solid var(--line); background: var(--surface); font-weight: 600; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; }
.opts button span:first-child { font-family: var(--f-num); font-weight: 800; width: 26px; height: 26px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; }
.opts button.ok { border-color: var(--ok); background: var(--ok-soft); }
.opts button.ok span:first-child { background: var(--ok); color: #fff; }
.opts button.no { border-color: var(--ban); background: var(--bad-soft); }
.opts button.no span:first-child { background: var(--ban); color: #fff; }
.opts button:disabled { cursor: default; color: var(--ink); }
.fb { margin-top: 14px; padding: 12px 14px; border-radius: var(--r); background: var(--sunk); }
.fb b { display: block; }
.fb.ok b { color: var(--ok); } .fb.no b { color: var(--ban); }
.qnext { margin-top: 16px; width: 100%; }
.score { text-align: center; padding: 30px 0 10px; display: grid; gap: 10px; justify-items: center; }
.score .big { font-family: var(--f-num); font-weight: 800; font-size: 96px; line-height: 1; }
.score .big small { font-size: 36px; color: var(--ink-2); }

.srcbox { font-size: 12.5px; color: var(--ink-2); border-top: 1px dashed var(--line); padding-top: 10px; }
.srcbox b { font-size: 12px; letter-spacing: .06em; }
.srcbox ul { margin: 4px 0 0; padding-left: 1.1em; }
.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.help > div { background: var(--chrome); color: #fff; border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.help b { font-family: var(--f-num); font-size: 36px; font-weight: 800; line-height: 1; color: var(--hazard); font-variant-numeric: tabular-nums; }
.help strong { font-size: 15px; }
.help span { font-size: 13px; opacity: .85; }
.ico .hz { stroke: var(--ban); }
.lic { width: 88px; height: 88px; border-radius: 16px; background: var(--surface); border: 2px solid var(--ink); display: grid; place-items: center; margin-top: 14px; color: var(--ink); }
.ppe .ph .ico { color: #15191F; }
.scenebox { margin: 14px 0 0; border-radius: 14px; overflow: hidden; border: 2px solid var(--ink); background: #E6EBEF; }
.scene { display: block; width: 100%; height: auto; }
.blocks ul.cklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cklist label { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
.cklist input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.cklist input:checked + span { color: var(--ink-2); text-decoration: line-through; }
.photo { margin: 0; border-radius: 14px; overflow: hidden; border: 2px solid var(--ok); background: var(--surface); }
.photo img { display: block; width: 100%; height: auto; }
.photo figcaption { padding: 12px 14px; display: grid; gap: 6px; }
.photo figcaption b { color: var(--ok); font-size: 15px; }
.photo .ai { font-size: 11.5px; color: var(--ink-2); }
.photo ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; font-size: 14.5px; }
.namecard { margin-top: 18px; background: var(--surface); border: 2px solid var(--hazard); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.namecard h2 { font-size: 18px; font-weight: 800; }
.namecard .notice { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.namecard form { display: flex; gap: 8px; }
.namecard form .cta { flex: none; padding: 11px 16px; }
.namecard input { flex: 1; min-width: 0; width: 0; font: inherit; font-size: 17px; padding: 11px 12px; border: 2px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--ink); }
.namecard input:focus { border-color: var(--ink); outline: none; }
.namecard .hint, .cert .hint { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.namecard.on { border-color: var(--ok); gap: 8px; }
.namecard.on b { font-size: 18px; }
.namebtns { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--ink-2); text-decoration: underline; font-size: 14px; }
.cta.small { padding: 9px 14px; font-size: 14px; }
.sync { font-size: 12px; color: var(--ink-2); }
.cert { border: 3px solid var(--ok); border-radius: 16px; overflow: hidden; background: var(--surface); }
.cert-top { background: var(--ok); color: #fff; font-weight: 800; font-size: 18px; padding: 14px 16px; }
.cert dl { margin: 0; padding: 8px 16px; }
.cert dl div { display: grid; grid-template-columns: 40% 1fr; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cert dt { color: var(--ink-2); font-size: 14px; }
.cert dd { margin: 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.cert dd b { font-family: var(--f-num); font-size: 26px; }
.cert dd.nm { font-weight: 800; font-size: 20px; }
.cert .track { margin: 6px 16px 10px; }

.score { justify-items: center; }

.ways { display: grid; gap: 10px; margin-top: 10px; }
.way { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; position: relative; }
.way h3 { font-size: 16px; font-weight: 800; }
.way p { margin: 6px 0 0; font-size: 15px; }
.way.mine { border: 2px solid var(--hazard); }
.way .tag { position: absolute; top: -10px; right: 12px; background: var(--hazard); color: var(--hazard-ink); font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; }
.hint { font-size: 12.5px; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const g = (t, inner) => `<g transform="${t}">${inner}</g>`;

const TRACK = (() => {
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let dev = get("dev", null);
  if (!dev) { dev = Math.random().toString(16).slice(2, 6).toUpperCase(); set("dev", dev); }
  const url = () => (window.SAFETY_CONFIG && window.SAFETY_CONFIG.sheetUrl) || "";

  // ---- 전송 대기열 ----
  let flushing = false;
  async function flush() {
    if (flushing || !url() || !navigator.onLine) return;
    flushing = true;
    let q = get("queue", []);
    while (q.length) {
      try {
        await fetch(url(), { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(q[0]) });
        q.shift(); set("queue", q);
      } catch (e) { break; }
    }
    flushing = false;
  }
  addEventListener("online", flush);
  setTimeout(flush, 1500);
  function send(ev) {
    const n = get("name", "");
    if (!n) return;
    const q = get("queue", []);
    q.push(Object.assign({ time: new Date().toISOString(), name: n, dev, lang: get("lang", "ko") }, ev));
    set("queue", q.slice(-300));
    flush();
  }

  // ---- 학습 시간: 화면이 보이고 최근 90초 안에 조작이 있을 때만 15초씩 더함 ----
  const TICK = 15, IDLE = 90;
  let cur = null, curTitle = "", lastAct = Date.now();
  ["scroll", "touchstart", "pointerdown", "keydown", "wheel"].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
  const secs = () => get("secs", {});
  setInterval(() => {
    if (!cur || document.hidden || Date.now() - lastAct > IDLE * 1000) return;
    const s = secs(); s[cur] = (s[cur] || 0) + TICK; set("secs", s);
  }, TICK * 1000);
  const lessonMin = id => Math.round((secs()[id] || 0) / 60);
  const totalMin = () => Math.round(Object.values(secs()).reduce((a, b) => a + b, 0) / 60);
  function markSent(id) { const sent = get("sentSecs", {}); sent[id] = secs()[id] || 0; set("sentSecs", sent); }
  function leave(id, title) {
    // 단원을 떠날 때 아직 안 보낸 시간이 1분 이상이면 '학습' 기록으로 보냄
    if (!id || id === "quiz") return;
    const sent = get("sentSecs", {}), s = secs()[id] || 0;
    if (s - (sent[id] || 0) >= 60) { markSent(id); send({ type: "time", id, title, min: Math.round(s / 60), totalMin: totalMin() }); }
  }
  addEventListener("visibilitychange", () => { if (document.hidden) leave(cur, curTitle); });

  return {
    dev,
    name: () => get("name", ""),
    setName(n) { n = String(n || "").trim().slice(0, 40); set("name", n); if (n) send({ type: "register", totalMin: totalMin() }); },
    best: () => get("best", null),
    setBest(s) { const b = get("best", null); if (b == null || s > b) set("best", s); },
    pending: () => get("queue", []).length,
    enabled: () => !!url(),
    send,
    setCurrent(id, title) { if (cur && cur !== id) leave(cur, curTitle); cur = id; curTitle = title || ""; lastAct = Date.now(); },
    lessonMin, totalMin, markSent
  };
})();

      s: L("오른쪽 위 ⋮ 또는 ··· → '다른 브라우저로 열기' → Chrome(아이폰은 Safari) 선택 → 아래 방법으로 설치",
        "Pindutin ang ⋮ o ··· sa kanang itaas → 'Open in other browser' → piliin ang Chrome (iPhone: Safari) → sundin ang paraan sa ibaba",
        "แตะ ⋮ หรือ ··· มุมขวาบน → 'เปิดด้วยเบราว์เซอร์อื่น' → เลือก Chrome (iPhone: Safari) → ติดตั้งตามวิธีด้านล่าง",
        "Nhấn ⋮ hoặc ··· góc trên phải → 'Mở bằng trình duyệt khác' → chọn Chrome (iPhone: Safari) → cài theo cách bên dưới") },
    { k: "chrome", t: L("안드로이드 Chrome", "Android Chrome", "Android Chrome", "Android Chrome"),
      s: L("오른쪽 위 ⋮ → '홈 화면에 추가' 또는 '앱 설치' → 설치", "⋮ sa kanang itaas → 'Add to Home screen' o 'Install app' → Install", "⋮ มุมขวาบน → 'เพิ่มไปยังหน้าจอหลัก' หรือ 'ติดตั้งแอป' → ติดตั้ง", "⋮ góc trên phải → 'Thêm vào màn hình chính' hoặc 'Cài đặt ứng dụng' → Cài đặt") },
    { k: "samsung", t: L("삼성 인터넷", "Samsung Internet", "Samsung Internet", "Samsung Internet"),
      s: L("아래쪽 ≡ 메뉴 → '현재 페이지 추가' → '홈 화면' → 추가", "≡ menu sa ibaba → 'Add page to' → 'Home screen' → Add", "เมนู ≡ ด้านล่าง → 'เพิ่มหน้าไปยัง' → 'หน้าจอหลัก' → เพิ่ม", "Menu ≡ phía dưới → 'Thêm trang vào' → 'Màn hình chính' → Thêm") },
    { k: "ios", t: L("아이폰 Safari", "iPhone Safari", "iPhone Safari", "iPhone Safari"),
      s: L("아래쪽 공유 버튼(□↑) → '홈 화면에 추가' → 추가", "Share button (□↑) sa ibaba → 'Add to Home Screen' → Add", "ปุ่มแชร์ (□↑) ด้านล่าง → 'เพิ่มไปยังหน้าจอโฮม' → เพิ่ม", "Nút Chia sẻ (□↑) phía dưới → 'Thêm vào MH chính' → Thêm") }
  ]
};

</script>
<script>
(function () {
  const PARTS = window.NEW_PARTS;
  const ALL = [];
  PARTS.forEach(p => p.lessons.forEach((l, i) => ALL.push({ part: p, lesson: l, idx: i })));
  const LANGS = [["ko", "한국어"], ["tl", "Filipino"], ["th", "ไทย"], ["vi", "Tiếng Việt"]];
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let lang = store.get("lang", null);
  if (!lang) {
    const n = (navigator.language || "ko").toLowerCase();
    lang = n.startsWith("th") ? "th" : n.startsWith("vi") ? "vi" : (n.startsWith("fil") || n.startsWith("tl")) ? "tl" : "ko";
  }
  let done = store.get("done", {});
  const app = document.getElementById("app");
  const pager = document.getElementById("pager");
  const tx = o => (o && (o[lang] || o.ko)) || "";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const T = o => esc(tx(o));
  const koSub = o => lang === "ko" ? "" : `<small class="ko-sub" lang="ko">${esc(o.ko)}</small>`;

  // ---------- language bar ----------
  const langsEl = document.getElementById("langs");
  langsEl.innerHTML = LANGS.map(([c, n]) => `<button type="button" data-l="${c}" lang="${c}">${n}</button>`).join("");
  langsEl.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    lang = b.dataset.l; store.set("lang", lang); render();
  });
  document.getElementById("brand").onclick = () => go("");

  function go(h) { if (location.hash.slice(1) === h) render(); else location.hash = h; }
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  // ---------- blocks ----------
  function block(b) {
    switch (b.t) {
      case "lead": return `<p class="lead">${T(b.x)}</p>`;
      case "p": return `<p>${T(b.x)}</p>`;
      case "h": return `<h3 class="${b.tone || ""}">${T(b.x)}</h3>`;
      case "ol": return `<ol class="steps ${b.tone || ""}">${b.items.map(i => `<li><span>${T(i)}</span></li>`).join("")}</ol>`;
      case "ul": return `<ul class="dots">${b.items.map(i => `<li>${T(i)}</li>`).join("")}</ul>`;
      case "stat": return `<div class="stat"><b>${esc(b.n)}</b><span>${T(b.x)}</span></div>`;
      case "def": return `<div class="def"><strong>${T(b.k)}</strong>${b.v ? `<p>${T(b.v)}</p>` : ""}${b.list ? `<ul>${b.list.map(i => `<li>${T(i)}</li>`).join("")}</ul>` : ""}</div>`;
      case "note": return `<div class="note"><span>${T(b.x)}</span></div>`;
      case "warn": return `<div class="warn"><span>${T(b.x)}</span></div>`;
      case "case": return `<div class="case"><div class="ck">${T(b.k)}</div><div>${T(b.v)}</div><div class="cl"><b>${T(UI.caseLesson)}</b>${T(b.lesson)}</div></div>`;
      case "kv": return `<dl class="kv">${b.rows.map(([k, v]) => `<div><dt>${T(k)}</dt><dd>${T(v)}</dd></div>`).join("")}</dl>`;
      case "signs": return `<section class="signs ${b.cls}"><h4><i></i>${T(b.x)}</h4><div class="sgrid">${b.items.map(([c, n]) =>
        `<figure>${SG(c)}<figcaption>${T(n)}${koSub(n)}</figcaption></figure>`).join("")}</div></section>`;
      case "ppe": return `<div class="ppe">${b.items.map(([src, n, w]) =>
        `<figure><div class="ph">${src.startsWith("s:") ? SG(src.slice(2)) : icon(src.slice(2), 66)}</div><figcaption><b>${T(n)}</b>${koSub(n)}${T(w)}</figcaption></figure>`).join("")}</div>`;
      case "pics": return `<div class="pics">${b.items.map((c, k) =>
        `<figure><img src="img/${b.base}${k + 1}.jpg" alt="${T(c)}" width="520" height="350" loading="lazy"><figcaption><b>${k + 1}</b><span>${T(c)}</span></figcaption></figure>`).join("")}</div>`;
      case "pic": return `<figure class="pic"><img src="img/${b.src}" alt="" width="900" height="680" loading="lazy">${b.cap && lang !== "ko" ? `<figcaption>${T(b.cap)}</figcaption>` : ""}</figure>`;
      case "chk": return `<ul class="cklist">${b.items.map((i, k) => `<li><label><input type="checkbox" id="c-${k}-${Math.random().toString(36).slice(2, 7)}"><span>${T(i)}</span></label></li>`).join("")}</ul>`;
      case "photo": return `<figure class="photo"><img src="img/${b.src}" alt="" width="900" height="597" loading="lazy"><figcaption><b>✓ ${T(b.x)}</b><ul>${b.items.map(i => `<li>${T(i)}</li>`).join("")}</ul><small class="ai">${T(UI.aiImg)}</small></figcaption></figure>`;
      case "src": return `<div class="srcbox"><b>${T(UI.srcLabel)}</b><ul>${b.items.map(i => `<li lang="ko">${esc(i)}</li>`).join("")}</ul></div>`;
      case "help": return `<div class="help"><div><b>1350</b><strong>${T(UI.h1350)}</strong><span>${T(UI.h1350s)}</span></div><div><b>1577-0071</b><strong>${T(UI.h0071)}</strong><span>${T(UI.h0071s)}</span></div></div>`;
      case "call": return `<div class="call" role="note"><b>119</b><strong>${T(UI.callText)}</strong><span>${T(UI.callSub)}</span></div>`;
    }
    return "";
  }

  // ---------- views ----------
  function home() {
    pager.hidden = true;
    const n = ALL.filter(a => done[a.lesson.id]).length;
    const firstOpen = ALL.find(a => !done[a.lesson.id]) || ALL[0];
    let h = `<section class="hero">
      <div class="eyebrow">${T(UI.heroEyebrow)}</div>
      <h1>${T(UI.heroTitle)}</h1>
      <p>${T(UI.heroText)}</p>
      <div class="prog"><div class="prog-top"><span>${T(UI.progress)}</span><b>${n} / ${ALL.length}</b></div>
      <div class="track"><span style="width:${(n / ALL.length) * 100}%"></span></div></div>
      <div><button class="cta" type="button" data-go="${firstOpen.lesson.id}">${T(n ? UI.cont : UI.start)} →</button></div>
    </section>${nameCard()}`;
    PARTS.forEach(p => {
      h += `<section class="part"><div class="part-head"><div class="part-no"><small>PART</small>${p.no}</div><h2>${T(p.title)}</h2><p>${T(p.sub)}</p></div><ul class="rows">`;
      p.lessons.forEach((l, i) => {
        const g = p.groups && p.groups.find(g => g.at === i);
        if (g) h += `</ul><div class="group">${T(g.x)}</div><ul class="rows">`;
        const num = i + 1;
        h += `<li><button type="button" data-go="${l.id}"><span class="n">${String(num).padStart(2, "0")}</span><span class="t">${T(l.title)}${koSub(l.title)}</span><span class="chk ${done[l.id] ? "on" : ""}" aria-label="${done[l.id] ? T(UI.doneOn) : ""}"></span></button></li>`;
      });
      h += `</ul></section>`;
    });
    h += `<section class="quizcard"><h2>${T(UI.quizTitle)}</h2><p>${esc(tx(UI.quizSub).replace("11", QUIZ.length))}</p><button class="cta" type="button" data-go="quiz">${T(UI.quizStart)} →</button></section>`;
    if (!(window.INSTALL_ENV && window.INSTALL_ENV.standalone)) h += `<button type="button" class="mark howbtn" data-go="install">📲 ${T(UI3.howTitle)}</button>`;
    h += `<p class="src">${T(UI.source)}<br>${T(UI.source4)}</p>`;
    app.innerHTML = h;
  }

  function lesson(id) {
    const k = ALL.findIndex(a => a.lesson.id === id);
    if (k < 0) return home();
    const { part, lesson: l, idx } = ALL[k];
    app.innerHTML = `<div class="crumb"><b>PART ${part.no}</b><span>${T(part.title)}</span></div>
      ${l.scene ? `<figure class="scenebox">${scene(l.scene)}</figure>` : ""}<h1 class="ltitle">${T(l.title)}</h1>${lang !== "ko" ? `<p class="ltitle-ko" lang="ko">${esc(l.title.ko)}</p>` : ""}
      <div class="blocks">${l.blocks.map(block).join("")}${LSRC[l.id] ? block({ t: "src", items: LSRC[l.id] }) : ""}</div>
      <button type="button" class="mark" id="mark" aria-pressed="${!!done[l.id]}">${done[l.id] ? "✓ " + T(UI.doneOn) : T(UI.done)}</button>`;
    document.getElementById("mark").onclick = () => {
      if (done[l.id]) delete done[l.id]; else { done[l.id] = 1; TRACK.markSent(l.id); TRACK.send({ type: "lesson", id: l.id, title: l.title.ko, count: Object.keys(done).length, total: ALL.length, min: TRACK.lessonMin(l.id), totalMin: TRACK.totalMin() }); }
      store.set("done", done);
      if (done[l.id] && ALL[k + 1]) go(ALL[k + 1].lesson.id); else lesson(id);
    };
    pager.hidden = false;
    const pv = document.getElementById("pv"), nx = document.getElementById("nx"), hm = document.getElementById("hm");
    pv.textContent = "← " + tx(UI.prev); hm.textContent = tx(UI.home);
    pv.disabled = k === 0;
    pv.onclick = () => k > 0 && go(ALL[k - 1].lesson.id);
    hm.onclick = () => go("");
    if (ALL[k + 1]) { nx.textContent = tx(UI.next) + " →"; nx.onclick = () => go(ALL[k + 1].lesson.id); }
    else { nx.textContent = tx(UI.quizTitle) + " →"; nx.onclick = () => go("quiz"); }
  }

  let qs = { i: 0, score: 0, picked: null };
  function quiz() {
    pager.hidden = true;
    if (qs.i >= QUIZ.length) {
      const pass = qs.score >= Math.ceil(QUIZ.length * 0.8);
      if (!qs.sent) { qs.sent = 1; TRACK.setBest(qs.score); TRACK.send({ type: "quiz", score: qs.score, total: QUIZ.length, count: Object.keys(done).length, min: TRACK.lessonMin("quiz"), totalMin: TRACK.totalMin() }); }
      app.innerHTML = `<div class="score"><div class="eyebrow">${T(UI.score)}</div>
        <div class="big">${qs.score}<small> / ${QUIZ.length}</small></div>
        <p>${T(pass ? UI.pass : UI.fail)}</p>
        <button type="button" class="cta" data-go="cert">${T(UI2.cert)} →</button>
        <button type="button" class="mark" id="again" style="border-color:var(--line);color:var(--ink)">${T(UI.retry)}</button>
        <button type="button" class="mark" id="toHome" style="border-color:var(--line);color:var(--ink)">${T(UI.home)}</button></div>`;
      document.getElementById("again").onclick = () => { qs = { i: 0, score: 0, picked: null }; quiz(); };
      document.getElementById("toHome").onclick = () => go("");
      return;
    }
    const q = QUIZ[qs.i], p = qs.picked;
    app.innerHTML = `<div class="qhead"><span>${T(UI.quizTitle)}</span><b>${qs.i + 1} / ${QUIZ.length}</b></div>
      <div class="track" style="margin-top:8px"><span style="width:${(qs.i / QUIZ.length) * 100}%"></span></div>
      <h2 class="qq">${T(q.q)}</h2>
      <div class="opts">${q.opts.map((o, j) => {
        const cls = p == null ? "" : j === q.ans ? "ok" : j === p ? "no" : "";
        return `<button type="button" data-j="${j}" class="${cls}" ${p != null ? "disabled" : ""}><span>${"ABC"[j]}</span><span>${T(o)}</span></button>`;
      }).join("")}</div>
      ${p != null ? `<div class="fb ${p === q.ans ? "ok" : "no"}" role="status"><b>${T(p === q.ans ? UI.correct : UI.wrong)}</b>${T(q.why)}</div>
      <button type="button" class="cta qnext" id="qn">${T(qs.i + 1 < QUIZ.length ? UI.nextQ : UI.result)} →</button>` : ""}`;
    app.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      if (qs.picked != null) return;
      qs.picked = +b.dataset.j; if (qs.picked === q.ans) qs.score++; quiz();
    });
    const qn = document.getElementById("qn");
    if (qn) { qn.onclick = () => { qs.i++; qs.picked = null; quiz(); window.scrollTo(0, 0); }; qn.focus({ preventScroll: true }); }
  }

  function nameCard() {
    const nm = TRACK.name();
    if (!nm || editing) return `<section class="namecard" id="namecard"><h2>${T(UI2.nameTitle)}</h2>
      <p class="notice">${T(UI2.notice)}</p>
      <form id="nameForm"><input id="nameInput" type="text" autocomplete="name" maxlength="40" placeholder="${T(UI2.ph)}" value="${esc(nm)}" required><button type="submit" class="cta">${T(UI2.save)}</button></form>
      <p class="hint">${T(UI2.hint)}</p></section>`;
    const pend = TRACK.pending();
    return `<section class="namecard on"><div><b>${esc(nm)}</b>${T(UI2.hello)}</div>
      <div class="namebtns"><button type="button" class="linkbtn" id="editName">${T(UI2.editName)}</button><button type="button" class="cta small" data-go="cert">${T(UI2.cert)}</button></div>
      ${TRACK.enabled() ? `<small class="sync">${pend ? "⏳ " + T(UI2.pending) : "✓ " + T(UI2.synced)}</small>` : ""}</section>`;
  }
  let editing = false;
  app.addEventListener("submit", e => {
    if (e.target.id !== "nameForm") return;
    e.preventDefault();
    const v = document.getElementById("nameInput").value.trim();
    if (!v) return;
    TRACK.setName(v); editing = false; home();
  });
  app.addEventListener("click", e => { if (e.target.id === "editName") { editing = true; home(); setTimeout(() => document.getElementById("nameInput")?.focus(), 0); } });

  function cert() {
    pager.hidden = true;
    const nm = TRACK.name();
    if (!nm) { app.innerHTML = `<p class="lead">${T(UI2.needName)}</p>${nameCard()}`; return; }
    const n = ALL.filter(a => done[a.lesson.id]).length, best = TRACK.best();
    const d = new Date(), pad = x => String(x).padStart(2, "0");
    const ds = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    app.innerHTML = `<section class="cert"><div class="cert-top">${T(UI2.certTitle)}</div>
      <dl>
        <div><dt>${T(UI2.certName)}</dt><dd class="nm">${esc(nm)}</dd></div>
        <div><dt>${T(UI2.certLessons)}</dt><dd><b>${n}</b> / ${ALL.length}</dd></div>
        <div><dt>${T(UI2.certTime)}</dt><dd><b>${TRACK.totalMin()}</b>${T(UI2.minUnit)}</dd></div>
        <div><dt>${T(UI2.certQuiz)}</dt><dd>${best == null ? T(UI2.notTaken) : `<b>${best}</b> / ${QUIZ.length}`}</dd></div>
        <div><dt>${T(UI2.certDate)}</dt><dd>${ds}</dd></div>
        <div><dt>${T(UI2.certDev)}</dt><dd>${TRACK.dev}</dd></div>
      </dl>
      <div class="track"><span style="width:${(n / ALL.length) * 100}%"></span></div>
      <p class="hint">${T(UI2.certNote)}</p></section>
      <button type="button" class="mark" data-go="" style="border-color:var(--line);color:var(--ink)">${T(UI.home)}</button>`;
  }

  function install() {
    pager.hidden = true;
    const ib = document.getElementById("installBar"); if (ib) ib.hidden = true;
    const env = window.INSTALL_ENV || {};
    const mine = env.isInApp ? "inapp" : env.isIOS ? "ios" : env.isSamsung ? "samsung" : "chrome";
    const dp = window.INSTALL_PROMPT && window.INSTALL_PROMPT();
    app.innerHTML = `<h1 class="ltitle">${T(UI3.howTitle)}</h1><p class="lead">${T(UI3.howLead)}</p>
      ${dp ? `<button type="button" class="cta" id="doInstall" style="width:100%;margin:6px 0 4px">${T(UI3.installNow)}</button>` : ""}
      <div class="ways">${UI3.ways.map(w => `<section class="way ${w.k === mine ? "mine" : ""}">${w.k === mine ? `<span class="tag">${T(UI3.mine)}</span>` : ""}<h3>${T(w.t)}</h3><p>${T(w.s)}</p></section>`).join("")}</div>
      <p class="hint" style="margin-top:14px">${T(UI3.done)}</p>
      <p class="hint">${esc(location.origin + location.pathname)}</p>
      <button type="button" class="mark" data-go="" style="border-color:var(--line);color:var(--ink)">${T(UI.home)}</button>`;
    const d = document.getElementById("doInstall");
    if (d) d.onclick = async () => { const p = window.INSTALL_PROMPT(); if (p) { p.prompt(); await p.userChoice; } go(""); };
  }

  app.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

  function render() {
    document.documentElement.lang = lang;
    langsEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
    document.getElementById("brandTxt").textContent = tx(UI.brand);
    const h = location.hash.slice(1);
    const cl = ALL.find(x => x.lesson.id === h);
    TRACK.setCurrent(cl ? h : h === "quiz" ? "quiz" : null, cl ? cl.lesson.title.ko : "퀴즈");
    if (!h) home(); else if (h === "quiz") quiz(); else if (h === "cert") cert(); else if (h === "install") install(); else lesson(h);
  }
  render();
})();

</script>

<div id="installBar" class="installbar" hidden>
  <span id="installTxt"></span>
  <button type="button" id="installBtn"></button>
  <button type="button" id="installX" aria-label="close">✕</button>
</div>
<style>
.installbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#15191F;color:#fff;display:flex;gap:10px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-size:14px;border-top:4px solid #F5B800}
.installbar span{flex:1;min-width:0}
.installbar button{border:0;border-radius:8px;padding:9px 14px;font-weight:800;background:#F5B800;color:#15191F;flex:none}
.installbar #installX{background:transparent;color:#fff;padding:6px}
</style>
<script>
(function(){
  const ua = navigator.userAgent;
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isKakao = /KAKAOTALK/i.test(ua);
  const isInApp = isKakao || /NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|wv\)/i.test(ua);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  window.INSTALL_ENV = { isIOS, isInApp, isKakao, standalone, isSamsung: /SamsungBrowser/i.test(ua) };

  // 카카오톡 인앱 브라우저 → 외부 브라우저로 자동 전환
  if (isKakao && !sessionStorage.getItem("kakaoOut")) {
    try { sessionStorage.setItem("kakaoOut", "1"); } catch (e) {}
    location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
  }

  const T = {
    ko: ["홈 화면에 설치하면 앱처럼 쓸 수 있어요", "설치", "설치 방법", "이 화면에서는 설치가 안 됩니다. Chrome(아이폰은 Safari)으로 열어 주세요.", "주소 복사", "복사됨"],
    tl: ["I-install sa home screen para magamit na parang app", "I-install", "Paano", "Hindi ma-install dito. Buksan sa Chrome (iPhone: Safari).", "Kopyahin", "Nakopya"],
    th: ["ติดตั้งบนหน้าจอหลักเพื่อใช้เหมือนแอป", "ติดตั้ง", "วิธีติดตั้ง", "ติดตั้งในหน้านี้ไม่ได้ กรุณาเปิดด้วย Chrome (iPhone: Safari)", "คัดลอกลิงก์", "คัดลอกแล้ว"],
    vi: ["Cài lên màn hình chính để dùng như ứng dụng", "Cài đặt", "Cách cài", "Không cài được ở đây. Hãy mở bằng Chrome (iPhone: Safari).", "Sao chép", "Đã chép"]
  };
  const lang = () => { try { return JSON.parse(localStorage.getItem("lang")) || "ko"; } catch (e) { return "ko"; } };
  const bar = document.getElementById("installBar"), btn = document.getElementById("installBtn"), txt = document.getElementById("installTxt");
  let deferred = null, mode = "";
  window.INSTALL_PROMPT = () => deferred;
  function show(m) {
    const t = T[lang()] || T.ko; mode = m;
    if (m === "prompt") { txt.textContent = t[0]; btn.textContent = t[1]; }
    else if (m === "inapp") { txt.textContent = t[3]; btn.textContent = t[4]; }
    else { txt.textContent = t[0]; btn.textContent = t[2]; }
    bar.hidden = false;
  }
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  if (standalone) return;
  let dismissed = false; try { dismissed = localStorage.getItem("installX") === "1"; } catch (e) {}
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; if (!dismissed) show("prompt"); });
  addEventListener("appinstalled", () => { bar.hidden = true; deferred = null; });
  if (isInApp) setTimeout(() => show("inapp"), 800);
  else if (!dismissed) setTimeout(() => { if (!deferred) show("help"); }, 3500);
  btn.onclick = async () => {
    if (mode === "prompt" && deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; bar.hidden = true; return; }
    if (mode === "inapp") {
      const t = T[lang()] || T.ko;
      try { await navigator.clipboard.writeText(location.origin + location.pathname); btn.textContent = t[5]; } catch (e) { prompt && 0; }
      return;
    }
    bar.hidden = true; location.hash = "install";
  };
  document.getElementById("installX").onclick = () => { bar.hidden = true; try { localStorage.setItem("installX", "1"); } catch (e) {} };
})();
</script>
